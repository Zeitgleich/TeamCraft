# Dex for the demo instance (docs/operations.md, "Demo instance"): static users, no Keycloak.
# Placeholders only: replace demo.example.com, and give every password through the environment
# (hashFromEnv, a bcrypt hash: `htpasswd -bnBC 10 "" 'the password' | tr -d ':\n'`). Never commit
# real hashes or the reviewers' passwords.
issuer: https://demo.example.com/dex

storage:
  # Refresh tokens survive a Dex restart; the nightly reset does not touch this file.
  type: sqlite3
  config:
    file: /var/lib/dex/dex.db

web:
  http: 127.0.0.1:5556
  # The web app fetches discovery and tokens from the browser.
  allowedOrigins: ["https://demo.example.com"]
  allowedHeaders: ["Authorization", "DPoP"]

oauth2:
  responseTypes: ["code"]
  # No consent screen between the login form and the app.
  skipApprovalScreen: true
  # Only the local password database: Dex opens its login form directly.
  passwordConnector: local

expiry:
  idTokens: 1h
  refreshTokens:
    # A reviewer's sign-in lasts through a review; the nightly reset ends it anyway.
    validIfNotUsedFor: 720h
    absoluteLifetime: 2160h

enablePasswordDB: true

staticClients:
  - id: teamcraft
    name: TeamCraft
    public: true
    redirectURIs:
      - de.zeitgleich.teamcraft:/oauth/callback # Android, iOS
      - https://demo.example.com/ # web
      - http://127.0.0.1:9/callback # dev/dev-token.py, the seeding run

# Roles come from `groups` ([oidc] roles_claim = "groups" in teamcraft.demo.toml). The seeding run
# (tests/e2e/src/bin/demo-seed.rs) signs in every one of these users.
staticPasswords:
  - email: owner@example.com
    username: owner
    name: Demo Owner
    userID: 6f0c1d7e-0000-4000-8000-000000000001
    groups: ["owner"]
    hashFromEnv: DEX_HASH_OWNER
  - email: alex@example.com
    username: alex
    name: Alex Example
    userID: 6f0c1d7e-0000-4000-8000-000000000002
    groups: ["member"]
    hashFromEnv: DEX_HASH_SEED
  - email: sam@example.com
    username: sam
    name: Sam Sample
    userID: 6f0c1d7e-0000-4000-8000-000000000003
    groups: ["member"]
    hashFromEnv: DEX_HASH_SEED
  - email: robin@example.com
    username: robin
    name: Robin Placeholder
    userID: 6f0c1d7e-0000-4000-8000-000000000004
    groups: ["member"]
    hashFromEnv: DEX_HASH_SEED
  # One reviewer account per store.
  - email: reviewer-1@example.com
    username: reviewer-1
    name: Review Account 1
    userID: 6f0c1d7e-0000-4000-8000-000000000011
    groups: ["member"]
    hashFromEnv: DEX_HASH_REVIEWER_1
  - email: reviewer-2@example.com
    username: reviewer-2
    name: Review Account 2
    userID: 6f0c1d7e-0000-4000-8000-000000000012
    groups: ["member"]
    hashFromEnv: DEX_HASH_REVIEWER_2
