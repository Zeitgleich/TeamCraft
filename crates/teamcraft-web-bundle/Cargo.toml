[package]
publish = false
name = "teamcraft-web-bundle"
description = "Build step of the web client: splits the app's wasm into lazily loaded chunks, binds and names them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Splits the linked wasm at the `wasm_split` points (Leptos `#[lazy]`); what cargo-leptos `--split`
# runs. Trunk has no such step (#334).
wasm_split_cli_support = "0.2.4"
# Must be exactly the wasm-bindgen version of Cargo.lock: the generated glue and the macros the app
# was compiled with have to match (wasm-bindgen refuses otherwise, with a clear message).
wasm-bindgen-cli-support = "=0.2.129"
# Content hashes for file names and subresource integrity; already in the tree (teamcraft-crypto).
sha2 = "0.11.0"
# Reads the finished wasm files for the function names map (#2228); already in the tree
# (wasm_split_cli_support, the same version).
wasmparser = "0.263.0"
# Demangles the names in it; already in the tree (wasm-bindgen-cli-support).
rustc-demangle = "0.1.28"
# Compresses the map (tens of MB of JSON); already in the tree.
flate2 = "1.1.10"
serde.workspace = true
serde_json.workspace = true
