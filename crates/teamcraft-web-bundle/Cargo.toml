[package]
publish = false
name = "teamcraft-web-bundle"
description = "Build step of the web client: splits the app's wasm into lazily loaded chunks, binds and names them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Splits the linked wasm at the `wasm_split` points (Leptos `#[lazy]`); what cargo-leptos `--split`
# runs. Trunk has no such step (#334).
wasm_split_cli_support = "0.2.4"
# Must be exactly the wasm-bindgen version of Cargo.lock: the generated glue and the macros the app
# was compiled with have to match (wasm-bindgen refuses otherwise, with a clear message).
wasm-bindgen-cli-support = "=0.2.129"
# Content hashes for file names and subresource integrity; already in the tree (teamcraft-crypto).
sha2 = "0.11.0"
