# TeamCraft integration bridge (ARCHITECTURE.md §4.5). Run it where the data comes from: next to the
# service that writes logs, on a NAS, on the hotline host. Never on the VPS that runs the server.
#
#   teamcraft-bridge --config teamcraft-bridge.toml
#
# Any value can be overridden by an environment variable: prefix TEAMCRAFT_BRIDGE_, nesting
# separated by a double underscore, e.g. TEAMCRAFT_BRIDGE_SERVER__BOT_TOKEN. The config file path
# can also be given as TEAMCRAFT_BRIDGE_CONFIG.
#
# One-time setup:
#   1. An admin registers the bridge:  POST /api/v1/admin/bots {"name": "NAS bridge"}  -> bot token
#      (shown once) and the bot's user ID.
#   2. A channel admin adds the bot to each channel the bridge serves (channel settings ->
#      Integrations) and a workspace admin adds the channel's sources there.
#   3. Start the bridge once with identity.passphrase set. It enrolls the bot's device, generates the
#      keys and joins the channels through the welcomes the server holds for it.

[server]
url = "https://chat.example.com"
# The bot token. Prefer the environment variable or a file over writing it here.
# bot_token = "tcb_..."
# bot_token_file = "/run/secrets/teamcraft-bridge-token"

# The bridge's local database (SQLCipher) holds the bot's keys and the content keys of its channels.
[store]
path = "/var/lib/teamcraft-bridge/bridge.db"
# 32 random bytes as base64: `openssl rand -base64 32`. Prefer TEAMCRAFT_BRIDGE_STORE__KEY or a file.
# key = "..."
key_file = "/run/secrets/teamcraft-bridge-db-key"

[identity]
device_name = "NAS bridge"
# Recovery passphrase wrapping the bot's backup key on the server. Needed on the first run and when
# the local database is lost; afterwards it is not read.
# passphrase = "..."
passphrase_file = "/run/secrets/teamcraft-bridge-passphrase"
# Argon2id cost of the passphrase (defaults: 131072 KiB, 3 iterations).
# argon2_memory_kib = 131072
# argon2_iterations = 3

# Where webhooks and logs are accepted. The default is loopback on IPv4 and IPv6. To accept
# connections from other hosts use "[::]:8088" (dual stack) behind a firewall or TLS proxy: the
# source token is the only credential and travels in the URL.
[listen]
addrs = ["127.0.0.1:8088", "[::1]:8088"]
max_body_bytes = 1048576
# Webhook requests and log lines per minute of all sources together (each source has its own limit too).
total_rate_limit_per_minute = 12000
# On shutdown, requests still running after this many seconds are cut off.
drain_timeout_secs = 10

# Webhooks with files (multipart/form-data, docs/bridge.md "Files"): each file is encrypted with its
# own key; the files of a message are uploaded, and completed together, before the message is sent.
# The form's other fields count against listen.max_body_bytes.
[files]
# Files per message for sources that don't set their own (at most 16); 0 takes none.
max_files_per_message = 10
# Largest file in bytes; the server's attachment limit applies too.
max_file_bytes = 104857600
# Bytes of webhooks with files per minute and source (no request carries more), and of all sources
# together. max_file_bytes <= source_bytes_per_minute <= total_bytes_per_minute.
source_bytes_per_minute = 536870912
total_bytes_per_minute = 1073741824
# Requests with files running at once, all sources together and per source; more get 503 before
# their body is read.
max_concurrent_requests = 4
max_concurrent_requests_per_source = 2
# A request whose body sends nothing for this many seconds is cut off (408).
idle_timeout_secs = 30
# Bytes in the spool directory at most, all requests together (503 beyond).
max_spool_bytes = 2147483648
# The server's message limit ([limits] max_ciphertext_bytes): text and files that won't fit in one
# message are refused (413) before anything is uploaded.
max_message_bytes = 1048576
# Pictures larger than this get no thumbnail (decoding takes about 4 bytes a pixel).
max_thumbnail_pixels = 16000000
# Where files wait while they go up: plaintext, for the bridge's user only (0700, checked at start),
# deleted after the request. Default: "spool" next to store.path; a volume of its own keeps it from
# filling the database's.
# spool_dir = "/var/spool/teamcraft-bridge"

# Idempotency-Key of webhooks (docs/bridge.md "Retries"): a producer's retry of a request the bridge
# accepted is answered again without posting. Kept in memory only; a restart forgets the keys.
[idempotency]
# How long the key of an accepted request is remembered, in seconds from its answer on.
window_secs = 600
# Keys remembered at most, all sources together; beyond, the source holding the most loses its
# oldest first.
max_keys = 10000
# Their memory at most; each key counts its length and 128 bytes.
max_bytes = 4194304

# Log lines are collected into one message per conversation.
[batching]
interval_ms = 1000
max_bytes = 65536
max_line_bytes = 8192

# The bridge sees the plaintext of its channels, so it builds their search index segments (closed
# months) instead of every member client doing it. 0 turns it off.
[index]
interval_secs = 3600

# Sources: workspace admins add them in the app (channel settings -> Integrations -> Sources). The
# bridge reads them from its channels, encrypted, and serves them at once; nothing goes into this file.
#
#   Slack/Mattermost-compatible webhook (JSON, or form with `payload=`):
#     curl -d '{"text":"Deploy finished","username":"ci"}' http://127.0.0.1:8088/hooks/<token>
#   With files (multipart/form-data, like Discord's and Slack's webhooks):
#     curl -F 'text=Nightly report' -F 'file=@report.pdf' http://127.0.0.1:8088/hooks/<token>
#   Retries that never post twice (one key per message, sent with every attempt):
#     curl --retry 5 -H "Idempotency-Key: $(uuidgen)" -d '{"text":"Done"}' http://127.0.0.1:8088/hooks/<token>
#   Log lines (plain text; NDJSON with Content-Type application/x-ndjson):
#     journalctl -f | curl -T - -H 'Content-Type: text/plain' http://127.0.0.1:8088/ingest/<token>
[app_sources]
enabled = true
# Pages of older history (50 messages each) read once per channel when the database is new, for
# sources announced before it existed.
history_pages = 200

# Optional: sources written into this file instead (read at start). One [[sources]] block per producer.
# [[sources]]
# name = "nas-logs"
# token = "replace-with-24-or-more-random-characters"
# conversation_id = "123456789012345678"
# # Webhook requests / log lines per minute; more are refused (429) or dropped and reported.
# rate_limit_per_minute = 600
# # Log levels that make a line an alert, which mentions the people below.
# alert_levels = ["error", "fatal", "critical"]
# # Webhook attachments with color "danger" are alerts too.
# danger_is_alert = true
# # Files one webhook message may carry (default: files.max_files_per_message).
# max_files_per_message = 10
# # People mentioned by alerts (the mention reaches them even though integration channels push nothing else).
# mentions = [{ user_id = "123456789012345679", name = "alice" }]
