[package]
publish = false
name = "teamcraft-ui"
description = "Leptos UI shared by the desktop (Tauri) and web clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Leptos 0.8.2x and Tauri 2 need a newer compiler than the workspace baseline.
rust-version.workspace = true

[lints]
workspace = true

[features]
# Built-in demo data (`MockBackend`) for UI development and screenshots:
# `TEAMCRAFT_WEB_FEATURES=demo trunk serve` (scripts/build-app.sh builds the app), then `?backend=mock`. Never part of a shipped build: release builds refuse it (src/lib.rs) and the
# release workflows check the bundle for demo data (scripts/check-no-demo-data.py).
demo = []

[dependencies]
teamcraft-proto.workspace = true
teamcraft-client-api = { path = "../teamcraft-client-api" }
leptos = { version = "0.8.22", features = ["csr"] }
# Browser bindings: DOM access for focus, scroll measurement, storage and clipboard-free helpers.
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement",
  "HtmlCollection", "KeyboardEvent", "MediaQueryList", "CssStyleDeclaration", "Node", "NodeList", "Storage", "Window",
  "DomTokenList", "ScrollToOptions", "ScrollBehavior", "File", "FileList", "Navigator", "ServiceWorkerContainer", "ServiceWorker", "MessageEvent", "ServiceWorkerRegistration", "Location", "History",
  "Blob", "BlobPropertyBag", "Url", "DragEvent", "DataTransfer", "ClipboardEvent", "Request", "RequestInit", "RequestMode", "RequestRedirect", "RequestCache", "Response", "Headers", "UrlSearchParams", "ResizeObserver", "DomRect",
  "BroadcastChannel", "MouseEvent", "StorageManager", "ServiceWorkerState", "VisibilityState", "NotificationOptions",
  "PointerEvent", "WheelEvent", "HtmlAnchorElement", "HtmlImageElement", "AddEventListenerOptions",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "HtmlMediaElement", "HtmlVideoElement", "Selection", "MediaStream",
  "VisualViewport", "MutationObserver", "MutationObserverInit", "Performance", "TouchEvent", "TouchList", "Touch",
  "HtmlDocument", "DomParser", "SupportedType", "Range", "Text", "CharacterData", "InputEvent", "TreeWalker",
  "ImageBitmap", "IntersectionObserver", "IntersectionObserverEntry",
  # The pre-join speaker test (speaker_test.rs): it has to start inside the click.
  "AudioContext", "AudioContextState", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode",
  "AudioNode", "AudioScheduledSourceNode", "BaseAudioContext",
] }
# Fluent: the i18n format mandated by the project rules (English source + translations).
fluent-bundle = "0.16"
unic-langid = "0.9"
# Real QR codes for device linking (pure Rust, no image support needed).
qrcode = { version = "0.14", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Image previews of the brand editor are data: URLs (the page's CSP allows data: images).
base64.workspace = true
secrecy.workspace = true
wasm-bindgen-futures = "0.4"
# Joins and selects of futures (the desktop mirror refreshes its reads concurrently, web_core).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# One-shot handoff of a free download slot between inline image previews (media_cache).
futures-channel = "0.3"
# OIDC authorization code + PKCE for the browser flow. Only the protocol parts are used; HTTP goes
# through the browser's fetch (no reqwest on wasm). PKCE is delegated to this audited crate.
oauth2 = { version = "5", default-features = false }
# oauth2 draws its random values (state, PKCE verifier) from getrandom; wasm needs the JS backend.
getrandom = { version = "0.2", features = ["js"] }
tracing = "0.1"
console_error_panic_hook = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "fmt"] }
tracing-web = "0.1"

# The browser build runs the client core in the page (src/web_core.rs): same engine as the desktop app.
[target.'cfg(target_arch = "wasm32")'.dependencies]
teamcraft-core = { path = "../teamcraft-core", default-features = false, features = ["ui"] }
teamcraft-crypto = { path = "../teamcraft-crypto" }
# Signs and verifies call key bindings for the call module (web_calls); the call engine itself is
# in that module, which the page loads only for a call. `web-api`: the WebCodecs bindings with
# which the desktop webview decodes the shell's call video (shell_video).
teamcraft-media = { path = "../teamcraft-media", default-features = false, features = ["call-auth", "web-api"] }
