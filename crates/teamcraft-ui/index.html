<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget: Chrome shrinks the layout for the on-screen keyboard, so the composer stays above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>TeamCraft</title>
    <link data-trunk rel="css" href="style/main.css" />
    <link data-trunk rel="css" href="style/loader.css" />
    <!-- The brand of the host name this page is served from (colors only; docs/branding.md §4). After main.css so it wins. 404 in the desktop shell, which applies the brand from code. -->
    <link rel="stylesheet" href="/api/v1/brand/theme.css" />
    <!-- Installing the web app (add to home screen): name, theme color and icons of the brand (docs/branding.md §4).
         theme-color is updated to the current theme by viewport.rs. -->
    <link rel="manifest" href="/api/v1/brand/manifest.webmanifest" />
    <meta name="theme-color" content="#111926" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link data-trunk rel="copy-dir" href="icons" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <!-- Thumbnails of the photo backgrounds, loaded lazily by the picker (the full pictures are only in the desktop app). -->
    <link data-trunk rel="copy-dir" href="../../assets/backgrounds/thumbs" data-target-path="backgrounds" />
    <!-- The app's wasm is built, split into lazily loaded chunks and started by scripts/build-app.sh (a
         Trunk hook, #334): Trunk can't split wasm. loader.js drives the loading screen below. -->
    <!-- Declared but skipped: without a main Rust asset Trunk would build the crate itself. -->
    <link data-trunk rel="rust" data-bin="teamcraft-ui" data-trunk-skip />
    <!-- The calls (#330): their own ES module, which the app imports in the background after sign-in (web_calls.rs), so they are not part of the first download. -->
    <link data-trunk rel="copy-file" href="../teamcraft-media/src/call_web/teamcraft-call-worklet.js" />
    <link data-trunk rel="rust" href="../teamcraft-web-calls/Cargo.toml" data-type="worker" data-bindgen-target="web" data-cargo-profile-release="web-release" data-wasm-opt="z" data-wasm-opt-params="--converge --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
    <!-- The service worker's Rust half (push wake-ups); scripts/finish-sw.sh inlines it into sw.js. -->
    <link data-trunk rel="rust" href="../teamcraft-web-sw/Cargo.toml" data-type="worker" data-bindgen-target="no-modules" data-cargo-profile-release="web-release" data-wasm-opt="z" data-wasm-opt-params="--converge --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
  </head>
  <body>
    <!-- The loading screen: plain HTML and CSS (style/loader.css), so it shows before any script runs.
         loader.js adds progress, the cached brand and errors, and removes it once the app is mounted. -->
    <div id="tc-loader" class="tc-loader" role="status" aria-busy="true">
      <div class="tc-loader-mark" aria-hidden="true">
        <span class="tc-loader-dot"></span><span class="tc-loader-dot"></span><span class="tc-loader-dot"></span>
        <img class="tc-loader-logo" alt="" hidden />
      </div>
      <div class="tc-loader-name"></div>
      <div class="tc-loader-bar" aria-hidden="true"><div class="tc-loader-progress"></div></div>
      <!-- Shown by CSS alone after a long wait, in case no script runs at all (init.js blocked or
           missing, no module support); loader.js removes it as soon as it starts. English only:
           without script there is no language choice. -->
      <a class="tc-loader-reload" href="" aria-label="Reload" title="Reload">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="tc-loader-error" role="alert" hidden>
        <p class="tc-loader-error-title"></p>
        <p class="tc-loader-error-body"></p>
        <button type="button" class="tc-loader-retry"></button>
      </div>
    </div>
  </body>
</html>
