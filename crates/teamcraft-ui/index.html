<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget: Chrome shrinks the layout for the on-screen keyboard, so the composer stays above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>TeamCraft</title>
    <link data-trunk rel="css" href="style/main.css" />
    <link data-trunk rel="css" href="style/loader.css" />
    <!-- The brand of the host name this page is served from (colors only; docs/branding.md §4). After main.css so it wins. 404 in the desktop shell, which applies the brand from code. -->
    <link rel="stylesheet" href="/api/v1/brand/theme.css" />
    <!-- Installing the web app (add to home screen): name, theme color and icons of the brand (docs/branding.md §4).
         theme-color is updated to the current theme by viewport.rs. -->
    <link rel="manifest" href="/api/v1/brand/manifest.webmanifest" />
    <meta name="theme-color" content="#111926" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The product's favicon, whatever the brand (the tab stays recognisable); brand.rs swaps in
         favicon-unread.svg while something is unread. favicon.ico at the root is for clients that ask
         for it without a link (generated by scripts/brand/icons.py). -->
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link data-trunk rel="copy-dir" href="icons" />
    <link data-trunk rel="copy-file" href="icons/favicon.ico" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <!-- Thumbnails of the photo backgrounds, loaded lazily by the picker (the full pictures are only in the desktop app). -->
    <link data-trunk rel="copy-dir" href="../../assets/backgrounds/thumbs" data-target-path="backgrounds" />
    <!-- The app's wasm is built, split into lazily loaded chunks and started by scripts/build-app.sh (a
         Trunk hook, #334): Trunk can't split wasm. loader.js drives the loading screen below. -->
    <!-- Declared but skipped: without a main Rust asset Trunk would build the crate itself. -->
    <link data-trunk rel="rust" data-bin="teamcraft-ui" data-trunk-skip />
    <!-- The calls (#330): their own ES module, which the app imports in the background after sign-in (web_calls.rs), so they are not part of the first download. -->
    <link data-trunk rel="copy-file" href="../teamcraft-media/src/call_web/teamcraft-call-worklet.js" />
    <link data-trunk rel="rust" href="../teamcraft-web-calls/Cargo.toml" data-type="worker" data-bindgen-target="web" data-cargo-profile-release="web-release" data-wasm-opt="z" data-wasm-opt-params="--converge --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
    <!-- The service worker's Rust half (push wake-ups); scripts/finish-sw.sh inlines it into sw.js. -->
    <link data-trunk rel="rust" href="../teamcraft-web-sw/Cargo.toml" data-type="worker" data-bindgen-target="no-modules" data-cargo-profile-release="web-release" data-wasm-opt="z" data-wasm-opt-params="--converge --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
  </head>
  <body>
    <!-- The loading screen: plain HTML and CSS (style/loader.css), so it shows before any script runs.
         loader.js adds progress, the saved theme and errors, and hands over to the app once its first
         view is there (the sign-in card or the chat; startup.rs), covering the session check. -->
    <div id="tc-loader" class="tc-loader" role="status" aria-busy="true">
      <!-- The TeamCraft mark (icons/mark.svg, scripts/brand/mark.py) inline, so its parts can move:
           the heads swirl in, the bodies rise, the speech bubble pops and types. Ids are prefixed so
           they never meet the app's. -->
      <svg class="tc-loader-mark" viewBox="62 77 1130 1130" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="tcl-head-top" gradientUnits="userSpaceOnUse" x1="500" y1="390" x2="760" y2="130">
            <stop offset="0" stop-color="#005af5"/><stop offset="1" stop-color="#0079fd"/>
          </linearGradient>
          <linearGradient id="tcl-head-left" gradientUnits="userSpaceOnUse" x1="110" y1="720" x2="300" y2="520">
            <stop offset="0" stop-color="#02aeac"/><stop offset="1" stop-color="#0cd5c0"/>
          </linearGradient>
          <linearGradient id="tcl-head-right" gradientUnits="userSpaceOnUse" x1="955" y1="720" x2="1145" y2="520">
            <stop offset="0" stop-color="#1490fb"/><stop offset="1" stop-color="#2cb7fd"/>
          </linearGradient>
          <linearGradient id="tcl-body-top" gradientUnits="userSpaceOnUse" x1="300" y1="480" x2="910" y2="700">
            <stop offset="0" stop-color="#004bd3"/><stop offset="1" stop-color="#005ce6"/>
          </linearGradient>
          <linearGradient id="tcl-body-right" gradientUnits="userSpaceOnUse" x1="660" y1="1150" x2="1000" y2="760">
            <stop offset="0" stop-color="#047efc"/><stop offset="1" stop-color="#27b0fd"/>
          </linearGradient>
          <clipPath id="tcl-body-left-shade"><path d="M150 807.15L700 1141L700 450L150 450Z"/></clipPath>
        </defs>
        <g class="tc-loader-body tc-loader-body-right"><path fill="url(#tcl-body-right)" d="M706.25 398.13L756.72 368.99A62 62 0 0 1 818.72 368.99L928.8 432.55A54 54 0 0 1 955.8 479.32L955.8 483.76A65 65 0 0 1 940.13 526.09A146.5 146.5 0 0 0 976.18 747.27A100 100 0 0 0 989.99 754.14L1021.67 766.94A80 80 0 0 1 1071.7 841.11L1071.7 932.77A90 90 0 0 1 1026.7 1010.71L772.5 1157.48A90 90 0 0 1 637.5 1079.54L637.5 700L558.23 404.15A159.5 159.5 0 0 0 706.25 398.13Z"/></g>
        <g class="tc-loader-body tc-loader-body-top"><path fill="url(#tcl-body-top)" d="M338.65 423.67L436.81 366.99A56 56 0 0 1 492.81 366.99L872.3 586.09A65 65 0 0 1 904.8 642.38L904.8 813.97A54 54 0 0 1 877.8 860.74L803.59 903.59L557.29 657.29L338.65 531.06A62 62 0 0 1 338.65 423.67Z"/></g>
        <g class="tc-loader-body tc-loader-body-left">
          <path fill="#1de7d5" d="M183.2 933.33L183.2 842.67A84 84 0 0 1 243.55 762.07A146.5 146.5 0 0 0 332.59 688.48A149.8 149.8 0 0 1 600 823.39L600 900L630 900L630 1000L616.5 1000L616.5 1079.57A90 90 0 0 1 481.5 1157.52L228.2 1011.27A90 90 0 0 1 183.2 933.33Z"/>
          <path fill="#03a0a4" clip-path="url(#tcl-body-left-shade)" d="M183.2 933.33L183.2 842.67A84 84 0 0 1 243.55 762.07A146.5 146.5 0 0 0 332.59 688.48A149.8 149.8 0 0 1 600 823.39L600 900L630 900L630 1000L616.5 1000L616.5 1079.57A90 90 0 0 1 481.5 1157.52L228.2 1011.27A90 90 0 0 1 183.2 933.33Z"/>
        </g>
        <g class="tc-loader-swirl tc-loader-swirl-top"><g class="tc-loader-nod"><circle class="tc-loader-head" fill="url(#tcl-head-top)" cx="626.5" cy="260" r="144.5"/></g></g>
        <g class="tc-loader-swirl tc-loader-swirl-left"><g class="tc-loader-nod"><circle class="tc-loader-head" fill="url(#tcl-head-left)" cx="202.3" cy="621.5" r="131.5"/></g></g>
        <g class="tc-loader-swirl tc-loader-swirl-right"><g class="tc-loader-nod"><circle class="tc-loader-head" fill="url(#tcl-head-right)" cx="1051.3" cy="621.5" r="131.5"/></g></g>
        <g class="tc-loader-bubble">
          <path fill="#fff" d="M498 593.5L757.5 593.5A83 83 0 0 1 840.5 676.5L840.5 839.5A76 76 0 0 1 764.5 915.5L760.72 915.5A48 48 0 0 0 729.71 926.86L636.25 1005.94A12 12 0 0 1 616.5 996.78L616.5 928.5A13 13 0 0 0 603.5 915.5L493 915.5A80 80 0 0 1 413 835.5L413 678.5A85 85 0 0 1 498 593.5Z"/>
          <g fill="#0063ee"><circle class="tc-loader-dot" cx="528" cy="755.5" r="36.1"/><circle class="tc-loader-dot" cx="625.8" cy="755.5" r="36.1"/><circle class="tc-loader-dot" cx="723.7" cy="755.5" r="36.1"/></g>
        </g>
      </svg>
      <div class="tc-loader-bar" aria-hidden="true"><div class="tc-loader-progress"></div></div>
      <!-- What a long start waits for (loader.js). -->
      <p class="tc-loader-status"></p>
      <!-- Shown by CSS alone after a long wait, in case no script runs at all (init.js blocked or
           missing, no module support); loader.js removes it as soon as it starts. English only:
           without script there is no language choice. -->
      <a class="tc-loader-reload" href="" aria-label="Reload" title="Reload">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="tc-loader-error" role="alert" hidden>
        <p class="tc-loader-error-title"></p>
        <p class="tc-loader-error-body"></p>
        <button type="button" class="tc-loader-retry"></button>
      </div>
    </div>
  </body>
</html>
