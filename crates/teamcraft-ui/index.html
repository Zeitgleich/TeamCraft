<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>TeamCraft</title>
    <link data-trunk rel="css" href="style/main.css" />
    <!-- The brand of the host name this page is served from (colors only; docs/branding.md §4). After main.css so it wins. 404 in the desktop shell, which applies the brand from code. -->
    <link rel="stylesheet" href="/api/v1/brand/theme.css" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <!-- Thumbnails of the photo backgrounds, loaded lazily by the picker (the full pictures are only in the desktop app). -->
    <link data-trunk rel="copy-dir" href="../../assets/backgrounds/thumbs" data-target-path="backgrounds" />
    <!-- Set data-wasm-opt="s" (or remove the attribute) in release builds to shrink the bundle with binaryen. -->
    <link data-trunk rel="rust" data-bin="teamcraft-ui" data-wasm-opt="0" />
    <!-- The service worker's Rust half (push wake-ups); scripts/finish-sw.sh inlines it into sw.js. -->
    <link data-trunk rel="rust" href="../teamcraft-web-sw/Cargo.toml" data-type="worker" data-bindgen-target="no-modules" data-wasm-opt="0" />
  </head>
  <body></body>
</html>
