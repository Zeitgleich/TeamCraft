[build]
target = "index.html"
dist = "dist"

[serve]
# 8082 is registered as web origin and redirect URI of the dev Keycloak client (README).
address = "127.0.0.1"
port = 8082
open = false

# The dev server has no CORS headers; proxying keeps the API on the page's origin.
[[proxy]]
backend = "http://127.0.0.1:8081/api/"

# The app itself: built, split into lazily loaded chunks and started by init.js (the server's
# Content-Security-Policy forbids inline scripts); the same hook then fills in the loading screen's
# generated values (scripts/finish-loader.sh). Hooks of one stage run at the same time, so steps that
# depend on each other share a hook.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["scripts/build-app.sh"]

# The service worker's Rust half goes into sw.js (it can only be verified there).
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["scripts/finish-sw.sh"]

[watch]
ignore = ["dist"]
