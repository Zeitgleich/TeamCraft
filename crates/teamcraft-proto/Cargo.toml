[package]
name = "teamcraft-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
serde.workspace = true
# Values of synced settings are opaque JSON: only the client that reads a key knows its type.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
utoipa.workspace = true
# Fresh idempotency keys for create requests (browsers use the getrandom js backend of the app).
rand_core.workspace = true
# Write-only secrets in admin settings requests are cleared from memory when dropped.
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
