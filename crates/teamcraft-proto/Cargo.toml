[package]
name = "teamcraft-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
serde.workspace = true
# Values of synced settings are opaque JSON: only the client that reads a key knows its type.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
utoipa.workspace = true
# Fresh idempotency keys for create requests (browsers use the getrandom js backend of the app).
rand_core.workspace = true
# Write-only secrets in admin settings requests are cleared from memory when dropped.
zeroize = { version = "1.9.1", features = ["derive"] }
# The crash reports DSN (src/api/crash_reports.rs): server and apps parse it the same way. Already a
# dependency of every client and the server.
url.workspace = true
# Channel names in NFC (src/channel_name.rs, e2ee.md §4.6.5): every client checks them alike.
# Already in the tree (sqlx's stringprep); no_std-friendly and wasm-compatible.
unicode-normalization = "0.1.26"

[dev-dependencies]
