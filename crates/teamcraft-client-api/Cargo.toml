[package]
name = "teamcraft-client-api"
description = "The interface between the TeamCraft UI and the client core: backend traits and view models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
teamcraft-proto.workspace = true
# The shape of a meeting link token (src/app_link.rs); every client links this crate already.
teamcraft-crypto = { path = "../teamcraft-crypto" }
serde.workspace = true
thiserror.workspace = true
# Release versions for desktop updates (1.2.3-rc.1 < 1.2.3); already in the tree through Tauri.
semver = "1"
# The server entry: what users type becomes a server origin; the server's answer is JSON.
url.workspace = true
serde_json.workspace = true
# The server entry's warning about an identity provider outside the server's registrable domain
# needs the Public Suffix List; this crate embeds it (no I/O, builds for wasm).
psl = "2"
# The OIDC sign-in's shared request parameters and token response (src/oidc_login.rs); the same
# crate the web client and the desktop shell sign in with.
oauth2 = { version = "5", default-features = false }
# The ID token's claims are base64url JSON (login hint, src/oidc_login.rs).
base64.workspace = true
# A channel's shared page (src/canvas.rs, e2ee.md §4.11): the Yjs CRDT. Only the page's editor links
# it (its own wasm chunk on the web); the core keeps the updates as opaque bytes.
yrs = "0.28"
# The recent log for "Report a problem" (src/debug_log.rs): a layer on the registry the shells and
# the web calls module already use.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The log's wall clock in the browser (`Date.now()`); already in the tree through the web client.
js-sys = "0.3.83"


[dev-dependencies]
# The source of the generated emoji catalog (src/emoji_catalog.tsv): a test writes it and checks
# that it is current. Not linked into the clients.
emojis.workspace = true
