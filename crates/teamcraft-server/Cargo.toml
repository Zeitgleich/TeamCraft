[package]
name = "teamcraft-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "teamcraft_server"
path = "src/lib.rs"

[[bin]]
name = "teamcraft-server"
path = "src/main.rs"

[dependencies]
base64.workspace = true
teamcraft-crypto.workspace = true
teamcraft-proto.workspace = true
teamcraft-db.workspace = true
teamcraft-ops.workspace = true
anyhow.workspace = true
aws-lc-rs.workspace = true
time.workspace = true
chrono-tz.workspace = true
axum.workspace = true
figment.workspace = true
jsonwebtoken.workspace = true
lettre.workspace = true
rand_core.workspace = true
reqwest.workspace = true
rusty-s3.workspace = true
secrecy.workspace = true
subtle = "2.6.1"
# Wipes push tokens and keys from memory when a push target is dropped (already in the tree).
zeroize = "1.9.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
url.workspace = true
utoipa.workspace = true
tracing-subscriber.workspace = true

[features]
# Tests that need the dev Postgres (DATABASE_URL); they skip when it is not set.
integration = ["teamcraft-db/integration"]

[dev-dependencies]
# The fake APNs speaks HTTP/2 without TLS.
axum = { workspace = true, features = ["http2"] }
time = { workspace = true, features = ["macros"] }
p256.workspace = true
reqwest.workspace = true
tokio-tungstenite = "0.30"
futures-util = "0.3"
base64.workspace = true
figment = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["test-util"] }
# Full-stack call test (tests/call_e2e.rs): SFU, native call clients and their device identities.
teamcraft-sfu = { path = "../teamcraft-sfu" }
teamcraft-media = { path = "../teamcraft-media", features = ["native"] }
teamcraft-crypto.workspace = true
rand_core.workspace = true
wtransport = "0.7.2"
