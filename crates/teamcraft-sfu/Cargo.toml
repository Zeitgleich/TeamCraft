[package]
name = "teamcraft-sfu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
teamcraft-media = { path = "../teamcraft-media", features = ["fallback-socket"] }
teamcraft-ops = { workspace = true, features = ["metrics"] }
teamcraft-proto.workspace = true
anyhow.workspace = true
jsonwebtoken.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
# Room in the UDP socket's receive buffer, which wtransport's own binding has no setting for.
socket2.workspace = true
# The WebSocket fallback for networks that block UDP (ARCHITECTURE.md §6.6); both already in the tree.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The fallback's trusted proxy networks; already in the tree through reqwest.
ipnet = "2.12"
# Reports call participants to teamcraft-server.
reqwest.workspace = true
# Constant-time comparison of the registration token on the control endpoint.
subtle = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
wtransport = { version = "0.7.2", features = ["self-signed"] }

# The descriptor limit, to warn when the fallback's limits exceed it (a safe getrlimit, MIT; the
# same version is in teamcraft-media's dev-dependencies).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["resource"] }

[features]
# End-to-end tests with the desktop app's Linux capture (xdg-desktop-portal + PipeWire); they need
# a desktop session, see tests/suite/video_content.rs.
portal-e2e = ["teamcraft-media/pipewire"]

[dev-dependencies]
# The native call client (engine, Opus, driver, and its video stats) for end-to-end tests against
# this SFU.
teamcraft-media = { path = "../teamcraft-media", features = ["native", "openh264-source", "call-view"] }
# Raw sockets for what a hostile client sends to the fallback's listener.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
# Device identities for the clients' call key bindings.
teamcraft-crypto.workspace = true
rand_core.workspace = true
# A stand-in for the server's internal endpoints in the reporting test.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
# Its quinn, for a raw QUIC client that cuts HTTP/3 frames where a test wants them cut.
wtransport = { version = "0.7.2", features = ["quinn"] }
# A paused clock for waits as long as the reconnect grace.
tokio = { version = "1", features = ["test-util"] }
