[package]
name = "teamcraft-crypto"
description = "All TeamCraft cryptography: device keys, content keys, attachments, key bag, MLS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Versions follow what openmls_rust_crypto already pulls in, so the RustCrypto stack is not duplicated.
[dependencies]
# Web Push payload encryption (RFC 8291, aes128gcm).
aes-gcm = "0.10.3"
# VAPID JWT and Web Push headers (base64url).
base64 = "0.23.1"
# Password-based key wrapping for the backup key (e2ee.md §6.2 fallback).
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
# Message, key bag and attachment encryption (XChaCha20-Poly1305, STREAM for chunks).
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc", "stream"] }
# Web Push: ECDH and the VAPID ES256 signature (RFC 8291, RFC 8292).
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "std"] }
# Identity and device signatures; same major version as openmls_basic_credential.
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "zeroize"] }
# Key derivation for passkey PRF outputs and rendezvous.
hkdf = "0.13.0"
# TOTP codes (RFC 6238) for local accounts: HMAC-SHA1 is what authenticator apps implement.
hmac = "0.13.0"
sha1 = "0.11.0"
# MLS (RFC 9420) for key distribution.
openmls = "0.9.1"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
# Randomness source shared with ed25519-dalek and openmls_rust_crypto.
rand_core = { version = "0.6.4", features = ["getrandom"] }
# VAPID JWT claims, and the plaintext of a gateway-bound push token.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
# Constant-time comparisons of keys and fingerprints.
subtle = "2.6.1"
thiserror = "2.0.21"
# Binary encoding of signed and encrypted structures (already an openmls dependency).
tls_codec = { version = "0.5.0", features = ["derive", "std"] }
# Device key agreement (rendezvous, key transfer). Major 3 like x-wing in hpke-rs-rust-crypto (which
# also still links 2), so following openmls here would not save a copy.
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }
# Organization recovery (e2ee.md §6.3): HPKE (RFC 9180) to the org key, same hpke-rs as openmls uses.
hpke-rs = "0.7.0"
hpke-rs-crypto = "0.7.0"
hpke-rs-rust-crypto = "0.7.0"
# Shamir secret sharing of the org key secret, byte-wise over GF(2^8) (audits funded per its README).
vsss-rs = { version = "6.0.1", default-features = false, features = ["std", "zeroize"] }
# vsss-rs draws randomness through rand_core 0.10; seeded from the OS RNG.
rand_chacha_010 = { package = "rand_chacha", version = "0.10.0" }
# x25519-dalek 3 takes a rand_core 0.10 RNG; `rng.rs` lends it the caller's rand_core 0.6 RNG.
rand_core_010 = { package = "rand_core", version = "0.10.1" }

# Browser builds: route all RNG backends to WebCrypto.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
openmls = { version = "0.9.1", features = ["js"] }
