[package]
name = "teamcraft-desktop-native"
description = "The desktop shell's few native OS calls that need unsafe code, behind a safe API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Not `workspace = true`: this crate may contain audited `unsafe` (see code-style.md), so it carries
# the workspace lints itself with `unsafe_code` relaxed from `forbid` to `deny`.
[lints.rust]
# The one exception to the workspace rule (code-style.md, "Native FFI"): `deny`, so every `unsafe`
# item needs an explicit `#[allow(unsafe_code)]` next to its SAFETY comment.
unsafe_code = "deny"
non_fmt_panics = "deny"
unused_imports = "deny"
unused_mut = "deny"
unused_variables = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Correctness / safety (from ArtCraft's Cranky.toml)
await_holding_lock = "deny"
borrow_interior_mutable_const = "deny"
# Typed, readable code
option_option = "deny"
zero_sized_map_values = "deny"
clone_on_copy = "deny"
implicit_clone = "deny"
needless_return = "deny"
redundant_field_names = "deny"
empty_structs_with_brackets = "deny"
# No debugging leftovers, no panics in production paths (allowed in tests via clippy.toml)
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
# Explicitly allowed
if_same_then_else = "allow"
undocumented_unsafe_blocks = "deny"

[features]
default = ["shell"]
# The desktop shell's OS calls (the table in lib.rs). Off for teamcraft-media, which needs only
# `openh264` and must not pull WebKitGTK, WebView2 or AppKit into every native build.
shell = ["dep:block2", "dep:objc2", "dep:objc2-user-notifications", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:webkit2gtk-sys", "dep:windows", "dep:webview2-com"]
# OpenH264's `SetOption` for the native video encoders' in-place rate changes (#1781): the
# `openh264` crate offers it only through its raw API.
openh264 = ["dep:openh264", "dep:openh264-sys2"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
# The OpenH264 encoder whose rate `openh264_rate` changes, and its option types (BSD-2-Clause; the
# versions teamcraft-media uses, so already in the tree).
openh264 = { version = "0.9.9", optional = true, default-features = false, features = ["libloading"] }
openh264-sys2 = { version = "0.9.9", optional = true, default-features = false }

# macOS: NSWorkspaceDidWakeNotification, the notification delegate and notification attachments
# (Network.framework's path monitor is linked directly, it has no Objective-C API)
# through the safe-ish objc2 bindings (Zlib/Apache-2.0/MIT; already in the tree through Tauri's macOS
# stack).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
objc2 = { version = "0.6.2", optional = true }
objc2-user-notifications = { version = "0.3.2", optional = true, default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationAttachment", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNUserNotificationCenter"] }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "block2", "NSError", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL"] }

# Linux: the WebKitGTK version at run time (MIT; the version wry uses, so already in the tree).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-sys = { version = "2.0.2", optional = true }

# Windows: PowerRegisterSuspendResumeNotification and NotifyNetworkConnectivityHintChange
# (MIT/Apache-2.0; the version the shell uses).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }
# Windows: WebView2's `ProcessFailed` event (MIT; the version wry and Tauri use, so the same COM
# types as `PlatformWebview::controller()`).
webview2-com = { version = "0.39.1", optional = true }

# Android: the JNI entry that hands the Java VM and context to ndk-context for cpal's AAudio backend
# (both already in the tree through cpal and ndk; the same ndk-context instance cpal reads).
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.3.1"
ndk-context = "0.1.1"
