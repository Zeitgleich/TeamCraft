[package]
name = "teamcraft-net"
description = "Network helpers shared by clients and server: the retry policy, Happy Eyeballs (RFC 8305), DSCP marking"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Happy Eyeballs is native only (TCP for the core's WebSockets, QUIC for calls); the browser does
# this itself. The retry policy has no dependencies.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The DSCP of a voice connection (traffic.rs): IP_TOS / IPV6_TCLASS without unsafe code; already in
# the tree through tokio and wtransport.
socket2 = { workspace = true, features = ["all"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "macros", "net"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util", "net"] }
