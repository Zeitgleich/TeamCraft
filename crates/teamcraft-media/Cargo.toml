[package]
name = "teamcraft-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["dave"]
# DAVE frame encryption (MLS via openmls). Builds for wasm32 as well.
dave = ["dep:davey", "dep:openmls", "dep:openmls_basic_credential", "dep:openmls_rust_crypto", "dep:tls_codec"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
davey = { version = "0.1.5", optional = true }
openmls = { version = "0.9.1", optional = true }
openmls_basic_credential = { version = "0.6.0", optional = true }
openmls_rust_crypto = { version = "0.6.0", optional = true }
tls_codec = { version = "0.5.0", optional = true }

# davey pulls in rand 0.8 (getrandom 0.2), which needs its JS backend in the browser.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
