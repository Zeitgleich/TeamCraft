[package]
name = "teamcraft-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["dave"]
# DAVE frame encryption (MLS via openmls). Builds for wasm32 as well.
dave = [
  "call-auth",
  "dep:davey",
  "dep:openmls",
  "dep:openmls_basic_credential",
  "dep:openmls_rust_crypto",
  "dep:tls_codec",
  "dep:teamcraft-crypto",
]
# Native clients: Opus via libopus (C, built with cmake), audio device I/O via cpal (ALSA on Linux
# needs libasound2-dev) and the WebTransport call driver. Browsers use WebCodecs and Web Audio.
native = ["dave", "dep:webpki-roots", "dep:ndk", "dep:openh264", "dep:bzip2", "dep:zune-jpeg", "dep:jpeg-encoder", "dep:opus", "dep:cpal", "dep:tokio", "dep:wtransport", "dep:socket2", "dep:teamcraft-net", "dep:serde_json", "dep:tracing-subscriber", "dep:anyhow"]

# OpenH264 built from source into the binary: development and tests only. Release builds load
# Cisco's binary at runtime instead (openh264_library.rs explains why).
openh264-source = ["native", "openh264/source"]

# Browser clients: the WebTransport + WebCodecs + Web Audio call driver (wasm32).
web = [
  "dave",
  "web-api",
  "dep:serde_json",
  "dep:futures",
  "dep:wasm-bindgen-futures",
  "dep:zune-jpeg",
]
# Only the bindings of the browser APIs (`web_api`: WebCodecs, WebTransport) without the call
# engine: the desktop webview decodes the shell's video with them.
web-api = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]

# Cameras and screens through the xdg-desktop-portal and PipeWire (Linux; needs libpipewire
# headers and libclang at build time). The portal asks the user and works in sandboxes.
# Signing and verifying call key bindings (`call_auth`) without the rest of the call engine: the
# web client's page does this for its call module.
call-auth = ["dep:teamcraft-crypto"]
# The UI's view of calls (`call_view`): shared by the desktop shell and the browser.
call-view = ["dave", "dep:teamcraft-client-api"]
# The app's own message sounds (`message_sounds`, synthesized): the desktop shell and the browser.
message-sounds = ["dep:teamcraft-client-api"]
# A user's own message sound file decoded on the desktop (`sound_file`: MP3, Ogg Vorbis, WAV, FLAC).
sound-files = ["native", "message-sounds", "dep:symphonia"]

pipewire = ["native", "dep:pipewire", "dep:ashpd"]
# Cameras on macOS through AVFoundation (via nokhwa).
avfoundation = ["native", "dep:nokhwa", "dep:nokhwa-bindings-macos", "dep:flume"]
# Cameras on Windows through Media Foundation (via nokhwa). Compile-checked only so far.
mediafoundation = ["native", "dep:nokhwa"]
# Screen and window capture on Windows through Windows Graphics Capture (safe wrapper crate).
graphics-capture = ["native", "dep:windows-capture"]
# Screen sharing and its sound on macOS through ScreenCaptureKit (macOS 13+).
screencapturekit = ["native", "dep:screencapturekit"]
# A screen share's sound on Windows: WASAPI process loopback without our own process (safe
# wrapper crate).
wasapi-loopback = ["native", "dep:wasapi"]
# Cameras through V4L2 directly (Linux fallback when the camera portal is unavailable).
v4l2 = ["native", "dep:v4l"]

# Hardware H.264 encoding through GStreamer (dynamically linked, LGPL): VA-API (`vah264enc`) on
# Linux, VideoToolbox (`vtenc_h264`) on macOS. Needs the GStreamer development packages to build;
# at runtime a missing element or plugin falls back to OpenH264.
gstreamer = ["native", "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

# Background effects (blur, background images) as WGSL compute shaders on wgpu: Vulkan, Metal,
# D3D12 natively, WebGPU in the browser.
effects = ["dep:wgpu", "dep:bytemuck", "dep:futures-channel", "dep:pollster", "dep:zune-jpeg", "dep:zune-png", "dep:jpeg-encoder"]
# The built-in photo backgrounds, compiled in (about 3.5 MB of JPEG): the desktop app only.
photo-backgrounds = ["effects"]
# Person segmentation for the effects with tract (pure-Rust ONNX inference; native and wasm).
segmentation = ["effects", "dep:tract-onnx"]

[dependencies]
teamcraft-proto.workspace = true
thiserror.workspace = true
tracing.workspace = true
davey = { version = "0.1.5", optional = true }
openmls = { version = "0.9.1", optional = true }
openmls_basic_credential = { version = "0.6.0", optional = true }
openmls_rust_crypto = { version = "0.6.0", optional = true }
tls_codec = { version = "0.5.0", optional = true }
# Call key bindings: DAVE keys signed by device keys (e2ee.md §8).
teamcraft-crypto = { workspace = true, optional = true }
teamcraft-client-api = { path = "../teamcraft-client-api", optional = true }
# Blocks on the effects' GPU read-back where the caller is synchronous (the encoder thread).
pollster = { version = "1.0.1", optional = true }
# Clocks that work in browsers (std's Instant panics on wasm32-unknown-unknown): bandwidth
# estimation timing and binding expiry checks. Re-exports std's types on native.
web-time = "1.1.0"
# H.264 software encoder and decoder (Cisco's OpenH264, BSD-2-Clause, built from source): the
# fallback when no hardware encoder is available, and decodable by every browser.
openh264 = { version = "0.9.9", optional = true, default-features = false, features = ["libloading"] }
# Cisco ships the OpenH264 binaries bzip2-compressed (pure-Rust decoder, MIT/Apache-2.0).
bzip2 = { version = "0.6.1", optional = true }
# MJPEG camera frames (many USB cameras only deliver 720p+ as MJPEG): pure-Rust JPEG decoder.
zune-jpeg = { version = "0.5.15", optional = true }
# Hardware encoding (feature `gstreamer`): safe GStreamer bindings, MIT/Apache-2.0.
gstreamer = { version = "0.25.4", optional = true }
gstreamer-app = { version = "0.25.2", optional = true }
gstreamer-video = { version = "0.25.4", optional = true }
# The user's background pictures (PNG; JPEG through zune-jpeg): pure Rust, MIT/Apache-2.0/Zlib.
zune-png = { version = "0.5.2", optional = true }
# JPEG for webviews without WebCodecs (decoded remote video re-encoded): pure Rust, MIT/Apache-2.0.
jpeg-encoder = { version = "0.7.1", optional = true }
# Effects: GPU access (MIT/Apache-2.0), plain-old-data casts for its buffers, and a oneshot for
# buffer read-back, which is asynchronous in the browser.
wgpu = { version = "30.0.1", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
futures-channel = { version = "0.3.34", optional = true }
# Segmentation model inference (MediaPipe selfie segmentation as ONNX), MIT/Apache-2.0.
tract-onnx = { version = "0.23.9", optional = true }
# Safe libopus bindings; libopus (BSD-3-Clause) is the reference Opus implementation.
opus = { version = "0.4.0", optional = true }
# Cross-platform audio device I/O (ALSA/PipeWire, CoreAudio, WASAPI, AAudio).
cpal = { version = "0.18.2", optional = true }
# Decodes a user's own message sound on the desktop (#800): pure Rust, no unsafe, MPL-2.0. Only
# the royalty-free formats and MP3; no SIMD (it would pull in an FFT library for nothing here).
symphonia = { version = "0.6.1", optional = true, default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm", "adpcm", "flac"] }
# Native call driver: async runtime, WebTransport client and the JSON signaling encoding.
tokio = { workspace = true, optional = true }
wtransport = { version = "0.7.2", optional = true, features = ["quinn"] }
# A fresh dual-stack socket to move a call connection to after a network change (wtransport
# binds its first socket the same way; already in the tree through it and quinn).
socket2 = { version = "0.6.3", optional = true }
# Happy Eyeballs for the QUIC handshake to the SFU (src/sfu_address.rs, issue #420).
teamcraft-net = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Browser call driver: JS bindings, promises as futures, and channels into its single task.
wasm-bindgen = { version = "0.2.129", optional = true }
wasm-bindgen-futures = { version = "0.4.79", optional = true }
js-sys = { version = "0.3.106", optional = true }
web-sys = { version = "0.3.106", optional = true, features = [
  "AnalyserNode", "AudioContext", "AudioContextOptions", "AudioDestinationNode", "AudioNode", "AudioWorklet",
  "AudioWorkletNode", "AudioWorkletNodeOptions", "BaseAudioContext", "Blob", "BlobPropertyBag",
  "MediaDeviceInfo", "MediaDeviceKind", "MediaDevices", "MediaStream", "MediaStreamAudioSourceNode",
  "MediaStreamConstraints", "MediaStreamTrack", "MediaTrackConstraints", "MessageEvent", "MessagePort",
  "Navigator", "ReadableStream", "ReadableStreamDefaultReader", "Url", "Window", "Worklet",
  "WritableStream", "WritableStreamDefaultWriter", "DisplayMediaStreamConstraints",
  "Document", "Element", "EventTarget", "HtmlCanvasElement", "HtmlElement", "HtmlMediaElement",
  "HtmlVideoElement", "MediaTrackSettings", "Node", "ImageData",
] }
futures = { version = "0.3.34", optional = true, default-features = false, features = ["std", "async-await"] }
# Log output and error reporting of the headless teamcraft-call client.
tracing-subscriber = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

# Trusted roots for the SFU's certificate on Android, where the system store isn't readable as
# files (MPL-2.0 data, as in teamcraft-core).
[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = { version = "1.0.10", optional = true }
# Hardware H.264 encoding through the NDK's MediaCodec (safe bindings, MIT/Apache-2.0; already in
# the tree through cpal).
ndk = { version = "0.9.0", optional = true, default-features = false, features = ["media"] }

# Camera capture on Linux: V4L2 (safe ioctl wrappers, MIT).
[target.'cfg(target_os = "linux")'.dependencies]
v4l = { version = "0.14.0", optional = true }
# Portal requests (Camera, ScreenCast) over D-Bus, MIT, and the PipeWire streams they hand out (MIT).
ashpd = { version = "0.13.13", optional = true, features = ["camera", "screencast"] }
pipewire = { version = "0.10.1", optional = true }

# Camera capture on macOS: AVFoundation behind a safe API (Apache-2.0). Its own MJPEG decoding
# (C code) is off; AVFoundation converts MJPEG modes to YUV (capture_nokhwa, #914).
[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", optional = true, default-features = false, features = ["input-avfoundation"] }
# The modes an AVFoundation camera offers, as nokhwa's own backend reads them (nokhwa's mode list
# comes back empty on AVFoundation, #819). Already in the tree through nokhwa (Apache-2.0).
nokhwa-bindings-macos = { version = "0.2.4", optional = true }
# The frame queue of nokhwa's AVFoundation bindings, for the camera stream that converts MJPEG
# modes (#914). Already in the tree through those bindings (MIT/Apache-2.0).
flume = { version = "0.11.1", optional = true, default-features = false }
# Screen sharing with its sound: ScreenCaptureKit behind a safe API (MIT/Apache-2.0).
# Screen sharing with its sound: ScreenCaptureKit behind a safe API (MIT/Apache-2.0). Its
# `macos_14_0` feature only compiles the CGImage pixel helpers in; the bridge itself guards newer
# APIs at runtime and needs macOS 13.
screencapturekit = { version = "11.0.0", optional = true, features = ["macos_14_0"] }

# Camera capture on Windows: Media Foundation behind nokhwa's safe API (Apache-2.0).
[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10.11", optional = true, default-features = false, features = ["input-msmf"] }
# Screen and window capture: Windows Graphics Capture (MIT), D3D11 readback inside the crate.
windows-capture = { version = "2.0.1", optional = true }
# System audio for screen shares: WASAPI process loopback behind a safe API (MIT).
wasapi = { version = "0.26.0", optional = true }

# WebRTC's audio processing module (AEC3, noise suppression, AGC2; the only WebRTC component used,
# ARCHITECTURE.md §6.1) is a C++ library, so it is opt-in at build time instead of a feature (which
# `--all-features` would pull in everywhere): RUSTFLAGS="--cfg teamcraft_audio_processing" links the
# system library, adding "--cfg teamcraft_audio_processing_bundled" builds it from source. Without
# it calls work without echo cancellation. See README.md.
[target.'cfg(all(teamcraft_audio_processing, not(teamcraft_audio_processing_bundled), not(target_arch = "wasm32")))'.dependencies]
webrtc-audio-processing = "2.1.0"

[target.'cfg(all(teamcraft_audio_processing, teamcraft_audio_processing_bundled, not(target_arch = "wasm32")))'.dependencies]
webrtc-audio-processing = { version = "2.1.0", features = ["bundled"] }

[dev-dependencies]
# Builds a tiny ONNX model in the segmentation tests (tract's own protobuf types).
prost = "0.14"
# Device identities for call key binding tests.
rand_core.workspace = true

[[bin]]
name = "teamcraft-call"
required-features = ["native"]

# Per-frame costs of encoding, effects and segmentation (see the example's docs).
[[example]]
name = "video_bench"
required-features = ["openh264-source", "segmentation"]

# Captures through the screencast/camera portal and counts the frames (packaging/linux/portal-test).
[[example]]
name = "portal_capture"
required-features = ["pipewire"]

# Captures the camera or a display on macOS, encodes, decodes and reports what the pictures show.
[[example]]
name = "macos_capture"
required-features = ["avfoundation", "screencapturekit", "openh264-source"]

# Captures the computer's sound through PipeWire and checks that our own playback is left out.
[[example]]
name = "system_audio_capture"
required-features = ["pipewire"]

# The browser driver as a JS module for the SFU's development page (see the example's docs).
[[example]]
name = "web_call"
crate-type = ["cdylib"]
required-features = ["web"]

# A local WebTransport server with a self-signed certificate (call_native tests). Native only:
# its QUIC stack (ring) doesn't build for the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wtransport = { version = "0.7.2", features = ["quinn", "self-signed"] }

# davey pulls in rand 0.8 (getrandom 0.2), which needs its JS backend in the browser.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }

# Runs the DAVE round trip in Node or a browser (tests/wasm_dave.rs).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
