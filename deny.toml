# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Modelled on CalCraft's deny.toml.

[graph]
all-features = true

[advisories]
# Every ignored advisory needs a reason and a link.
ignore = [
  # crypto-bigint 0.5 (via elliptic-curve 0.13 / p256 0.13 / ecdsa 0.16, pulled in by davey and the
  # openmls_rust_crypto stack) has secret-dependent branches in a few arithmetic operations. Only
  # 0.7.6 is patched and those crates don't support it yet; the direct crypto-bigint 0.7 is updated
  # to 0.7.6. Exploiting it needs a local timing or microarchitectural side channel on the device.
  # Remove with the crypto major upgrades (#124, #163).
  # https://rustsec.org/advisories/RUSTSEC-2026-0387
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 only via p256/elliptic-curve 0.13; no patched 0.5 release, upgrade tracked in #163" },
  # zip 4 (via tauri-plugin-updater 2.14, whose latest stable release still requires zip ^4) keeps
  # SUID/SGID bits when extracting. The updater only extracts update archives after checking their
  # minisign signature against the key in tauri.conf.json, so a crafted archive never reaches it; Windows
  # has no SUID bits. Remove once tauri-plugin-updater moves to zip >= 9.
  # https://rustsec.org/advisories/RUSTSEC-2026-0367
  { id = "RUSTSEC-2026-0367", reason = "zip only extracts signature-verified update archives (tauri-plugin-updater)" },
  # The same zip 4 extraction, symlinks pointing outside the destination / permissions applied through
  # them: same reasoning (only signature-verified update archives are extracted).
  # https://rustsec.org/advisories/RUSTSEC-2026-0368 https://rustsec.org/advisories/RUSTSEC-2026-0369
  { id = "RUSTSEC-2026-0368", reason = "zip only extracts signature-verified update archives (tauri-plugin-updater)" },
  { id = "RUSTSEC-2026-0369", reason = "zip only extracts signature-verified update archives (tauri-plugin-updater)" },
  # Unmaintained TOML parser, no known vulnerability: askama (via uniffi_bindgen) reads UniFFI's own
  # template config with it while generating the mobile bindings at build time; nothing at runtime.
  # https://rustsec.org/advisories/RUSTSEC-2026-0374
  { id = "RUSTSEC-2026-0374", reason = "unmaintained, build-time template config of uniffi_bindgen" },
  # Unmaintained, no known vulnerability. Proc macro used by Leptos (either_of, reactive_graph) for
  # the UI. Remove once Leptos drops it. https://rustsec.org/advisories/RUSTSEC-2024-0436
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc macro via Leptos, no vulnerability" },
  # Unmaintained proc-macro error helpers, compile time only: glib-macros (GTK stack of the Tauri
  # desktop shell) and hax-lib-macros (libcrux via openmls). No runtime code.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained compile-time proc macro via glib/hax-lib" },
  { id = "RUSTSEC-2026-0173", reason = "unmaintained compile-time proc macro via hax-lib (openmls)" },
  # unic-* (unmaintained) via urlpattern in tauri-utils: matches the desktop shell's own capability
  # URL patterns, no untrusted input.
  { id = "RUSTSEC-2025-0075", reason = "unmaintained, via tauri-utils urlpattern, trusted input" },
  { id = "RUSTSEC-2025-0080", reason = "unmaintained, via tauri-utils urlpattern, trusted input" },
  { id = "RUSTSEC-2025-0081", reason = "unmaintained, via tauri-utils urlpattern, trusted input" },
  { id = "RUSTSEC-2025-0098", reason = "unmaintained, via tauri-utils urlpattern, trusted input" },
  { id = "RUSTSEC-2025-0100", reason = "unmaintained, via tauri-utils urlpattern, trusted input" },
  # quick-xml 0.38 via plist via tauri-utils: only parses the app's own Info.plist / Tauri config at
  # build time, never data from the network. No newer plist release yet; revisit on Tauri updates.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml via tauri plist, build-time trusted input only" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml via tauri plist, build-time trusted input only" },
  # zvariant, zvariant_derive, zbus_names: merged into zbus 6 (released 2026-10-16), no vulnerability.
  # Pulled in via zbus 5 by keyring (Secret Service) and tauri-plugin-opener; revisit when they move.
  { id = "RUSTSEC-2026-0370", reason = "merged into zbus 6; via keyring/tauri zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "merged into zbus 6; via keyring/tauri zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "merged into zbus 6; via keyring/tauri zbus 5" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD", # quoted_printable (lettre): permissive, OSI approved, like ISC
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
# Not a crate, so not listed: GStreamer itself (LGPL-2.1-or-later, hardware video encoding) is linked
# dynamically from the system through gstreamer-rs (MIT/Apache-2.0); no GPL plugin is used.
# jpeg-encoder ports libjpeg's tables: IJG is permissive and GPL-compatible; binaries must credit
# the Independent JPEG Group, which crates/teamcraft-media/NOTICE.md does.
# libbz2-rs-sys (bzip2's pure-Rust backend) unpacks Cisco's OpenH264 download: the bzip2 license is
# BSD-style; crates/teamcraft-media/NOTICE.md carries its notice.
exceptions = [
  { crate = "jpeg-encoder", allow = ["IJG"] },
  { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version.
allow-wildcard-paths = true
# One implementation per concern: OpenSSL is not used (rustls everywhere). The one exception is
# SQLCipher's crypto backend on Windows, which has no system libcrypto: libsqlite3-sys builds OpenSSL
# from source through openssl-sys/openssl-src there (only libsqlite3-sys may depend on it; no TLS).
deny = [
  { name = "openssl" },
  { name = "openssl-sys", wrappers = ["libsqlite3-sys"] },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
