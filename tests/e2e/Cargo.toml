[package]
name = "teamcraft-e2e"
description = "End-to-end tests: real server, SFU and bridge against the dev stack, driven by headless clients and a browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Without it the crate is empty, so `cargo test --workspace` neither builds nor runs anything here.
e2e = [
  "dep:teamcraft-client-api",
  "dep:teamcraft-core",
  "dep:teamcraft-crypto",
  "dep:teamcraft-media",
  "dep:teamcraft-proto",
  "dep:anyhow",
  "dep:base64",
  "dep:rand_core",
  "dep:reqwest",
  "dep:serde_json",
  "dep:sqlx",
  "dep:tokio",
  "dep:tokio-tungstenite",
  "dep:futures-util",
  "dep:tracing-subscriber",
]
# Drives the web client in headless Chromium (needs a trunk build of teamcraft-ui, see README.md).
browser = ["e2e", "dep:chromiumoxide", "dep:rcgen", "dep:sha2", "dep:time"]

[dependencies]
teamcraft-client-api = { path = "../../crates/teamcraft-client-api", optional = true }
# `sealed-sqlite`: the mobile apps' store, so the network tests run on both stores.
teamcraft-core = { path = "../../crates/teamcraft-core", optional = true, features = ["ui", "sealed-sqlite"] }
teamcraft-crypto = { workspace = true, optional = true }
teamcraft-media = { path = "../../crates/teamcraft-media", optional = true, features = ["native"] }
teamcraft-proto = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["query"] }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "process", "io-util", "fs", "net", "time", "macros", "sync"] }
# Headless Chromium over the DevTools protocol: no driver binary, no Node, Rust like the rest of the tests.
chromiumoxide = { version = "0.9", optional = true, default-features = false }
# The SFU's certificate for browser calls, so the browser can be told to accept it (Chromium pins its
# public key by SHA-256); both already in the tree (wtransport, teamcraft-crypto).
rcgen = { version = "0.14.10", optional = true }
sha2 = { version = "0.11.0", optional = true }
time = { version = "0.3", optional = true }
# The client core's log in a test that sets E2E_LOG (crate::app), to see why a scenario failed.
tracing-subscriber = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std", "sink"] }
# Raw gateway connections (resume with a chosen sequence number, a consumer that stops reading); the
# same version the core and the server use.
tokio-tungstenite = { version = "0.30", optional = true }
