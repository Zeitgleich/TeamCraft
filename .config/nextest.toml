# cargo-nextest settings (https://nexte.st). CI runs `cargo nextest run --profile ci`.

[profile.default]
# Tests that need a database or a dev stack skip themselves when it is missing (in CI, a missing
# database fails: TEST_DATABASE_REQUIRED); no retries hide real flakiness.
retries = 0
slow-timeout = { period = "60s" }

# Calls with real video through a real SFU, in one process, judged by picture quality and by what
# arrives when: they run alone, as other tests' CPU use would move their results (#1139).
[[profile.default.overrides]]
filter = 'package(teamcraft-sfu) & binary(suite) & test(/^(bandwidth_limits|camera_start|screen_layer_bitrate|screen_sharpness|video_content|video_quality|video_recovery|weak_downlink)::/)'
threads-required = "num-test-threads"

[profile.ci]
retries = 0
# Show every failure again at the end, so it is not buried in the log of a long run.
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "slow"
slow-timeout = { period = "120s" }
