# Local development stack: Postgres, Keycloak (OIDC), Garage (S3), Mailpit (mail catcher) and CalCraft
# (CalDAV). Mailpit shows every invitation e-mail at http://127.0.0.1:8025 instead of sending it.
# Start:  docker compose -f docker-compose.dev.yml up -d && ./dev/init-garage.sh
# Every credential below is dev-only and must never be used outside a developer machine.
# Ports are bound to loopback only, on IPv4 (127.0.0.1) and IPv6 ([::1]).

name: teamcraft-dev

services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_USER: teamcraft
      POSTGRES_PASSWORD: teamcraft-dev-only
      POSTGRES_DB: teamcraft
    ports:
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    volumes:
      # Postgres 18+ images keep PGDATA below /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamcraft -d teamcraft"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: keycloak/keycloak:26.7.5
    # Dev mode keeps its H2 database inside the container; the realm is re-imported from dev/keycloak
    # whenever the container is recreated (`docker compose ... down` resets all Keycloak state).
    command: ["start-dev", "--import-realm"]
    # Lets Keycloak call the server on the host for back-channel logout (dev server on port 8081).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
      - "[::1]:8080:8080"
    volumes:
      - ./dev/keycloak/teamcraft-dev-realm.json:/opt/keycloak/data/import/teamcraft-dev-realm.json:ro

  garage:
    image: dxflrs/garage:v2.4.0
    command: ["/garage", "server"]
    ports:
      - "127.0.0.1:3900:3900"
      - "[::1]:3900:3900" # S3 API
      - "127.0.0.1:3903:3903"
      - "[::1]:3903:3903" # admin API
    volumes:
      - ./dev/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  mailpit:
    image: docker.io/axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025"
      - "[::1]:1025:1025" # SMTP, no authentication
      - "127.0.0.1:8025:8025"
      - "[::1]:8025:8025" # web UI and API

  # CalDAV server for meetings. The image is built from a pinned CalCraft commit (no public image);
  # the first build compiles the web UI and takes a while. Create the account the server uses with
  # ./dev/init-calcraft.sh.
  calcraft:
    build:
      context: https://github.com/Zeitgleich/CalCraft.git#b771c227848f608d1e755bff38e39a1b37fd57f6
    environment:
      CALCRAFT_SERVER__BIND: "0.0.0.0:5232"
      CALCRAFT_STORAGE__DATABASE: /data/calcraft.db
      CALCRAFT_SECURITY__SECURE_COOKIES: "false"
    ports:
      - "127.0.0.1:5232:5232"
      - "[::1]:5232:5232"
    volumes:
      - calcraft-data:/data

volumes:
  postgres-data:
  calcraft-data:
  garage-meta:
  garage-data:
