[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop"]
# Third-party code, patched into the dependency graph (see crates/vendor/*/VENDORED.md); not ours to lint.
exclude = ["crates/vendor"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Zeitgleich/TeamCraft"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
non_fmt_panics = "deny"
unused_imports = "deny"
unused_mut = "deny"
unused_variables = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Correctness / safety (from ArtCraft's Cranky.toml)
await_holding_lock = "deny"
borrow_interior_mutable_const = "deny"
# Typed, readable code
option_option = "deny"
zero_sized_map_values = "deny"
clone_on_copy = "deny"
implicit_clone = "deny"
needless_return = "deny"
redundant_field_names = "deny"
empty_structs_with_brackets = "deny"
# No debugging leftovers, no panics in production paths (allowed in tests via clippy.toml)
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
# Explicitly allowed
if_same_then_else = "allow"

[workspace.dependencies]
# Internal crates
teamcraft-proto = { path = "crates/teamcraft-proto" }
teamcraft-db = { path = "crates/teamcraft-db" }

# Serialization and schemas
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "6"

# Errors, logging, secrets
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
secrecy = { version = "0.10", features = ["serde"] }

# Async runtime and HTTP
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["trace", "request-id"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "time"] }
time = "0.3"

# Encoding
base64 = "0.22"

# Randomness (already in the tree through jsonwebtoken and reqwest)
aws-lc-rs = "1"

# S3 presigned URLs (sans-IO, no SDK)
rusty-s3 = { version = "0.10", default-features = false, features = ["aws-lc-rs"] }
url = "2"

# Networking
socket2 = "0.6"

# Auth and configuration
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
figment = { version = "0.10", features = ["toml", "env"] }

# davey 0.1.5 ported to openmls 0.9, so chat and calls share one MLS stack (ARCHITECTURE.md §6.2)
# without the libcrux advisories of the openmls 0.8 stack. See crates/vendor/davey/VENDORED.md.
[patch.crates-io]
davey = { path = "crates/vendor/davey" }
