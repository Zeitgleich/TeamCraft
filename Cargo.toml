[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop", "tests/e2e"]
# Third-party code, patched into the dependency graph (see crates/vendor/*/VENDORED.md); not ours to lint.
exclude = ["crates/vendor", "fuzz"]

[workspace.package]
version = "1.0.15"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Zeitgleich/TeamCraft"
# The Flatpak build uses the GNOME SDK's rust-stable extension, which trails the newest stable
# release by about one version; the toolchain itself (rust-toolchain.toml) stays current.
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
non_fmt_panics = "deny"
unused_imports = "deny"
unused_mut = "deny"
unused_variables = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Correctness / safety (from ArtCraft's Cranky.toml)
await_holding_lock = "deny"
borrow_interior_mutable_const = "deny"
# Typed, readable code
option_option = "deny"
zero_sized_map_values = "deny"
clone_on_copy = "deny"
implicit_clone = "deny"
needless_return = "deny"
redundant_field_names = "deny"
empty_structs_with_brackets = "deny"
# No debugging leftovers, no panics in production paths (allowed in tests via clippy.toml)
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
# Explicitly allowed
if_same_then_else = "allow"

[workspace.dependencies]
# Internal crates
teamcraft-proto = { path = "crates/teamcraft-proto" }
teamcraft-db = { path = "crates/teamcraft-db" }
teamcraft-crypto = { path = "crates/teamcraft-crypto" }
teamcraft-ops = { path = "crates/teamcraft-ops" }
teamcraft-net = { path = "crates/teamcraft-net" }

# Serialization and schemas
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "6"
# Routes register their OpenAPI paths and schemas where they are defined (#614).
utoipa-axum = "0.3"

# Errors, logging, secrets
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
secrecy = { version = "0.10", features = ["serde"] }

# Async runtime and HTTP
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["trace", "request-id", "fs"] }
# `system-proxy`: macOS and Windows proxy settings (environment variables are read anyway).
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "http2", "system-proxy"] }
# `Retry-After` as an HTTP date (push services); already in the tree through hyper.
httpdate = "1"

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "time"] }
time = "0.3"
# IANA time zone names, validated on the server (profile time zone); the database is compiled in.
chrono-tz = { version = "0.10", default-features = false }
# The UTC offset of a time zone at an instant (chrono-tz answers through chrono's `TimeZone`).
chrono = { version = "0.4", default-features = false }

# Encoding
base64 = "0.23"

# Randomness (already in the tree through jsonwebtoken and reqwest)
aws-lc-rs = "1"

# E-mail (iMIP meeting invitations); rustls with the aws-lc-rs provider like the rest of the tree
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }

# S3 presigned URLs (sans-IO, no SDK); `xml` for the multipart upload requests and answers
rusty-s3 = { version = "0.10", default-features = false, features = ["aws-lc-rs", "xml"] }
url = "2"

# Push tests (the payload crypto lives in teamcraft-crypto)
p256 = { version = "0.13", features = ["ecdh", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# Networking
socket2 = "0.6"

# Auth and configuration
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
figment = { version = "0.10", features = ["toml", "env"] }

# davey 0.1.5 ported to openmls 0.9, so chat and calls share one MLS stack (ARCHITECTURE.md §6.2)
# without the libcrux advisories of the openmls 0.8 stack. See crates/vendor/davey/VENDORED.md.
# wtransport 0.7.2 with a client Endpoint::rebind, so calls survive network changes (ARCHITECTURE.md
# §6.5). See crates/vendor/wtransport/VENDORED.md.
[patch.crates-io]
davey = { path = "crates/vendor/davey" }
wtransport = { path = "crates/vendor/wtransport" }

# Keep target/ small: several worktrees build in parallel on one disk. Line tables are enough
# for backtraces; dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"
# Incremental caches are the largest part of target/; disk matters more than rebuild speed here.
incremental = false

[profile.dev.package."*"]
debug = false

# The web client's wasm (crates/teamcraft-ui and teamcraft-web-sw, built by trunk; index.html selects
# it): the download is what users wait for, so size wins over speed. Measured in the PR that added it.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The browser's person segmentation (tract, only in the segmentation worker's module
# teamcraft-web-segmentation, #439) runs every frame or two: its kernels are built for speed.
# Chrome on the main thread: 11.5 ms instead of 19 ms a frame without SIMD, for 0.1 MB (gzip) more.
[profile.web-release.package.tract-linalg]
opt-level = 3
