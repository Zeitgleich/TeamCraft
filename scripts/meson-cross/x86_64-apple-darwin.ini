# Meson cross file: Intel macOS (x86_64-apple-darwin) built on Apple silicon. Used by
# scripts/meson-cross/meson for the bundled WebRTC audio processing build (#197).
# MACOSX_DEPLOYMENT_TARGET from the environment sets the minimum macOS version (clang reads it).

[binaries]
c = ['clang', '-arch', 'x86_64']
cpp = ['clang++', '-arch', 'x86_64']
objc = ['clang', '-arch', 'x86_64']
objcpp = ['clang++', '-arch', 'x86_64']
ar = 'ar'
strip = 'strip'
pkg-config = 'pkg-config'

[properties]
# Test programs are not run: the build machine may have no Rosetta.
needs_exe_wrapper = true
# Homebrew's libraries on the build machine are arm64. Hide them from pkg-config so that abseil
# comes from Meson's subproject, built for x86_64 (no cmake binary is given either, so Meson does not
# look there).
pkg_config_libdir = '/nonexistent'

[host_machine]
system = 'darwin'
subsystem = 'macos'
kernel = 'xnu'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
