name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: e2ee
    attributes:
      label: End-to-end encryption
      description: Does this need the server to see anything it can't see today? (ARCHITECTURE.md §2)
