# Dependency updates, weekly, grouped so a week's bumps arrive as a few PRs. Major versions get a
# PR of their own (they usually need code changes and, for crypto, a review).
#
# Actions are pinned to commit SHAs (CodeQL actions/unpinned-tag); Dependabot bumps the SHA and the
# version comment together. Container base images are pinned by tag and index digest in literal
# FROM lines (Dependabot reads FROM, not ARG defaults).
#
# No `swift` or `npm` entries: the iOS app has no Swift packages (XcodeGen project, the Rust core
# is a local XCFramework) and the repository has no package.json.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor:
        update-types: [minor, patch]
    # teamcraft-crypto keeps the RustCrypto stack on the versions openmls_rust_crypto uses, so it
    # isn't built twice (crates/teamcraft-crypto/Cargo.toml). Lift these with the openmls upgrade
    # that moves them (#163 tracks each). Only breaking bumps are ignored: for 0.x crates
    # Dependabot calls 0.10 -> 0.11 "minor", so those ignore minor too; patch releases (and security
    # fixes) still come through. x25519-dalek is not listed: hpke-rs links both 2 and 3 already.
    ignore:
      - dependency-name: aes-gcm
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: chacha20poly1305
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: ed25519-dalek
        update-types: [version-update:semver-major]
      - dependency-name: p256
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: rand_core
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "hpke-rs*"
        update-types: [version-update:semver-major, version-update:semver-minor]
      # The vendored davey (reached through /fuzz) copies aes-gcm 0.10's AES-GCM onto aes 0.8 /
      # cipher 0.4; it moves with aes-gcm above (crates/vendor/davey/VENDORED.md, change 6).
      - dependency-name: aes
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: cipher
        update-types: [version-update:semver-major, version-update:semver-minor]
      # ashpd, notify-rust, secret-service and the Tauri plugins are on zbus 5; a direct zbus 6
      # would build both stacks. Lift when they move (deny.toml, RUSTSEC-2026-0370..0372).
      - dependency-name: zbus
        update-types: [version-update:semver-major]
      # oauth2 5 still draws from getrandom 0.2; teamcraft-ui only enables its wasm backend.
      - dependency-name: getrandom
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker
    directories:
      - /containers
      - /fuzz
      - /dev/wasm-test
      - /tests/e2e/web
      - /apps/android/docker
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-stack:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    groups:
      android-minor:
        update-types: [minor, patch]
