# Categories of GitHub's generated release notes (the "What's changed" part of every release,
# docs/release.md). A pull request lands in the first category whose label it has.
changelog:
  exclude:
    labels: [skip-release-notes]
    authors: ["dependabot[bot]", "dependabot"]
  categories:
    - title: Security
      labels: [security]
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Documentation
      labels: [documentation, docs]
    - title: Dependencies
      labels: [dependencies, deps]
    - title: Other changes
      labels: ["*"]
