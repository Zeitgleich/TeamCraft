name: Web size
'on':
  push:
    branches:
    - main
    paths:
    - crates/teamcraft-ui/**
    - crates/teamcraft-web-sw/**
    - crates/teamcraft-web-calls/**
    - crates/teamcraft-web-segmentation/**
    - crates/teamcraft-web-bundle/**
    - crates/teamcraft-media/**
    - crates/teamcraft-core/**
    - crates/teamcraft-client-api/**
    - crates/teamcraft-crypto/**
    - crates/teamcraft-proto/**
    - Cargo.lock
    - Cargo.toml
    - rust-toolchain.toml
    - scripts/check-web-size.py
    - .github/workflows/web-size.yml
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - crates/teamcraft-ui/**
    - crates/teamcraft-web-sw/**
    - crates/teamcraft-web-calls/**
    - crates/teamcraft-web-segmentation/**
    - crates/teamcraft-web-bundle/**
    - crates/teamcraft-media/**
    - crates/teamcraft-core/**
    - crates/teamcraft-client-api/**
    - crates/teamcraft-crypto/**
    - crates/teamcraft-proto/**
    - Cargo.lock
    - Cargo.toml
    - rust-toolchain.toml
    - scripts/check-web-size.py
    - .github/workflows/web-size.yml
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  packages: read
env:
  CARGO_TERM_COLOR: always
jobs:
  web-size:
    name: Web wasm size
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'ci') || github.run_attempt > 1
    runs-on: ubuntu-latest
    steps:
    - run: echo stub
