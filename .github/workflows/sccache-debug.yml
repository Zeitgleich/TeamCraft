name: sccache debug
on:
  push:
    paths: [".github/workflows/sccache-debug.yml"]
jobs:
  debug:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:26f5d789fcfe6519b5c77b21e69e4f687dec2c5a8630b683f253dfa201cedbf4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: debug
      RUSTC_WRAPPER: sccache
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: /tmp/sccache-error.log
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: |
          env | grep -i "ACTIONS_\|SCCACHE" | sed 's/TOKEN=.*/TOKEN=***/'
          which -a sccache; sccache --version; echo "$SCCACHE_PATH"
          cargo new --lib /tmp/hello -q
          cd /tmp/hello && cargo build 2>&1 | tail -2
          sccache --show-stats | head -12
          cat /tmp/sccache-error.log | head -40
