name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# A new push to the same branch or PR cancels the run still going for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; a running main run finishes so main always gets a verdict
  # (only the newest queued main run is kept).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: read the code and pull the CI image from ghcr.io; nothing is written.
permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  # arm64 runs on pushes to main and on pull requests labelled `arm`; the runner budget is limited.

# Jobs run on GitHub's hosted runner, inside our Debian Trixie CI image (containers/ci.Containerfile,
# built by ci-image.yml; pinned by digest, update it with scripts/pin-ci-image.sh). The image has
# Rust, every system package and cargo-nextest, so a job starts building at once.
#
# The build output is cached by Swatinem/rust-cache, one key per job and architecture. Only runs
# on main save it; pull requests restore main's cache.

jobs:
  check:
    name: check (${{ matrix.arch }})
    # Both Linux architectures the desktop ships for, each on a native runner; they run in
    # parallel, so arm64 adds no wall-clock time. Format and the wasm build are
    # architecture-independent and run once.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'arm')) && '[{"arch":"x86_64","runner":"ubuntu-latest"},{"arch":"aarch64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"x86_64","runner":"ubuntu-latest"}]') }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:26f5d789fcfe6519b5c77b21e69e4f687dec2c5a8630b683f253dfa201cedbf4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The hosted runner ships ~30 GB of tools we never use; mounted here so the first step can
      # delete them, otherwise the workspace's build output fills the runner's disk.
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
        - /opt/hostedtoolcache:/host/toolcache
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Free disk space on the runner
        # Deleting ~30 GB takes minutes; it runs in the background while the cache is restored and
        # the dependencies are fetched, and the build output only needs the space later.
        run: nohup sh -c 'find /host/dotnet /host/android /host/ghc /host/toolcache -mindepth 1 -delete' > /dev/null 2>&1 &
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: check-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "false"
      - name: Placeholder UI bundle (the desktop build embeds crates/teamcraft-ui/dist)
        run: mkdir -p crates/teamcraft-ui/dist
      - name: Format
        if: matrix.arch == 'x86_64'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Wasm build (browser crates)
        if: matrix.arch == 'x86_64'
        run: >
          cargo check --target wasm32-unknown-unknown
          -p teamcraft-proto -p teamcraft-crypto -p teamcraft-media -p teamcraft-core -p teamcraft-ui

  # Tests in their own job: a fresh disk, and test binaries without debug info (every integration
  # test binary links the whole dependency tree). cargo-nextest runs every test in its own process
  # and in parallel across binaries; it does not run doctests, so those run separately.
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'arm')) && '[{"arch":"x86_64","runner":"ubuntu-latest"},{"arch":"aarch64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"x86_64","runner":"ubuntu-latest"}]') }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:26f5d789fcfe6519b5c77b21e69e4f687dec2c5a8630b683f253dfa201cedbf4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
        - /opt/hostedtoolcache:/host/toolcache
    env:
      SQLX_OFFLINE: "true"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: "debuginfo"
    steps:
      - name: Free disk space on the runner
        # Deleting ~30 GB takes minutes; it runs in the background while the cache is restored and
        # the dependencies are fetched, and the build output only needs the space later.
        run: nohup sh -c 'find /host/dotnet /host/android /host/ghc /host/toolcache -mindepth 1 -delete' > /dev/null 2>&1 &
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "false"
      - name: Placeholder UI bundle (the desktop build embeds crates/teamcraft-ui/dist)
        run: mkdir -p crates/teamcraft-ui/dist
      - name: Test
        run: cargo nextest run --workspace --profile ci
      - name: Doctests
        run: cargo test --workspace --doc

  # WebRTC audio processing (echo cancellation) is opt-in at build time, see
  # crates/teamcraft-media/README.md. Built from source here (version 2 isn't packaged).
  audio-processing:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:26f5d789fcfe6519b5c77b21e69e4f687dec2c5a8630b683f253dfa201cedbf4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUSTFLAGS: "--cfg teamcraft_audio_processing --cfg teamcraft_audio_processing_bundled"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: audio-processing
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "false"
      - name: Clippy
        run: cargo clippy -p teamcraft-media --all-targets --features native -- -D warnings
      - name: Test
        run: cargo nextest run -p teamcraft-media --features native --profile ci
      - name: Doctests
        run: cargo test -p teamcraft-media --features native --doc

  # The Windows desktop client: the Tauri shell and the call media with Media Foundation cameras and
  # Windows Graphics Capture. Not --all-features: the `gstreamer` feature needs GStreamer's MSVC
  # runtime and `pipewire`/`v4l2` are Linux-only. WebRTC audio processing is not built on Windows
  # (see apps/desktop/packaging/windows/README.md).
  windows:
    runs-on: windows-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # OpenH264 (tests) and OpenSSL for SQLCipher (built from source) need NASM; Perl comes with the image.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - name: Placeholder UI bundle (the desktop build embeds crates/teamcraft-ui/dist)
        shell: bash
        run: mkdir -p crates/teamcraft-ui/dist
      # The desktop crate enables the Windows capture features of teamcraft-media itself.
      - name: Clippy (desktop shell and core)
        run: cargo clippy -p teamcraft-desktop -p teamcraft-core --all-targets -- -D warnings
      - name: Clippy (call media)
        run: cargo clippy -p teamcraft-media --all-targets --features native,mediafoundation,graphics-capture,wasapi-loopback,effects,segmentation,openh264-source -- -D warnings
      - name: Test (desktop shell and core)
        run: cargo test -p teamcraft-desktop -p teamcraft-core
      - name: Test (call media)
        run: cargo test -p teamcraft-media --features native,mediafoundation,graphics-capture,wasapi-loopback,effects,segmentation,openh264-source
      - name: Check (ARM64, cross-compiled)
        run: cargo check --target aarch64-pc-windows-msvc -p teamcraft-desktop

  # The macOS call media: AVFoundation cameras and ScreenCaptureKit screens and sound (its Swift
  # bridge builds with the runner's Xcode). Without GStreamer, which only the release build bundles
  # (desktop-release.yml builds the whole app).
  macos:
    runs-on: macos-15
    env:
      # Current macOS and the two releases before it (26 Tahoe, 15 Sequoia, 14 Sonoma).
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy (call media)
        run: cargo clippy -p teamcraft-media --all-targets --features native,avfoundation,screencapturekit,effects,openh264-source -- -D warnings
      - name: Test (call media)
        run: cargo test -p teamcraft-media --features native,avfoundation,screencapturekit,effects,openh264-source

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The release version must agree everywhere (docs/release.md); the release notes must still render.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Versions agree (Cargo, desktop, Android, iOS, CHANGELOG.md)
        run: scripts/check-versions.sh
      - name: Release notes render
        run: |
          version="$(scripts/check-versions.sh)"
          printf 'ghcr.io/example/teamcraft-server:%s@sha256:0\n' "$version" > "$RUNNER_TEMP/images.txt"
          scripts/render-release-notes.py --version "$version" --tag "v$version" --repo "$GITHUB_REPOSITORY" \
            --images "$RUNNER_TEMP/images.txt" > "$RUNNER_TEMP/notes.md"
          if grep -n '{{' "$RUNNER_TEMP/notes.md"; then echo "::error::unfilled placeholder"; exit 1; fi
