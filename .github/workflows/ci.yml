name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Every pull request, docs too: `ci-gate` is the required check of `main` and must appear on each.
  # Without the `ci` label the jobs are skipped and the gate passes in seconds.
  #
  # Not `labeled`: every label event would start a run, and the merge state of a pull request looks
  # at the newest run of a workflow on its head only. A newer run that concurrency cancelled before
  # it had any job has no `ci-gate`, so the pull request stays blocked with a green gate next to it;
  # a newer run with a skipped gate would count as passed while the real run still works. So a head
  # gets exactly one run, and ci-label.yml re-runs that one when the `ci` label comes later.
  pull_request:
    types: [opened, synchronize, reopened]
  # By hand, e.g. to get a verdict on main after a docs-only merge before tagging a release.
  workflow_dispatch:

# A new push to the same branch or PR cancels the run still going for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; a running main run finishes so main always gets a verdict
  # (only the newest queued main run is kept).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: read the code and pull the CI image from ghcr.io; nothing is written.
permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  # arm64 runs on pushes to main and on pull requests labelled `arm` when a run starts; the runner
  # budget is limited.

# Jobs run on GitHub's hosted runner, inside our Debian Trixie CI image (containers/ci.Containerfile,
# built by ci-image.yml; pinned by digest, update it with scripts/pin-ci-image.sh). The image has
# Rust, every system package and cargo-nextest, so a job starts building at once.
#
# The build output is cached by Swatinem/rust-cache, one key per job and architecture. Only runs
# on main save it; pull requests restore main's cache (a cache per pull request would push the
# release caches out of the repository's 10 GB budget).

jobs:
  # Decides what this run does from the pull request's labels as they are now, not from the event's
  # payload: that can lack a label added a moment earlier, and a re-run (ci-label.yml) keeps the
  # payload of the first attempt. `run_ci`: the jobs below run (push and dispatch always; pull
  # requests with the `ci` label or from Dependabot: branches are checked locally before merging, and
  # main gets one run per batch, which keeps the runner budget for main and releases). `arm`: also on
  # arm64.
  #
  # The first attempt on `opened` waits first: `gh pr create --label` adds the labels after opening,
  # some tools seconds later, and a gate that passed before them would let auto-merge merge without
  # the run they ask for.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run_ci: ${{ steps.plan.outputs.run_ci }}
      arm: ${{ steps.plan.outputs.arm }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          run_ci=true
          arm=false
          if [ "$EVENT" = pull_request ]; then
            if [ "$ACTION" = opened ] && [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then sleep 15; fi
            read_labels() { gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name'; }
            labels="$(read_labels || { sleep 5; read_labels; } || { sleep 20; read_labels; })"
            echo "labels:" $labels
            printf '%s\n' "$labels" | grep -qx ci || [ "$AUTHOR" = 'dependabot[bot]' ] || run_ci=false
            ! printf '%s\n' "$labels" | grep -qx arm || arm=true
          elif [ "$EVENT" = push ]; then
            arm=true
          fi
          echo "run_ci=$run_ci arm=$arm"
          { echo "run_ci=$run_ci"; echo "arm=$arm"; } >> "$GITHUB_OUTPUT"

  check:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    name: check (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.arm == 'true' && '[{"arch":"x86_64","runner":"ubuntu-latest"},{"arch":"aarch64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"x86_64","runner":"ubuntu-latest"}]') }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:24fe71e069885c93b38cc6997f8005fb06b94e501dde7a07ce39c04c46d03e40
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check

  test:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.arm == 'true' && '[{"arch":"x86_64","runner":"ubuntu-latest"},{"arch":"aarch64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"x86_64","runner":"ubuntu-latest"}]') }}
    runs-on: ubuntu-latest
    steps:
      - run: sleep 180

  browser-tests:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  audio-processing:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  windows:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  macos:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  deny:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  versions:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  vendored-and-fuzz:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  ci-gate:
    name: ci-gate
    if: always()
    needs: [plan, check, test, browser-tests, audio-processing, windows, macos, deny, versions, vendored-and-fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a CI job ended with '$result'"; exit 1 ;;
            esac
          done
