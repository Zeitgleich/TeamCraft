name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Every pull request, docs too: `ci-gate` is the required check of `main` and must appear on each.
  # Without the `ci` label the jobs are skipped and the gate passes in about half a minute.
  #
  # Not `labeled`: every label event would start a run on the same head, and `ci-gate` is judged across
  # them. #1207 stayed blocked next to a green gate because a cancelled duplicate left a red one. So a
  # head gets one run, which reads the labels itself; ci-label.yml re-runs it when `ci` comes later.
  pull_request:
    types: [opened, synchronize, reopened]
  # By hand, e.g. to get a verdict on main after a docs-only merge before tagging a release.
  workflow_dispatch:

# A new push to the same branch or PR cancels the run still going for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; a running main run finishes so main always gets a verdict
  # (only the newest queued main run is kept).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: read the code and pull the CI image from ghcr.io; nothing is written.
permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  # arm64 runs on pushes to main and on pull requests labelled `arm` when a run starts; the runner
  # budget is limited.

# Jobs run on GitHub's hosted runner, inside our Debian Trixie CI image (containers/ci.Containerfile,
# built by ci-image.yml; pinned by digest, update it with scripts/pin-ci-image.sh). The image has
# Rust, every system package and cargo-nextest, so a job starts building at once.
#
# The build output is cached by Swatinem/rust-cache, one key per job and architecture. Only runs
# on main save it; pull requests restore main's cache (a cache per pull request would push the
# release caches out of the repository's 10 GB budget). A cache restored on a full key match is not
# saved again, so a change that rebuilds every crate (a profile setting in Cargo.toml; the Rust
# version is already in the key) bumps `prefix-key`, or main keeps restoring stale output.

jobs:
  # Decides what this run does from the pull request's labels as they are now, not from the event's
  # payload: that can lack a label added a moment earlier, and a re-run (ci-label.yml) keeps the
  # payload of the first attempt. `run_ci`: the jobs below run (push and dispatch always; pull
  # requests with the `ci` label or from Dependabot: branches are checked locally before merging, and
  # main gets one run per batch, which keeps the runner budget for main and releases). `arm`: also on
  # arm64.
  #
  # The first attempt on `opened` waits first: `gh pr create --label` adds the labels after opening,
  # some tools seconds later, and a gate that passed before them would let auto-merge merge without
  # the run they ask for.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run_ci: ${{ steps.plan.outputs.run_ci }}
      arm: ${{ steps.plan.outputs.arm }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          run_ci=true
          arm=false
          if [ "$EVENT" = pull_request ]; then
            if [ "$ACTION" = opened ] && [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then sleep 15; fi
            read_labels() { gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name'; }
            labels="$(read_labels || { sleep 5; read_labels; } || { sleep 20; read_labels; })"
            echo "labels:" $labels
            printf '%s\n' "$labels" | grep -qx ci || [ "$AUTHOR" = 'dependabot[bot]' ] || run_ci=false
            ! printf '%s\n' "$labels" | grep -qx arm || arm=true
          elif [ "$EVENT" = push ]; then
            arm=true
          fi
          echo "run_ci=$run_ci arm=$arm"
          { echo "run_ci=$run_ci"; echo "arm=$arm"; } >> "$GITHUB_OUTPUT"

  check:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    name: check (${{ matrix.arch }})
    # Both Linux architectures the desktop ships for, each on a native runner; they run in
    # parallel, so arm64 adds no wall-clock time. Format and the wasm build are
    # architecture-independent and run once.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.arm == 'true' && '[{"arch":"x86_64","runner":"ubuntu-latest"},{"arch":"aarch64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"x86_64","runner":"ubuntu-latest"}]') }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:24fe71e069885c93b38cc6997f8005fb06b94e501dde7a07ce39c04c46d03e40
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The hosted runner ships ~30 GB of tools we never use; mounted here so the first step can
      # delete them, otherwise the workspace's build output fills the runner's disk.
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
        - /opt/hostedtoolcache:/host/toolcache
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Free disk space on the runner
        # Deleting ~30 GB takes minutes; it runs in the background while the cache is restored and
        # the dependencies are fetched, and the build output only needs the space later.
        run: nohup sh -c 'find /host/dotnet /host/android /host/ghc /host/toolcache -mindepth 1 -delete' > /dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: check-${{ matrix.arch }}
          # arm64 compiles the same sources as x86_64; its caches (2.3 GB for check and test) don't
          # fit the repository's 10 GB budget next to the others, so it starts cold on main.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.arch == 'x86_64' }}
          cache-bin: "false"
      - name: Placeholder UI bundle (the desktop build embeds crates/teamcraft-ui/dist)
        run: mkdir -p crates/teamcraft-ui/dist
      - name: Format
        if: matrix.arch == 'x86_64'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Lints the browser crates' tests too (wasm-only tests and native-only gates).
      - name: Wasm clippy (browser crates)
        if: matrix.arch == 'x86_64'
        run: >
          cargo clippy --target wasm32-unknown-unknown --all-targets
          -p teamcraft-proto -p teamcraft-crypto -p teamcraft-media -p teamcraft-core -p teamcraft-ui
          -- -D warnings

  # Tests in their own job: a fresh disk, and test binaries without debug info (every integration
  # test binary links the whole dependency tree). cargo-nextest runs every test in its own process
  # and in parallel across binaries; it does not run doctests, so those run separately.
  #
  # The tests behind the `integration` feature of teamcraft-server and teamcraft-db run here too.
  # Naming the feature adds no build: teamcraft-bridge's dev-dependency already turns it on for the
  # workspace, and the name keeps them in if that changes. They need Postgres and skip themselves
  # without it, so TEST_DATABASE_REQUIRED makes a missing database a failure (#1280). The S3 tests
  # (shares, attachments, images) run against a Garage, and the Mailpit tests against a Mailpit, both
  # started in the job container below; TEST_SERVICES_REQUIRED makes a missing one a failure (#1284).
  # The CalCraft tests and the `dev_stack` tests of core and ffi need a CalCraft image and a running
  # server with Keycloak: e2e.yml (nightly, scripts/e2e.sh) has that stack.
  test:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.arm == 'true' && '[{"arch":"x86_64","runner":"ubuntu-latest"},{"arch":"aarch64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"x86_64","runner":"ubuntu-latest"}]') }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:24fe71e069885c93b38cc6997f8005fb06b94e501dde7a07ce39c04c46d03e40
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
        - /opt/hostedtoolcache:/host/toolcache
      # To reach the host's net.core.rmem_max below, which no container's network namespace has. A
      # runner is a throwaway VM with sudo anyway.
      options: --privileged --pid=host
    # Same major version as docker-compose.dev.yml. A service can't be given a command, so the
    # settings go through initdb: every parallel test server holds a pool of connections, and each
    # test migrates a database of its own, which durability would only slow down.
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: teamcraft
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: teamcraft
          POSTGRES_INITDB_ARGS: "-c max_connections=400 -c fsync=off -c synchronous_commit=off -c full_page_writes=off"
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U teamcraft -d teamcraft"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SQLX_OFFLINE: "true"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: "debuginfo"
      DATABASE_URL: postgres://teamcraft:ci-only@postgres:5432/teamcraft
      TEST_DATABASE_REQUIRED: "true"
      TEST_SERVICES_REQUIRED: "true"
    steps:
      - name: Let UDP sockets have the receive buffers they ask for
        # The SFU tests' calls ask for 4 MiB, as a deployed SFU should get (docs/operations.md).
        # Printed back, so a run's log shows the value took effect (#1139).
        run: |
          nsenter -t 1 -n sh -c 'echo 8388608 > /proc/sys/net/core/rmem_max; cat /proc/sys/net/core/rmem_max'
      - name: Free disk space on the runner
        # Deleting ~30 GB takes minutes; it runs in the background while the cache is restored and
        # the dependencies are fetched, and the build output only needs the space later.
        run: nohup sh -c 'find /host/dotnet /host/android /host/ghc /host/toolcache -mindepth 1 -delete' > /dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Garage (S3) and Mailpit (mail catcher) for the integration tests
        # Services can't take a command, so both run as processes in the job container, at the
        # addresses the tests expect (127.0.0.1:3900, :1025, :8025). Versions as in
        # docker-compose.dev.yml; binaries pinned by hash per architecture. Garage gets the dev
        # config and what dev/init-garage.sh does, without Docker Compose.
        env:
          GARAGE_VERSION: "2.5.0"
          MAILPIT_VERSION: "1.32.0"
          GARAGE_SHA256_X86_64: 2ff667286217cd73ebcb1c03af993822365000441dfe31a80cb64c5189a9dea8
          GARAGE_SHA256_AARCH64: 69b6040cef428b993500c17dd0d0c1240acf2f3f667b9b05ceba4b9660db4e8c
          MAILPIT_SHA256_X86_64: 4b5993c978e8604c70d43927e2ad103b311bba3b1822fa0cf1d4ee4ec890a93c
          MAILPIT_SHA256_AARCH64: e1e45d1dc72bd497fb262a1e4100178eee057c42c5fc36d143eb8621769e1137
        run: |
          set -eu
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            garage_sha="$GARAGE_SHA256_X86_64"; mailpit_sha="$MAILPIT_SHA256_X86_64"; mailpit_arch=amd64
          else
            garage_sha="$GARAGE_SHA256_AARCH64"; mailpit_sha="$MAILPIT_SHA256_AARCH64"; mailpit_arch=arm64
          fi
          dir="$RUNNER_TEMP/services"
          mkdir -p "$dir" /var/lib/garage/meta /var/lib/garage/data
          curl -fsSL -o "$dir/garage" "https://garagehq.deuxfleurs.fr/_releases/v${GARAGE_VERSION}/${{ matrix.arch }}-unknown-linux-musl/garage"
          curl -fsSL -o "$dir/mailpit.tar.gz" "https://github.com/axllent/mailpit/releases/download/v${MAILPIT_VERSION}/mailpit-linux-${mailpit_arch}.tar.gz"
          echo "$garage_sha  $dir/garage" | sha256sum -c -
          echo "$mailpit_sha  $dir/mailpit.tar.gz" | sha256sum -c -
          tar -xzf "$dir/mailpit.tar.gz" -C "$dir" mailpit
          chmod +x "$dir/garage"
          nohup "$dir/garage" -c dev/garage/garage.toml server > "$dir/garage.log" 2>&1 &
          nohup "$dir/mailpit" > "$dir/mailpit.log" 2>&1 &
          for _ in $(seq 1 30); do "$dir/garage" -c dev/garage/garage.toml status > /dev/null 2>&1 && break; sleep 1; done
          GARAGE_BIN="$dir/garage" dev/init-garage.sh
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8025/api/v1/info > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8025/api/v1/info > /dev/null
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: test-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.arch == 'x86_64' }}
          cache-bin: "false"
      - name: Placeholder UI bundle (the desktop build embeds crates/teamcraft-ui/dist)
        run: mkdir -p crates/teamcraft-ui/dist
      - name: Test
        env:
          # The test thread polls the whole test body, and in a debug build the futures of the bridge's
          # end-to-end tests don't fit the default 2 MiB (as in scripts/e2e.sh). Set here, not on the
          # job: rust-cache hashes the job's RUST* variables into its key, and would miss main's cache.
          RUST_MIN_STACK: "16777216"
        run: cargo nextest run --workspace --profile ci --features teamcraft-server/integration,teamcraft-db/integration
      - name: Doctests
        run: cargo test --workspace --doc

  # The crates' browser tests (wasm-bindgen-test in headless Chromium: the IndexedDB store and its
  # upgrades, the service worker). nextest skips them, they only compile for wasm32 (issue #1164).
  # The CI image has no browser: Chromium and its driver come from apt, the test runner is the
  # prebuilt release matching Cargo.lock.
  browser-tests:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:24fe71e069885c93b38cc6997f8005fb06b94e501dde7a07ce39c04c46d03e40
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      CHROMEDRIVER: /usr/bin/chromedriver
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: browser-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "false"
      - name: Chromium and its driver
        run: |
          apt-get update
          apt-get install -y --no-install-recommends chromium chromium-driver
      - name: Test runner (the wasm-bindgen release Cargo.lock pins; its checksum is checked)
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, "", $0); print; exit }' Cargo.lock)"
          name="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
          base="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${name}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/runner.tar.gz" "$base"
          expected="$(curl -fsSL "${base}.sha256sum" | cut -d' ' -f1)"
          echo "${expected}  $RUNNER_TEMP/runner.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/runner.tar.gz" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/${name}/wasm-bindgen-test-runner" /usr/local/bin/
      # crates/teamcraft-core/webdriver.json starts Chromium headless with --no-sandbox (a container).
      - name: Browser tests
        run: >
          cargo test --target wasm32-unknown-unknown -p teamcraft-core --features service-worker,test-support
          --test web --test web_service_worker

  # WebRTC audio processing (echo cancellation) is opt-in at build time, see
  # crates/teamcraft-media/README.md. Built from source here (version 2 isn't packaged).
  audio-processing:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:24fe71e069885c93b38cc6997f8005fb06b94e501dde7a07ce39c04c46d03e40
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUSTFLAGS: "--cfg teamcraft_audio_processing --cfg teamcraft_audio_processing_bundled"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: audio-processing
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "false"
      - name: Clippy
        run: cargo clippy -p teamcraft-media --all-targets --features native -- -D warnings
      - name: Test
        run: cargo nextest run -p teamcraft-media --features native --profile ci
      - name: Doctests
        run: cargo test -p teamcraft-media --features native --doc

  # The Windows desktop client: the Tauri shell and the call media with Media Foundation cameras and
  # Windows Graphics Capture. Not --all-features: the `gstreamer` feature needs GStreamer's MSVC
  # runtime and `pipewire`/`v4l2` are Linux-only. WebRTC audio processing is not built on Windows
  # (see apps/desktop/packaging/windows/README.md).
  windows:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: windows-latest
    env:
      SQLX_OFFLINE: "true"
      # No PDBs for the workspace's test binaries: the build output is the largest cache after the
      # Linux ones, and the Linux jobs build the same way.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # OpenH264 (tests) and OpenSSL for SQLCipher (built from source) need NASM; Perl comes with the image.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Placeholder UI bundle (the desktop build embeds crates/teamcraft-ui/dist)
        shell: bash
        run: mkdir -p crates/teamcraft-ui/dist
      # The desktop crate enables the Windows capture features of teamcraft-media itself.
      - name: Clippy (desktop shell and core)
        run: cargo clippy -p teamcraft-desktop -p teamcraft-core --all-targets -- -D warnings
      - name: Clippy (call media)
        run: cargo clippy -p teamcraft-media --all-targets --features native,mediafoundation,graphics-capture,wasapi-loopback,effects,segmentation,openh264-source -- -D warnings
      - name: Test (desktop shell and core)
        run: cargo test -p teamcraft-desktop -p teamcraft-core
      - name: Test (call media)
        run: cargo test -p teamcraft-media --features native,mediafoundation,graphics-capture,wasapi-loopback,effects,segmentation,openh264-source
      - name: Check (ARM64, cross-compiled)
        run: cargo check --target aarch64-pc-windows-msvc -p teamcraft-desktop
      # #915: does Media Foundation's H.264 encoder (GStreamer's mfh264enc) take the profile the
      # call media asks for? Needs GStreamer's MSVC runtime, which the hosted runner doesn't have;
      # the packages are pinned by hash. Media Foundation is a Windows Server feature that may be
      # missing on the runner (then mfh264enc is not there either, and the test says so).
      # The packages are big and their server is flaky. The cache only saves the download: the
      # pinned hashes below still check every file. Bump the key with GSTREAMER_VERSION.
      - name: Restore the GStreamer packages
        id: gstreamer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gstreamer-pkgs
          key: gstreamer-pkgs-windows-1.28.8
      - name: GStreamer (MSVC runtime and development files)
        shell: pwsh
        env:
          GSTREAMER_VERSION: "1.28.8"
          GSTREAMER_SHA256: "e4c41ee6ee9c6c32a45d198463ec08d79bac3bd5fa58adc93d13fe4a08abc9d9"
        run: |
          try {
            Install-WindowsFeature -Name Server-Media-Foundation | Format-List Success, RestartNeeded, ExitCode
          } catch {
            Write-Host "Media Foundation feature not installed: $_"
          }
          $file = "gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe"
          $packages = Join-Path $HOME "gstreamer-pkgs"
          New-Item -ItemType Directory -Force $packages | Out-Null
          $installer = Join-Path $packages $file
          if (-not (Test-Path $installer)) { curl.exe --fail --silent --show-error --location --http1.1 --retry 5 --retry-all-errors --continue-at - --output $installer "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc/$file" }
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() -ne $env:GSTREAMER_SHA256) { throw "GStreamer installer hash mismatch" }
          $install = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=C:\gstreamer", "/LOG=$env:RUNNER_TEMP\gstreamer-install.log"
          if ($install.ExitCode -ne 0) { throw "GStreamer installer exited with $($install.ExitCode)" }
          $inspect = Get-ChildItem C:\gstreamer -Recurse -Filter gst-inspect-1.0.exe | Select-Object -First 1
          $root = $inspect.Directory.Parent.FullName
          Write-Host "GStreamer root: $root"
          "$root\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if (-not (Get-Command pkg-config -ErrorAction SilentlyContinue)) { choco install pkgconfiglite --no-progress -y }
      # On main only: every pull request saving its own copy would push out the Rust caches.
      - name: Save the GStreamer packages
        if: github.ref == 'refs/heads/main' && steps.gstreamer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gstreamer-pkgs
          key: gstreamer-pkgs-windows-1.28.8
      - name: Media Foundation encoder available?
        shell: pwsh
        continue-on-error: true
        run: gst-inspect-1.0 mfh264enc
      - name: Test (Media Foundation H.264 encoder, #915)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cargo test -p teamcraft-media --lib --features native,gstreamer,openh264-source media_foundation -- --nocapture 2>&1 | Tee-Object -FilePath mf-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path mf-test.log -Pattern "SKIPPED") {
            "Media Foundation H.264 encoder: NOT fully tested, see the SKIPPED line in the log." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

  # The macOS call media: AVFoundation cameras and ScreenCaptureKit screens and sound (its Swift
  # bridge builds with the runner's Xcode). Without GStreamer, which only the release build bundles
  # (desktop-release.yml builds the whole app).
  macos:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: macos-26
    env:
      # Current macOS and the two releases before it (26 Tahoe, 15 Sequoia, 14 Sonoma).
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # No debug info for the workspace crates: smaller cache, same as the Linux test job.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The desktop shell links GStreamer (VideoToolbox encoding); same pinned packages as the release.
      # The packages are big and their server is flaky. The cache only saves the download: the
      # pinned hashes below still check every file. Bump the key with GSTREAMER_VERSION.
      - name: Restore the GStreamer packages
        id: gstreamer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gstreamer-pkgs
          key: gstreamer-pkgs-macos-1.28.8
      - name: GStreamer framework
        env:
          GSTREAMER_VERSION: "1.28.8"
        run: |
          set -euo pipefail
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$GSTREAMER_VERSION"
          mkdir -p "$HOME/gstreamer-pkgs"
          cd "$HOME/gstreamer-pkgs"
          for package in gstreamer-1.0 gstreamer-1.0-devel; do
            file="$package-$GSTREAMER_VERSION-universal.pkg"
            [ -f "$file" ] || curl --fail --silent --show-error --location --http1.1 --retry 5 --retry-all-errors --continue-at - --output "$file" "$base/$file"
          done
          echo "d371ab04a7632713626836c2fc234e863cc98484c74c473eba99b0fbd9b3a3fe  gstreamer-1.0-$GSTREAMER_VERSION-universal.pkg" | shasum -a 256 -c -
          echo "e6d380bc17be7eccf13e0154567d4718fc9321da822408c7ca0cd808b3d4a3f7  gstreamer-1.0-devel-$GSTREAMER_VERSION-universal.pkg" | shasum -a 256 -c -
          sudo installer -pkg "gstreamer-1.0-$GSTREAMER_VERSION-universal.pkg" -target /
          sudo installer -pkg "gstreamer-1.0-devel-$GSTREAMER_VERSION-universal.pkg" -target /
      # On main only: every pull request saving its own copy would push out the Rust caches.
      - name: Save the GStreamer packages
        if: github.ref == 'refs/heads/main' && steps.gstreamer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gstreamer-pkgs
          key: gstreamer-pkgs-macos-1.28.8
      - name: Placeholder UI bundle (the desktop build embeds crates/teamcraft-ui/dist)
        run: mkdir -p crates/teamcraft-ui/dist
      # The desktop shell has macOS-only code (notification center, dock); the release build is the
      # only other place it gets compiled for macOS.
      - name: Clippy (desktop shell)
        env:
          SQLX_OFFLINE: "true"
          PKG_CONFIG_PATH: /Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig
        run: cargo clippy -p teamcraft-desktop --all-targets -- -D warnings
      - name: Clippy (call media)
        run: cargo clippy -p teamcraft-media --all-targets --features native,avfoundation,screencapturekit,effects,openh264-source -- -D warnings
      - name: Test (call media)
        run: cargo test -p teamcraft-media --features native,avfoundation,screencapturekit,effects,openh264-source

  deny:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The release version must agree everywhere (docs/release.md); the release notes must still render.
  versions:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions agree (Cargo, desktop, Android, iOS)
        run: scripts/check-versions.sh
      - name: Release script tests (updater manifest, release notes, no demo data in release builds)
        run: python3 -m unittest discover -s scripts/tests -v
      - name: UI tasks touch signals only with try_ after an await (issue #322)
        run: scripts/check-async-signals.py
      - name: No track() on a memo nothing else reads, it never wakes its effect (issue #1203)
        run: scripts/check-memo-track.py
      - name: Desktop command arguments match what the UI sends (issue #397)
        run: scripts/check-tauri-args.py
      - name: Stylesheet has no undefined tokens or colliding rules, UI has no inline styles (issues #363, #376)
        run: scripts/check-css.py
      - name: Stylesheet, Fluent and Android strings stay split per area (issue #614)
        run: scripts/split-hotspots.py --check
      - name: No emoji as UI icons, markers or labels (issue #575)
        run: scripts/check-no-emoji-icons.py
      - name: Guest and external markers show only to members (issue #911)
        run: scripts/check-guest-markers.py
      - name: Release notes render
        run: |
          version="$(scripts/check-versions.sh)"
          printf 'ghcr.io/example/teamcraft-server:%s@sha256:0\n' "$version" > "$RUNNER_TEMP/images.txt"
          scripts/render-release-notes.py --version "$version" --tag "v$version" --repo "$GITHUB_REPOSITORY" \
            --images "$RUNNER_TEMP/images.txt" > "$RUNNER_TEMP/notes.md"
          if grep -n '{{' "$RUNNER_TEMP/notes.md"; then echo "::error::unfilled placeholder"; exit 1; fi

  # Two things `cargo test --workspace` never sees: `crates/vendor` is outside the workspace, so
  # davey's own known-answer tests (the DAVE hash ratchet and AES-GCM vectors, VENDORED.md) run here,
  # and `fuzz/` has its own lockfile and is otherwise only built by hand. `--locked` makes a stale
  # `fuzz/Cargo.lock` fail; building the targets (stable is enough) catches decoder API drift.
  vendored-and-fuzz:
    needs: [plan]
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:24fe71e069885c93b38cc6997f8005fb06b94e501dde7a07ce39c04c46d03e40
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SQLX_OFFLINE: "true"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: vendored-and-fuzz
          workspaces: |
            crates/vendor/davey
            crates/vendor/openmls_memory_storage
            fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "false"
      - name: Davey tests
        run: cargo test --manifest-path crates/vendor/davey/Cargo.toml
      - name: Davey clippy
        run: cargo clippy --manifest-path crates/vendor/davey/Cargo.toml --all-targets -- -D warnings
      - name: openmls_memory_storage tests
        run: cargo test --manifest-path crates/vendor/openmls_memory_storage/Cargo.toml --features test-utils
      - name: Fuzz targets build (lockfile up to date)
        run: cargo build --manifest-path fuzz/Cargo.toml --bins --locked

  # The one required check of `main` (repository ruleset), so auto-merge waits for CI where it ran:
  # with the `ci` label it passes only when every job above passed; without it the jobs are skipped
  # and it passes once `plan` has read the labels, so an unlabelled pull request doesn't wait for
  # builds nobody asked for.
  #
  # `always()`, because a skipped required check counts as passed, so `!cancelled()` would let a
  # cancelled run pass. A cancelled run (superseded by a push, or cancelled by hand) reports under
  # another name instead: not red, and no `ci-gate` from it, so the head still waits for a real verdict.
  ci-gate:
    name: ${{ contains(needs.*.result, 'cancelled') && 'ci-gate (cancelled run)' || 'ci-gate' }}
    if: always()
    needs: [plan, check, test, browser-tests, audio-processing, windows, macos, deny, versions, vendored-and-fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RUN_CI: ${{ needs.plan.outputs.run_ci }}
        run: |
          echo "job results: $RESULTS (run_ci=$RUN_CI)"
          # Keep this test the same as the job's name: only a run named differently may end here.
          case " $RESULTS " in
            *" cancelled "*) echo "::notice::this run was cancelled; it reports no ci-gate"; exit 0 ;;
          esac
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              # Jobs skip on purpose only without the `ci` label; with it, a skip is a fault.
              skipped) [ "$RUN_CI" != true ] || { echo "::error::a CI job was skipped although CI was requested"; exit 1; } ;;
              *) echo "::error::a CI job ended with '$result'"; exit 1 ;;
            esac
          done
