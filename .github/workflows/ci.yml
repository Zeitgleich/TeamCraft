name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Jobs run on GitHub's hosted runner, inside a Debian Trixie container with the same Rust image
# we use locally, so builds and tests see Debian, not the runner's Ubuntu.

jobs:
  check:
    name: check (${{ matrix.arch }})
    # Both Linux architectures the desktop ships for, each on a native runner; they run in
    # parallel, so arm64 adds no wall-clock time. Format and the wasm build are
    # architecture-independent and run once.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: rust:1.99.1-trixie
    steps:
      - uses: actions/checkout@v5
      - name: Rust components
        run: rustup component add rustfmt clippy && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: System packages for the Tauri desktop shell, native call media and capture
        # libpipewire/libspa + libclang: portal capture (bindgen); mesa-vulkan-drivers: lavapipe, a
        # software GPU, so the effects' golden-image tests run instead of skipping.
        run: >
          apt-get update && apt-get install -y --no-install-recommends cmake
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
          libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev mesa-vulkan-drivers
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-bad
      - name: Placeholder UI bundle (the desktop build embeds crates/teamcraft-ui/dist)
        run: mkdir -p crates/teamcraft-ui/dist
      - name: Format
        if: matrix.arch == 'x86_64'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        env:
          SQLX_OFFLINE: "true"
      - name: Test
        run: cargo test --workspace
        env:
          SQLX_OFFLINE: "true"
      - name: Wasm build (browser crates)
        if: matrix.arch == 'x86_64'
        run: >
          cargo check --target wasm32-unknown-unknown
          -p teamcraft-proto -p teamcraft-crypto -p teamcraft-media -p teamcraft-core -p teamcraft-ui

  # WebRTC audio processing (echo cancellation) is opt-in at build time, see
  # crates/teamcraft-media/README.md. Built from source here (version 2 isn't packaged).
  audio-processing:
    runs-on: ubuntu-latest
    container: rust:1.99.1-trixie
    env:
      RUSTFLAGS: "--cfg teamcraft_audio_processing --cfg teamcraft_audio_processing_bundled"
    steps:
      - uses: actions/checkout@v5
      - name: Rust components
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: audio-processing
      - name: System packages (ALSA, meson/ninja and libclang for the bundled build)
        run: >
          apt-get update && apt-get install -y --no-install-recommends
          libasound2-dev meson ninja-build libclang-dev
      - name: Clippy
        run: cargo clippy -p teamcraft-media --all-targets --features native -- -D warnings
      - name: Test
        run: cargo test -p teamcraft-media --features native

  # The Windows desktop client: the Tauri shell and the call media with Media Foundation cameras and
  # Windows Graphics Capture. Not --all-features: the `gstreamer` feature needs GStreamer's MSVC
  # runtime and `pipewire`/`v4l2` are Linux-only. WebRTC audio processing is opt-in and not built
  # here (see the experimental job below).
  windows:
    runs-on: windows-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      # OpenH264 (tests) and OpenSSL for SQLCipher (built from source) need NASM; Perl comes with the image.
      - uses: ilammy/setup-nasm@v1
      - name: Placeholder UI bundle (the desktop build embeds crates/teamcraft-ui/dist)
        shell: bash
        run: mkdir -p crates/teamcraft-ui/dist
      # The desktop crate enables the Windows capture features of teamcraft-media itself.
      - name: Clippy (desktop shell and core)
        run: cargo clippy -p teamcraft-desktop -p teamcraft-core --all-targets -- -D warnings
      - name: Clippy (call media)
        run: cargo clippy -p teamcraft-media --all-targets --features native,mediafoundation,graphics-capture,effects,segmentation,openh264-source -- -D warnings
      - name: Test (desktop shell and core)
        run: cargo test -p teamcraft-desktop -p teamcraft-core
      - name: Test (call media)
        run: cargo test -p teamcraft-media --features native,mediafoundation,graphics-capture,effects,segmentation,openh264-source
      - name: Check (ARM64, cross-compiled)
        run: cargo check --target aarch64-pc-windows-msvc -p teamcraft-desktop

  # Echo cancellation on Windows (WebRTC audio processing built with meson and MSVC). Experimental:
  # failures don't block merging until a real Windows run proves the build.
  windows-audio-processing:
    runs-on: windows-latest
    continue-on-error: true
    env:
      RUSTFLAGS: "--cfg teamcraft_audio_processing --cfg teamcraft_audio_processing_bundled"
      CC: cl
      CXX: cl
      # WebRTC uses C++20 designated initializers; MSVC needs the switch spelled out.
      CXXFLAGS: /std:c++20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: audio-processing
      - uses: ilammy/setup-nasm@v1
      # Meson otherwise picks the image's MinGW compiler, whose headers clash with abseil.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Meson and ninja
        run: pip install meson ninja
      - name: Test
        run: cargo test -p teamcraft-media --features native

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
