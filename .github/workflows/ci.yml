name: CI
'on':
  push:
    branches:
    - main
    paths-ignore:
    - docs/**
    - '**/*.md'
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  packages: read
env:
  CARGO_TERM_COLOR: always
jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run_ci: ${{ steps.plan.outputs.run_ci }}
      arm: ${{ steps.plan.outputs.arm }}
    steps:
    - id: plan
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        ACTION: ${{ github.event.action }}
        AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: "set -eu\nrun_ci=true\narm=false\nif [ \"$EVENT\" = pull_request ]; then\n  if [ \"$ACTION\" = opened ] && [ \"$GITHUB_RUN_ATTEMPT\" = 1 ]; then sleep 15; fi\n  read_labels() { gh api --paginate\
        \ \"repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels\" --jq '.[].name'; }\n  labels=\"$(read_labels || { sleep 5; read_labels; } || { sleep 20; read_labels; })\"\n  echo \"labels:\" $labels\n \
        \ printf '%s\\n' \"$labels\" | grep -qx ci || [ \"$AUTHOR\" = 'dependabot[bot]' ] || run_ci=false\n  ! printf '%s\\n' \"$labels\" | grep -qx arm || arm=true\nelif [ \"$EVENT\" = push ]; then\n \
        \ arm=true\nfi\necho \"run_ci=$run_ci arm=$arm\"\n{ echo \"run_ci=$run_ci\"; echo \"arm=$arm\"; } >> \"$GITHUB_OUTPUT\"\n"
  check:
    needs:
    - plan
    if: needs.plan.outputs.run_ci == 'true'
    name: check (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.arm == 'true' && '[{"arch":"x86_64","runner":"ubuntu-latest"},{"arch":"aarch64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"x86_64","runner":"ubuntu-latest"}]')
          }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:24fe71e069885c93b38cc6997f8005fb06b94e501dde7a07ce39c04c46d03e40
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
      - /usr/share/dotnet:/host/dotnet
      - /usr/local/lib/android:/host/android
      - /opt/ghc:/host/ghc
      - /opt/hostedtoolcache:/host/toolcache
    env:
      SQLX_OFFLINE: 'true'
    steps:
    - name: Free disk space on the runner
      run: nohup sh -c 'find /host/dotnet /host/android /host/ghc /host/toolcache -mindepth 1 -delete' > /dev/null 2>&1 &
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        key: check-${{ matrix.arch }}
        save-if: ${{ github.ref == 'refs/heads/main' && matrix.arch == 'x86_64' }}
        cache-bin: 'false'
    - name: Placeholder UI bundle (the desktop build embeds crates/teamcraft-ui/dist)
      run: mkdir -p crates/teamcraft-ui/dist
    - name: Format
      if: matrix.arch == 'x86_64'
      run: cargo fmt --all --check
  test:
    needs:
    - plan
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - run: echo stub; sleep 150
  browser-tests:
    needs:
    - plan
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - run: echo stub
  audio-processing:
    needs:
    - plan
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - run: echo stub
  windows:
    needs:
    - plan
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - run: echo stub
  macos:
    needs:
    - plan
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - run: echo stub
  deny:
    needs:
    - plan
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - run: echo stub
  versions:
    needs:
    - plan
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - run: echo stub
  vendored-and-fuzz:
    needs:
    - plan
    if: needs.plan.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - run: echo stub
  ci-gate:
    name: ${{ contains(needs.*.result, 'cancelled') && 'ci-gate (cancelled run)' || 'ci-gate' }}
    if: always()
    needs:
    - plan
    - check
    - test
    - browser-tests
    - audio-processing
    - windows
    - macos
    - deny
    - versions
    - vendored-and-fuzz
    runs-on: ubuntu-latest
    steps:
    - name: Every job that ran passed
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
        RUN_CI: ${{ needs.plan.outputs.run_ci }}
      run: "echo \"job results: $RESULTS (run_ci=$RUN_CI)\"\n# Keep this test the same as the job's name: only a run named differently may end here.\ncase \" $RESULTS \" in\n  *\" cancelled \"*) echo \"\
        ::notice::this run was cancelled; it reports no ci-gate\"; exit 0 ;;\nesac\nfor result in $RESULTS; do\n  case \"$result\" in\n    success) ;;\n    # Jobs skip on purpose only without the `ci` label;\
        \ with it, a skip is a fault.\n    skipped) [ \"$RUN_CI\" != true ] || { echo \"::error::a CI job was skipped although CI was requested\"; exit 1; } ;;\n    *) echo \"::error::a CI job ended with\
        \ '$result'\"; exit 1 ;;\n  esac\ndone\n"
