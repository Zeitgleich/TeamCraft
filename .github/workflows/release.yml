# Release (docs/release.md): a tag `v*` builds everything a release ships and attaches it to a
# **draft** GitHub release, which a maintainer reviews and publishes by hand (the nightly release
# starts it with `publish` and the last job publishes it, docs/release.md).
#
# - Server, SFU, integration bridge and notetaker images, multi-arch (amd64 + arm64, each built on a
#   native runner), pushed to ghcr.io/<owner>/teamcraft-server, -sfu, -bridge and -notetaker: the
#   version tag, X.Y and `latest` for releases, only the version for prereleases. Signed with cosign
#   (keyless) and with a build provenance attestation.
# - Desktop packages from desktop-release.yml (called, not copied), the web client bundle, and the
#   desktop updater manifest latest.json when the update artifacts are signed (docs/updates.md).
# - Android APKs of both flavors: release builds (signed only when the upload key secrets exist,
#   `-unsigned` otherwise) and `-debug-signed` builds for testers; the App Bundle of the `full`
#   flavor, which google-play.yml uploads to Google Play once the release is published. They don't
#   hold up the rest: the draft release is created without them, and the `android-release` job
#   attaches them (and their SHA256SUMS lines) when the Android build is done.
# - SBOMs (SPDX and CycloneDX) of the source tree and the images, image digests, SHA256SUMS, and a
#   build provenance attestation for every file.
# - Notes rendered from .github/release-notes.md: the highlights from the annotated tag's message, generated notes
#   (.github/release.yml categories), install and verification instructions.
#
# A tag equal to the tree's version (v1.2.3) is a release; v1.2.3-rc.1 on the same tree is a candidate
# that runs the same pipeline as a prerelease (scripts/check-versions.sh).
name: Release

on:
  push:
    tags: ["v*"]
  # Started on a tag ref by nightly-release.yml, whose tag push (made with GITHUB_TOKEN) starts no
  # workflow, and by hand to re-run a release (`gh workflow run release.yml --ref vX.Y.Z`).
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release once it is built (the nightly release does)
        type: boolean
        default: false

# Never two runs for the same tag; a re-pushed tag waits for the previous run instead of racing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every job states what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      image_owner: ${{ steps.version.outputs.image_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag must fit the versions in the tree (Cargo, desktop, Android, iOS).
      - name: Tag fits the versions in the tree
        id: version
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          scripts/check-versions.sh "$TAG"
          echo "image_owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      # Candidates must sort before their release in rpm and deb, or dnf/apt never upgrade to it
      # (scripts/linux-package-version.sh maps the tag to the package versions).
      - name: Candidate packages sort before the release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sudo apt-get install -y --no-install-recommends rpm
          scripts/linux-package-version.sh check "$TAG"

  image:
    name: Image ${{ matrix.image }} (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        image: [teamcraft-server, teamcraft-sfu, teamcraft-bridge, teamcraft-notetaker]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ needs.version.outputs.image_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      # Pushed by digest only; the merge job puts both architectures under the version tags.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/${{ matrix.image }}.Containerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Remember the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: Image ${{ matrix.image }} (multi-arch tags)
    needs: [version, image]
    strategy:
      fail-fast: false
      matrix:
        image: [teamcraft-server, teamcraft-sfu, teamcraft-bridge, teamcraft-notetaker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing and the provenance attestation (OIDC token, attestation store).
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ needs.version.outputs.image_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 1.2.3, 1.2 and latest for releases; a prerelease (1.0.0-rc.1) only gets its own tag.
      # Deployments should still pin a version or a digest (images.txt).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.version.outputs.is_prerelease == 'false' }}
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while IFS= read -r tag; do [ -n "$tag" ] && tags+=(-t "$tag"); done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Record the manifest digest
        id: digest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NAME: ${{ matrix.image }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          mkdir -p out
          echo "${IMAGE}:${VERSION}@${digest}" > "out/${NAME}.image"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the certificate names this workflow and the tag (cosign verify, release notes).
      - name: Sign the image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: SBOM of the image (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: out/${{ matrix.image }}-${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM of the image (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: cyclonedx-json
          output-file: out/${{ matrix.image }}-${{ needs.version.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-${{ matrix.image }}
          path: out/*
          if-no-files-found: error

  desktop:
    name: Desktop
    needs: version
    permissions:
      contents: read
      # The Linux jobs run in the CI image on GHCR.
      packages: read
    uses: ./.github/workflows/desktop-release.yml
    # The optional signing secrets (Apple Developer ID, updater key) are read inside it.
    secrets: inherit

  android:
    name: Android (full + libre)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TEAMCRAFT_ANDROID_CACHE: ${{ github.workspace }}/../android-cache
    steps:
      # The SDK, NDK and the Rust target directory need ~10 GB; the runner's preinstalled toolchains
      # we never use make room for them.
      - name: Free disk space on the runner
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t teamcraft-android-build:local apps/android/docker
      # Release builds are signed with the upload key when its secrets exist (README.md, "Signing"),
      # unsigned otherwise. Debug builds are always signed with a throwaway debug key so testers can
      # install them. Server and identity provider defaults come from repository variables.
      - name: Upload key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > apps/android/upload.keystore
            echo "HAS_UPLOAD_KEY=true" >> "$GITHUB_ENV"
          fi
      # Firebase of the `full` flavor (apps/android/README.md, `teamcraft.fcm*`): without it the store
      # build has no FCM and only UnifiedPush. Written into the build's Gradle user home (the
      # container's GRADLE_USER_HOME), not onto the command line, and removed after the build.
      # Required for a release; a candidate tag only warns.
      - name: Firebase config (full flavor)
        env:
          IS_PRERELEASE: ${{ needs.version.outputs.is_prerelease }}
          FCM_PROJECT_ID: ${{ secrets.TEAMCRAFT_FCM_PROJECT_ID }}
          FCM_APPLICATION_ID: ${{ secrets.TEAMCRAFT_FCM_APPLICATION_ID }}
          FCM_API_KEY: ${{ secrets.TEAMCRAFT_FCM_API_KEY }}
          FCM_SENDER_ID: ${{ secrets.TEAMCRAFT_FCM_SENDER_ID }}
        run: |
          missing=()
          [ -n "$FCM_PROJECT_ID" ] || missing+=(TEAMCRAFT_FCM_PROJECT_ID)
          [ -n "$FCM_APPLICATION_ID" ] || missing+=(TEAMCRAFT_FCM_APPLICATION_ID)
          [ -n "$FCM_API_KEY" ] || missing+=(TEAMCRAFT_FCM_API_KEY)
          [ -n "$FCM_SENDER_ID" ] || missing+=(TEAMCRAFT_FCM_SENDER_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            if [ "$IS_PRERELEASE" = true ]; then
              echo "::warning::the full flavor is built without FCM (missing secrets: ${missing[*]})"
              exit 0
            fi
            echo "::error::a release needs FCM in the full flavor; missing secrets: ${missing[*]}"
            exit 1
          fi
          mkdir -p "$TEAMCRAFT_ANDROID_CACHE/gradle"
          umask 077
          {
            echo "teamcraft.fcmProjectId=$FCM_PROJECT_ID"
            echo "teamcraft.fcmApplicationId=$FCM_APPLICATION_ID"
            echo "teamcraft.fcmApiKey=$FCM_API_KEY"
            echo "teamcraft.fcmSenderId=$FCM_SENDER_ID"
          } > "$TEAMCRAFT_ANDROID_CACHE/gradle/gradle.properties"
          echo "Firebase config written for the full flavor."
      - name: Build APKs and the App Bundle
        env:
          PUSH_GATEWAY_URL: ${{ vars.TEAMCRAFT_ANDROID_PUSH_GATEWAY_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          # No server or identity provider: the apps ask for the server (docs/release.md).
          args=(assembleFullRelease assembleLibreRelease assembleFullDebug assembleLibreDebug bundleFullRelease)
          [ -n "$PUSH_GATEWAY_URL" ] && args+=("-Pteamcraft.pushGatewayUrl=$PUSH_GATEWAY_URL")
          if [ "${HAS_UPLOAD_KEY:-}" = true ]; then
            args+=("-Pteamcraft.uploadKeystore=/src/apps/android/upload.keystore"
              "-Pteamcraft.uploadKeystorePassword=$KEYSTORE_PASSWORD"
              "-Pteamcraft.uploadKeyAlias=$KEY_ALIAS"
              "-Pteamcraft.uploadKeyPassword=$KEY_PASSWORD")
          fi
          apps/android/scripts/docker-build.sh "${args[@]}"
      - name: Remove the Firebase config
        if: always()
        run: rm -f "$TEAMCRAFT_ANDROID_CACHE/gradle/gradle.properties"
      - name: Collect APKs and the App Bundle
        run: |
          mkdir -p out
          for apk in apps/android/app/build/outputs/apk/*/*/*.apk; do
            flavor="$(basename "$(dirname "$(dirname "$apk")")")"
            type="$(basename "$(dirname "$apk")")"
            # Never leave it to the reader whether a file is signed: -unsigned (needs signing before it
            # installs), -debug-signed (throwaway debug key, testing only), plain = upload key.
            suffix=""
            case "$apk" in *-unsigned.apk) suffix="-unsigned" ;; esac
            [ "$type" = debug ] && suffix="-signed"
            cp "$apk" "out/teamcraft-android-${VERSION}-${flavor}-${type}${suffix}.apk"
          done
          # Gradle names a bundle the same whether it is signed or not.
          suffix="-unsigned"
          [ "${HAS_UPLOAD_KEY:-}" = true ] && suffix=""
          cp apps/android/app/build/outputs/bundle/fullRelease/app-full-release.aab \
            "out/teamcraft-android-${VERSION}-full-release${suffix}.aab"
          rm -f apps/android/upload.keystore
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: |
            out/*.apk
            out/*.aab
          if-no-files-found: error

  # Desktop, web and server files; Android joins in `android-release`, so a failed Android build
  # (a flaky SDK download, #696) never holds up the draft and the server deploy, which reads the web
  # bundle's line in SHA256SUMS.
  release:
    name: Draft release
    needs: [version, image-manifest, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      # Downloads this run's artifacts with gh.
      actions: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IS_PRERELEASE: ${{ needs.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only what the release attaches: not the buildx records (*.dockerbuild) and image digests the
      # other jobs leave behind. Each artifact lands in artifacts/<name>/. Large downloads fail now
      # and then; the whole download is retried.
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          patterns=(linux-packages-* 'teamcraft-desktop-*.flatpak*' 'macos-*' 'windows-*' ui-dist 'release-image-*')
          args=()
          for pattern in "${patterns[@]}"; do args+=(--pattern "$pattern"); done
          for attempt in 1 2 3 4; do
            rm -rf artifacts
            if gh run download "$RUN_ID" --repo "$REPO" --dir artifacts "${args[@]}"; then
              du -sh artifacts/*
              exit 0
            fi
            echo "::warning::download attempt $attempt failed"
            sleep $((attempt * 30))
          done
          echo "::error::downloading the release files failed"
          exit 1
      - name: Source SBOM, SPDX (Cargo.lock and the Android/Gradle dependencies in the tree)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: teamcraft-source-${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Source SBOM, CycloneDX
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: teamcraft-source-${{ needs.version.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Assemble the release files
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          WEB_RELEASE_KEY: ${{ secrets.TEAMCRAFT_WEB_RELEASE_KEY }}
        run: |
          mkdir -p dist
          mv "teamcraft-source-${VERSION}.spdx.json" "teamcraft-source-${VERSION}.cdx.json" dist/
          # Packages of every platform the desktop workflow builds (Windows joins with its jobs).
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.flatpak' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.app.tar.gz' -o -name '*.sig' \
            -o -name '*.spdx.json' -o -name '*.cdx.json' \) -exec cp {} dist/ \;
          # The web client: the same trunk build the desktop app embeds, served by the server
          # ([web] static_dir), plus precompressed .br/.gz variants the server picks by Accept-Encoding.
          # Never with demo data. Signed with the web release key when the secret exists: its service
          # worker then only runs files the manifest lists (e2ee.md §9.3).
          scripts/check-no-demo-data.py artifacts/ui-dist
          web="$RUNNER_TEMP/web"
          cp -R artifacts/ui-dist "$web"
          # The browser's background effects download the segmentation model (#439); not in git.
          crates/teamcraft-ui/scripts/add-segmentation-model.sh "$web"
          if [ -n "$WEB_RELEASE_KEY" ]; then
            key="$RUNNER_TEMP/web-release.pem"
            (umask 077 && printf '%s\n' "$WEB_RELEASE_KEY" > "$key")
            crates/teamcraft-ui/scripts/sign-web-release.sh "$web" "$key" "$VERSION"
            rm -f "$key"
          else
            echo "::warning::no TEAMCRAFT_WEB_RELEASE_KEY: the web client is unsigned and warns its users"
          fi
          command -v brotli >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q brotli; }
          scripts/compress-web.sh "$web"
          tar -C "$web" -czf "dist/teamcraft-web-${VERSION}.tar.gz" .
          cat artifacts/release-image-*/*.image > dist/images.txt
          # The desktop updater's manifest; every platform must be signed or none (docs/updates.md §3).
          if compgen -G 'dist/*.sig' >/dev/null; then
            scripts/updater-manifest.py --version "$VERSION" --tag "$TAG" --repo "$REPO" --dir dist --require-all > dist/latest.json
            cat dist/latest.json
          else
            echo "::warning::no signed update artifacts: this release has no latest.json, installed apps won't see it"
          fi
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
          cat dist/images.txt
      # One attestation over every file in SHA256SUMS: `gh attestation verify <file> --repo ...`.
      - name: Build provenance attestation of the files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Release notes (.github/release-notes.md, tag message, generated notes)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # actions/checkout leaves the tag lightweight; the highlights are in the annotated tag object.
          # A candidate with an empty message falls back to its base version's tag, if it exists.
          git fetch --no-tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          base="v${VERSION%%-*}"
          if [ "$base" != "$TAG" ]; then
            git fetch --no-tags --force origin "refs/tags/${base}:refs/tags/${base}" 2>/dev/null \
              || echo "no tag ${base} yet"
          fi
          gh api "repos/${REPO}/releases/generate-notes" -f tag_name="$TAG" -q .body > generated.md
          scripts/render-release-notes.py --version "$VERSION" --tag "$TAG" --repo "$REPO" \
            --images dist/images.txt --generated generated.md > notes.md
          cat notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft --verify-tag --title "TeamCraft ${VERSION}" --notes-file notes.md)
          [ "$IS_PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: keep the lines of the files android-release attached in the meantime.
            existing="$RUNNER_TEMP/existing"
            mkdir -p "$existing"
            gh release download "$TAG" --pattern SHA256SUMS --dir "$existing" --clobber \
              || echo "the release has no SHA256SUMS yet"
            scripts/merge-checksums.py "$existing/SHA256SUMS" dist/SHA256SUMS > "$existing/merged"
            mv "$existing/merged" dist/SHA256SUMS
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" "${flags[@]}" dist/*
          fi

  # Attaches the Android files to the release the `release` job created, draft or already published,
  # and adds their lines to SHA256SUMS. A re-run after a failed Android build is all it takes.
  android-release:
    name: Attach Android files
    needs: [version, android, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      # Starts google-play.yml when the release was published before its bundle was attached.
      actions: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-android
          path: android
      - name: Checksums of the Android files
        run: |
          (cd android && sha256sum -- *.apk *.aab > "$RUNNER_TEMP/android.sums")
          cat "$RUNNER_TEMP/android.sums"
      - name: Build provenance attestation of the Android files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/android.sums
      - name: Attach to the release
        id: attach
        run: |
          # Published before this job? Then google-play.yml already ran without the bundle.
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          echo "was_published=$([ "$is_draft" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          mkdir -p sums
          gh release download "$TAG" --pattern SHA256SUMS --dir sums --clobber
          scripts/merge-checksums.py sums/SHA256SUMS "$RUNNER_TEMP/android.sums" > android/SHA256SUMS
          gh release upload "$TAG" android/* --clobber
          cat android/SHA256SUMS
      # The publish event's runs of google-play.yml and packages.yml found no Android files; run them
      # again now that the files are there.
      - name: Google Play and the package site, when already published
        if: steps.attach.outputs.was_published == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::notice::${TAG} was published before its Android files were attached; starting Google Play and Packages again"
          gh workflow run google-play.yml --ref "$DEFAULT_BRANCH" -f tag="$TAG"
          gh workflow run packages.yml --ref "$DEFAULT_BRANCH"

  # Nightly releases (`publish`): publishes the release when it is built. Publishing with the
  # workflow's token starts no `release: published` workflows, so the package site and Google Play
  # are started here. An Android build that failed doesn't hold the release back (#696): the files
  # are attached later, and `android-release` then starts both again.
  publish:
    name: Publish
    needs: [release, android-release]
    if: ${{ !cancelled() && inputs.publish && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ANDROID_RESULT: ${{ needs.android-release.result }}
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false
      - name: Package site and Google Play
        run: |
          gh workflow run packages.yml --ref "$DEFAULT_BRANCH"
          if [ "$ANDROID_RESULT" = success ]; then
            gh workflow run google-play.yml --ref "$DEFAULT_BRANCH" -f tag="$TAG"
          else
            echo "::warning::no Android files yet; re-run android-release, it starts Google Play"
          fi
