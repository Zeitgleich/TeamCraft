# Warms the Rust build cache of the desktop release jobs on `main`. Release runs start from a tag and
# can only restore caches saved on the tag or the default branch, so without this every release
# compiled all dependencies from scratch (#176). It runs desktop-release.yml itself in its
# compile-only mode, so the cache keys, toolchains, flags and features are exactly the release's.
#
# rust-cache keeps the compiled dependencies, not the workspace crates, and its key covers the
# lockfile, the manifests, the toolchain and the compiler flags. It runs once a night, before the
# nightly release (04:30 Berlin), not on every dependency change: each run restores and saves about
# 6.5 GB of release caches, which then count as the newest in the repository's 10 GB cache budget and
# pushed CI's own caches out, so CI's test job compiled from scratch and ran out of memory (#2344).
# When the key already exists it only restores the cache (which also keeps it from expiring) and
# skips the compile; after a dependency change a release can be warmed by hand (workflow_dispatch).
name: Desktop cache

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# One warm-up at a time; a running one finishes (a cancelled one would save nothing), and only the
# newest queued one is kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # The Linux jobs run in the CI image on GHCR.
  packages: read
  # The jobs wait for the UI bundle artifact (desktop-release.yml).
  actions: read

jobs:
  desktop:
    name: Desktop
    uses: ./.github/workflows/desktop-release.yml
    with:
      warm-cache: true
