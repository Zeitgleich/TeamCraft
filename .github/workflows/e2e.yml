name: E2E

# The end-to-end suite starts the dev stack (Keycloak, Postgres, Garage, Mailpit), the real server,
# SFU and bridge, and drives them with headless clients and Chromium (tests/e2e/README.md). It takes
# about an hour of runner time and needs containers, so it doesn't run on every push.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "all, or only the desktop app's measurement"
        type: choice
        options: [all, desktop]
        default: all
  schedule:
    - cron: "17 2 * * *"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The web client as it ships, with its link-time optimization: 25 minutes on a four-core runner
  # that grew with the app. In its own job they don't come out of the tests' time limit (#1281).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the web client (trunk in a container)
        run: tests/e2e/web/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web
          path: target/e2e-web
          if-no-files-found: error
          retention-days: 2

  e2e:
    needs: [web]
    if: inputs.jobs != 'desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
      - name: System packages (ALSA for the native call client, libclang and cmake for the codecs)
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libclang-dev cmake pkg-config libssl-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-web
          path: target/e2e-web
      - name: Run the suite
        # Starts the dev stack, builds server, SFU and bridge, runs the tests. The runner's Google
        # Chrome drives the browser tests. Ends before the job does, so the screenshots and process
        # logs below are still uploaded when it runs out of time.
        timeout-minutes: 52
        run: scripts/e2e.sh --prebuilt-web
      - name: Collect the process logs
        # The logs of the server, SFU and bridge of failed tests stay in the temp directory, next to
        # the profiles of the Chromium that are left after a timeout. Those are not wanted, and they
        # change while they are read: a file that vanishes during the upload fails it (#1281).
        if: failure()
        run: |
          mkdir -p target/e2e-artifacts/processes
          find /tmp -maxdepth 1 -type d -name 'teamcraft-e2e-*' ! -name 'teamcraft-e2e-chrome-*' \
            -exec cp -r {} target/e2e-artifacts/processes/ \; || true
      - name: Failure screenshots and process logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: target/e2e-artifacts
          if-no-files-found: ignore
      - name: Dev stack logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color --tail 200

  # The Linux desktop app hidden in the tray (#1022, tests/e2e/README.md "Desktop"): a debug build
  # with the web client embedded, on a virtual display, with its own session bus and keyring. Its
  # own job: the desktop build doesn't fit into the suite's time limit.
  desktop:
    needs: [web]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # No debug info: a smaller build and cache; the measurement doesn't need it.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: desktop
      - name: System packages (the desktop app's libraries, a virtual display, a session bus and keyring)
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
          libasound2-dev libpipewire-0.3-dev libspa-0.2-dev
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          libclang-dev cmake pkg-config libssl-dev
          xvfb xauth dbus-daemon gnome-keyring
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-web
          path: target/e2e-web
      - name: Build the desktop app with the web client embedded
        run: |
          rm -rf crates/teamcraft-ui/dist
          cp -r target/e2e-web crates/teamcraft-ui/dist
          SQLX_OFFLINE=true cargo build -p teamcraft-desktop --features custom-protocol
      - name: Measure the app hidden in the tray
        timeout-minutes: 40
        run: |
          export E2E_DESKTOP_BIN="$GITHUB_WORKSPACE/target/debug/teamcraft-desktop" E2E_DESKTOP_REQUIRED=1
          xvfb-run -a -s "-screen 0 1600x1000x24" scripts/e2e.sh --prebuilt-web --desktop -- desktop_perf::
      - name: The numbers and, on failure, the process logs
        if: always()
        run: |
          mkdir -p target/e2e-artifacts/processes
          find /tmp -maxdepth 1 -type d -name 'teamcraft-e2e-*' ! -name 'teamcraft-e2e-chrome-*' \
            -exec cp -r {} target/e2e-artifacts/processes/ \; || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-perf
          path: target/e2e-artifacts
          if-no-files-found: ignore
