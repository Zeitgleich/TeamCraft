name: Deploy

# The Ansible deployment in deploy/: lint on every change to it; the end-to-end dry run
# (deploy/test/dry-run.sh) on demand. Add a schedule to the dry run once it has run green here.
on:
  push:
    branches: [main]
    paths: ["deploy/**", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["deploy/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the end-to-end dry run (builds images, deploys to a local container)
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANSIBLE_LINT_VERSION: "25.12.2"
  YAMLLINT_VERSION: "1.38.0"

jobs:
  lint:
    name: yamllint + ansible-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Linters
        run: pip install "ansible-lint==${ANSIBLE_LINT_VERSION}" "yamllint==${YAMLLINT_VERSION}"
      - name: Collections the role uses
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: yamllint
        run: yamllint -c .yamllint.yml --strict .
      - name: ansible-lint (production profile)
        run: ansible-lint --profile production ansible/
      - name: Shell scripts
        run: shellcheck test/dry-run.sh

  dry-run:
    name: Dry run
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Free disk space on the runner
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: System packages
        run: >
          sudo apt-get update && sudo apt-get install -y socat
          libasound2-dev libclang-dev cmake pkg-config libssl-dev
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Ansible
        run: pip install ansible-core && ansible-galaxy collection install -r deploy/ansible/requirements.yml
      - name: Dev stack (Keycloak, Garage)
        run: |
          docker compose -f docker-compose.dev.yml up -d keycloak garage
          until curl -sf http://127.0.0.1:8080/realms/teamcraft-dev/.well-known/openid-configuration >/dev/null; do sleep 3; done
          ./dev/init-garage.sh
      - name: Dry run
        run: deploy/test/dry-run.sh all
      - name: Remove the target
        if: always()
        run: deploy/test/dry-run.sh down
