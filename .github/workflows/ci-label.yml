# Starts the CI run for a `ci` or `arm` label added after the pull request was opened. ci.yml has no
# `labeled` trigger: every label event would start a run, and the newest run of a workflow replaces
# the earlier ones in the pull request's checks, so a label like `bug` would hide the real run's
# `ci-gate` and block the merge. Here an unrelated label only starts this tiny workflow, which is
# skipped.
#
# Labels added within the first seconds of a pull request (`gh pr create --label`) are not started
# here: the `opened` run waits and reads them (the `plan` job of ci.yml). The wait there (15 s) is
# longer than the age limit here (10 s), so each label is seen by one of the two, never by neither.
#
# `pull_request_target` runs with this repository's token; the job never checks out or runs code of
# the pull request, and the PR's data reaches the shell only through the environment. Pull requests
# from forks are skipped: their branch doesn't exist here, and they get no auto-merge either.
name: CI label

on:
  pull_request_target:
    types: [labeled]

permissions:
  actions: write

jobs:
  start-ci:
    name: Start CI for the label
    if: >-
      contains(fromJSON('["ci", "arm"]'), github.event.label.name) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ci.yml on the branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: |
          age=$(( $(date +%s) - $(date -d "$CREATED_AT" +%s) ))
          if [ "$age" -lt 10 ]; then
            echo "::notice::the pull request is ${age}s old; the run of its opening reads this label"
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" -f pr="$PR_NUMBER"
