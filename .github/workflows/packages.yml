# Package site (docs/updates.md §5): when a release is published (or by hand), rebuilds the GitHub
# Pages site: the landing page with the downloads, the desktop update manifests per channel
# (updates/{stable,prerelease}/latest.json) and the signed APT and RPM repositories, from the newest
# published stable release and the newest published release of any kind. Stateless: every run rebuilds everything from the releases.
#
# One-time setup: Settings > Pages > Source: GitHub Actions; the secrets LINUX_REPO_GPG_PRIVATE_KEY
# (armored) and LINUX_REPO_GPG_PASSPHRASE. Without the key the site has the manifests only.
name: Packages

on:
  release:
    types: [published]
  workflow_dispatch:

# One site build at a time; a newer one replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools (apt-ftparchive, createrepo_c, rpmsign)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c rpm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Download the packages of the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/package-site.sh fetch "$RUNNER_TEMP/work"
      - name: Repository key (optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LINUX_REPO_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_REPO_GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then exit 0; fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          {
            echo "GNUPGHOME=$GNUPGHOME"
            echo "GPG_KEY_ID=$fingerprint"
            echo "GPG_PASSPHRASE_FILE=$GNUPGHOME/passphrase"
          } >> "$GITHUB_ENV"
      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          REPO: ${{ github.repository }}
          # Store listings for the landing page; repository variables, unset until published.
          PLAY_STORE_URL: ${{ vars.PLAY_STORE_URL }}
          APP_STORE_URL: ${{ vars.APP_STORE_URL }}
        run: scripts/package-site.sh build "$RUNNER_TEMP/work" "$RUNNER_TEMP/site"
      # Identifies this build on the live site; the deploy job waits until the site serves it.
      - name: Build id
        run: echo "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/site/site-build.txt"
      # Installed clients and the setup snippets use these paths: no page may link a missing file.
      - name: Check the site's links
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: scripts/package-site-page.py check --site "$RUNNER_TEMP/site" --site-url "$SITE_URL"
      # The signatures must verify with the key the site publishes.
      - name: Verify the site
        working-directory: ${{ runner.temp }}/site
        run: |
          if [ ! -f teamcraft-archive-keyring.gpg ]; then ls -R updates; exit 0; fi
          for suite in apt/dists/*/; do
            gpgv --keyring ./teamcraft-archive-keyring.gpg "$suite/InRelease"
            gpgv --keyring ./teamcraft-archive-keyring.gpg "$suite/Release.gpg" "$suite/Release"
          done
          for repo in rpm/*/; do
            gpgv --keyring ./teamcraft-archive-keyring.gpg "$repo/repodata/repomd.xml.asc" "$repo/repodata/repomd.xml"
          done
          rpmdb="$(mktemp -d)"
          rpm --dbpath "$rpmdb" --import teamcraft-archive-keyring.asc
          rpm --dbpath "$rpmdb" -K rpm/*/*.rpm
          du -sh .
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages ignores a deployment whose pages_build_version it has already deployed, and
      # actions/deploy-pages sends GITHUB_SHA as that version without a way to change it. A final
      # release is tagged on its release candidate's commit, so the SHA alone repeats (issue #279).
      # This step makes the same three API calls as deploy-pages (artifact lookup, OIDC token,
      # create + poll the deployment) with a build version that is unique per run.
      - id: deployment
        name: Deploy to Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILD_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          artifact_id="$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "github-pages")] | first | .id')"
          if [ -z "$artifact_id" ] || [ "$artifact_id" = "null" ]; then
            echo "::error::The github-pages artifact of this run was not found."
            exit 1
          fi
          oidc_token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)"
          echo "::add-mask::$oidc_token"
          deployment="$(gh api -X POST "repos/$REPO/pages/deployments" \
            -F "artifact_id=$artifact_id" -f "pages_build_version=$BUILD_VERSION" -f "oidc_token=$oidc_token")"
          deployment_id="$(jq -r '.id // (.status_url | split("/") | last)' <<< "$deployment")"
          echo "page_url=$(jq -r .page_url <<< "$deployment")" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 60); do
            status="$(gh api "repos/$REPO/pages/deployments/$deployment_id" --jq .status)"
            echo "Attempt $attempt: deployment $deployment_id is '$status'."
            case "$status" in
              succeed) exit 0 ;;
              *fail* | *error* | *cancel* | *lost*)
                echo "::error::The Pages deployment ended as '$status'."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::The Pages deployment did not finish within 10 minutes."
          exit 1
      # deploy-pages can report success without the site changing: Pages ignored the deployment of a
      # final release whose commit the release candidate had already deployed (issue #279). Wait for
      # this run's build id on the live site (cache-busted) and fail loudly if it never shows up.
      - name: Check the live site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          url="${PAGE_URL%/}/site-build.txt"
          live=""
          for attempt in $(seq 1 40); do
            live="$(curl -fsS -H 'Cache-Control: no-cache' "$url?nocache=$EXPECTED-$attempt" || true)"
            if [ "$live" = "$EXPECTED" ]; then
              echo "The live site serves build $EXPECTED."
              exit 0
            fi
            echo "Attempt $attempt: the live site serves build '${live:-none}', waiting for $EXPECTED."
            sleep 15
          done
          echo "::error::The live site still serves build '${live:-none}' instead of $EXPECTED after 10 minutes. Re-run from the default branch: gh workflow run packages.yml --ref main"
          exit 1
