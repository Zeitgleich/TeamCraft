name: Images
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - containers/teamcraft-*.Containerfile
    - .github/workflows/images.yml
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changed:
    name: Changed images
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci') || github.run_attempt > 1
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: list
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
      run: "if [ \"$EVENT\" = \"pull_request\" ] && ! git diff --quiet \"$BASE\" HEAD -- .github/workflows/images.yml; then\n  files=\"$(ls containers/teamcraft-*.Containerfile)\"\nelif [ \"$EVENT\" = \"\
        pull_request\" ]; then\n  files=\"$(git diff --name-only \"$BASE\" HEAD -- 'containers/teamcraft-*.Containerfile')\"\nelse\n  files=\"$(ls containers/teamcraft-*.Containerfile)\"\nfi\nimages=\"\
        $(printf '%s\\n' \"$files\" | sed -n 's|^containers/\\(.*\\)\\.Containerfile$|\\1|p' | jq -R . | jq -cs .)\"\necho \"images=${images}\" >> \"$GITHUB_OUTPUT\"\necho \"Images to build: ${images}\"\
        \n"
  image:
    needs: changed
    if: needs.changed.outputs.images != '[]'
    runs-on: ubuntu-latest
    steps:
    - run: echo stub
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changed.outputs.images) }}
