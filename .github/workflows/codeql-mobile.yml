name: CodeQL mobile

# Code scanning for the Android (Kotlin) and iOS (Swift) apps. codeql.yml covers the languages that
# need no build; Kotlin and Swift do, so they live here. GitHub's default setup is not configured
# for this repository, so the two advanced setups don't collide.
#
# Cost control (macOS minutes are billed ten times):
#   - Swift (macOS) runs weekly, on manual dispatch, and on pushes to main that touch apps/ios/**.
#     Never on pull requests.
#   - Kotlin (Ubuntu) runs weekly, on manual dispatch, on pushes to main that touch apps/android/**,
#     and on pull requests with the `ci` label that touch apps/android/** or this file.
# The Rust core is built in debug mode, with the same Rust cache keys as the Android and iOS
# workflows, which restore main's cache. Not a required check; ci-gate does not depend on it.
on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - ".github/workflows/codeql-mobile.yml"
  pull_request:
    # No `labeled`: ci-label.yml re-runs this when the `ci` label comes after opening.
    types: [opened, synchronize, reopened]
    paths:
      - "apps/android/**"
      - ".github/workflows/codeql-mobile.yml"
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

# A newer push replaces a scan that is still waiting; a running one finishes (superseded PR runs
# are cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides which languages this event needs, so the macOS job never starts for an Android-only change.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          HAS_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci') || github.run_attempt > 1 }}
        run: |
          kotlin='{"language":"java-kotlin","os":"ubuntu-latest","build":"android"}'
          swift='{"language":"swift","os":"macos-26","build":"ios"}'
          case "${EVENT}" in
            pull_request)
              # Same rule as the Android workflow: pull requests run with the `ci` label only.
              if [ "${HAS_CI_LABEL}" = true ]; then include="${kotlin}"; else include=""; fi ;;
            push)
              files=$(gh api --paginate "repos/${GH_REPO}/compare/${BEFORE}...${AFTER}" --jq '.files[].filename' 2>/dev/null || echo "?")
              include=""
              if [ "${files}" = "?" ] || printf '%s\n' "${files}" | grep -q '^\.github/workflows/codeql-mobile\.yml$'; then
                include="${kotlin},${swift}"
              else
                if printf '%s\n' "${files}" | grep -q '^apps/android/'; then include="${kotlin}"; fi
                if printf '%s\n' "${files}" | grep -q '^apps/ios/'; then include="${include:+${include},}${swift}"; fi
              fi ;;
            *) include="${kotlin},${swift}" ;;
          esac
          echo "matrix={\"include\":[${include}]}" >> "$GITHUB_OUTPUT"
          echo "Languages: ${include:-none}"

  analyze:
    name: analyze (${{ matrix.language }})
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Rust core is built before CodeQL starts tracing: only the Kotlin and Swift compilations
      # belong in the database, not cargo. The apps' compile steps need the UniFFI bindings
      # (Kotlin or Swift sources, generated and not in git) and, for Swift, the XCFramework to link.
      - if: matrix.build == 'android'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - if: matrix.build == 'android'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: codeql-android
          # Restore only: the 0.6 GB entry pushed the repository over its 10 GB cache budget; this
          # scan is not time-critical, so it starts cold.
          save-if: "false"
      - name: System libraries of the host build
        if: matrix.build == 'android'
        # The CI image's list (containers/ci.Containerfile) for this crate's -sys dependencies: ALSA
        # (alsa-sys, via the audio stack), clang and cmake (opusic-sys, openh264-sys2, aws-lc-sys).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libclang-dev pkg-config cmake
      - name: Kotlin bindings from the host build of the Rust core
        if: matrix.build == 'android'
        # The bindings are read from the library's metadata, which is the same for any target, so the
        # Linux host build replaces the NDK builds of both ABIs. The native libraries stay out: the
        # Kotlin compilation does not need them.
        run: |
          cargo build --locked -p teamcraft-ffi
          cargo run --locked -q -p teamcraft-uniffi-bindgen -- generate --no-format \
            --library target/debug/libteamcraft_ffi.so --language kotlin \
            --out-dir apps/android/app/src/main/java
      - name: Android SDK packages
        if: matrix.build == 'android'
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "${sdkmanager}" --licenses > /dev/null
          "${sdkmanager}" "platforms;android-37.0" "build-tools;36.0.0"

      - if: matrix.build == 'ios'
        name: Tools
        run: brew install xcodegen cmake
      - if: matrix.build == 'ios'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The iOS workflow's key: restores the cache main saved there.
          key: ios
          save-if: false
      - name: Rust core as XCFramework and Swift bindings
        if: matrix.build == 'ios'
        run: apps/ios/scripts/build-xcframework.sh --debug --simulator-arm64-only
      - name: Generate the Xcode project
        if: matrix.build == 'ios'
        working-directory: apps/ios
        run: xcodegen generate

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          queries: security-extended
          # Excluded paths and why: .github/codeql/codeql-config.yml.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build the Kotlin app (both flavors)
        if: matrix.build == 'android'
        working-directory: apps/android
        # Compiles the code and nothing else (no packaging, no tests, no native libraries). The
        # Gradle daemon is off so CodeQL's tracer sees every compiler process, and the tasks are
        # re-run: an up-to-date task would skip the compiler and leave the database empty.
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks compileFullDebugKotlin compileLibreDebugKotlin
      - name: Build the Swift app and extension (simulator, unsigned)
        if: matrix.build == 'ios'
        working-directory: apps/ios
        run: >
          set -o pipefail &&
          xcodebuild build -project TeamCraft.xcodeproj -scheme TeamCraft
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" COMPILER_INDEX_STORE_ENABLE=NO
          | tail -n 100

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
