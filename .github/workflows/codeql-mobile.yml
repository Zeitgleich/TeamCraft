name: CodeQL mobile
'on':
  push:
    branches:
    - main
    paths:
    - apps/android/**
    - apps/ios/**
    - .github/workflows/codeql-mobile.yml
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - apps/android/**
    - .github/workflows/codeql-mobile.yml
  schedule:
  - cron: 17 5 * * 2
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - id: matrix
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.sha }}
        HAS_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci') || github.run_attempt > 1 }}
      run: "kotlin='{\"language\":\"java-kotlin\",\"os\":\"ubuntu-latest\",\"build\":\"android\"}'\nswift='{\"language\":\"swift\",\"os\":\"macos-26\",\"build\":\"ios\"}'\ncase \"${EVENT}\" in\n  pull_request)\n\
        \    # Same rule as the Android workflow: pull requests run with the `ci` label only.\n    if [ \"${HAS_CI_LABEL}\" = true ]; then include=\"${kotlin}\"; else include=\"\"; fi ;;\n  push)\n    files=$(gh\
        \ api --paginate \"repos/${GH_REPO}/compare/${BEFORE}...${AFTER}\" --jq '.files[].filename' 2>/dev/null || echo \"?\")\n    include=\"\"\n    if [ \"${files}\" = \"?\" ] || printf '%s\\n' \"${files}\"\
        \ | grep -q '^\\.github/workflows/codeql-mobile\\.yml$'; then\n      include=\"${kotlin},${swift}\"\n    else\n      if printf '%s\\n' \"${files}\" | grep -q '^apps/android/'; then include=\"${kotlin}\"\
        ; fi\n      if printf '%s\\n' \"${files}\" | grep -q '^apps/ios/'; then include=\"${include:+${include},}${swift}\"; fi\n    fi ;;\n  *) include=\"${kotlin},${swift}\" ;;\nesac\necho \"matrix={\\\
        \"include\\\":[${include}]}\" >> \"$GITHUB_OUTPUT\"\necho \"Languages: ${include:-none}\"\n"
  analyze:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    steps:
    - run: echo stub
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
