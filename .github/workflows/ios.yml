name: iOS
'on':
  push:
    branches:
    - main
    paths:
    - apps/ios/**
    - crates/teamcraft-ffi/**
    - crates/teamcraft-core/**
    - crates/teamcraft-client-api/**
    - crates/teamcraft-crypto/**
    - crates/teamcraft-media/**
    - crates/teamcraft-proto/**
    - crates/teamcraft-uniffi-bindgen/**
    - Cargo.lock
    - .github/workflows/ios.yml
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - apps/ios/**
    - crates/teamcraft-ffi/**
    - crates/teamcraft-core/**
    - crates/teamcraft-client-api/**
    - crates/teamcraft-crypto/**
    - crates/teamcraft-media/**
    - crates/teamcraft-proto/**
    - crates/teamcraft-uniffi-bindgen/**
    - Cargo.lock
    - .github/workflows/ios.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'ci') || github.run_attempt > 1
    runs-on: ubuntu-latest
    steps:
    - run: echo stub
