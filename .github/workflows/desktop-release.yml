# Desktop release build (draft): builds the Linux and macOS packages and keeps them as workflow
# artifacts. It does not publish anything: no GitHub release, no Flathub, no notarization upload.
# Run it by hand (Actions > Desktop release > Run workflow) or by pushing a tag like v0.1.0.
name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Release builds include WebRTC echo cancellation, built from source (crates/teamcraft-media/README.md).
  RUSTFLAGS: "--cfg teamcraft_audio_processing --cfg teamcraft_audio_processing_bundled"

jobs:
  linux:
    name: Linux (deb, rpm, AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
          libayatana-appindicator3-dev patchelf rpm libfuse2t64
          libasound2-dev ninja-build libclang-dev libpipewire-0.3-dev libspa-0.2-dev
      - name: Meson (builds WebRTC audio processing)
        run: pipx install meson
      - name: Trunk (builds the UI bundle)
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build packages
        working-directory: apps/desktop
        run: cargo tauri build --bundles deb,rpm,appimage
        env:
          # AppImage tooling runs without FUSE on hosted runners.
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Keep the plain binary for the Flatpak job
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: target/release/teamcraft-desktop
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle (build only)
    needs: linux
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: target/release
      - name: Make the binary executable
        run: chmod +x target/release/teamcraft-desktop
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: teamcraft-desktop.flatpak
          manifest-path: apps/desktop/packaging/linux/org.teamcraft.desktop.yml
          cache-key: flatpak-builder-${{ github.sha }}

  macos:
    name: macOS (${{ matrix.target }}, dmg)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Meson and ninja (build WebRTC audio processing)
        run: brew install meson ninja
      - name: Trunk (builds the UI bundle)
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build dmg
        working-directory: apps/desktop
        run: cargo tauri build --target ${{ matrix.target }} --bundles dmg
        env:
          # Signing and notarization are left out on purpose (the dmg is unsigned). To enable them,
          # add these repository secrets and pass them here, as described in the Tauri macOS guide:
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
