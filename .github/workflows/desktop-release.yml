# Desktop release build: builds the Linux and macOS packages and keeps them as workflow artifacts.
# It publishes nothing itself (no Flathub, no notarization upload). release.yml calls it for a tag
# `v*` and attaches the packages to the draft GitHub release; run it by hand (Actions > Desktop
# release > Run workflow) to get the packages of a branch without a release.
name: Desktop release

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Release builds include WebRTC echo cancellation, built from source (crates/teamcraft-media/README.md).
  RUSTFLAGS: "--cfg teamcraft_audio_processing --cfg teamcraft_audio_processing_bundled"

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (deb, rpm, AppImage)
    # x86_64 and aarch64, each on a native runner (no emulation), in the multi-arch Debian Trixie
    # image that CI and local container builds use.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Rust, the system packages, trunk and the Tauri CLI are in the CI image (containers/ci.Containerfile).
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:26f5d789fcfe6519b5c77b21e69e4f687dec2c5a8630b683f253dfa201cedbf4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}
          cache-bin: "false"
      - name: Segmentation model (background effects; not in git)
        run: crates/teamcraft-media/models/fetch.sh
      - name: Build packages
        working-directory: apps/desktop
        run: cargo tauri build --config tauri.models.conf.json --bundles deb,rpm,appimage
        env:
          # AppImage tooling runs without FUSE on hosted runners.
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      # The UI bundle is wasm32, the same for both architectures: keep one.
      - name: Keep the web UI bundle for the Flatpak job
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: crates/teamcraft-ui/dist
          if-no-files-found: error

  flatpak:
    name: Flatpak ${{ matrix.arch }} (build only)
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7.0.1
      # The app is built from source inside the GNOME SDK; only the web UI (wasm32, which the
      # SDK's Rust lacks) comes from the Linux job.
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: crates/teamcraft-ui/dist
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: teamcraft-desktop-${{ matrix.arch }}.flatpak
          manifest-path: apps/desktop/packaging/linux/org.teamcraft.desktop.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}

  macos:
    name: macOS (${{ matrix.target }}, dmg)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Meson and ninja (build WebRTC audio processing)
        run: brew install meson ninja
      - name: Trunk (builds the UI bundle)
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Segmentation model (background effects; not in git)
        run: crates/teamcraft-media/models/fetch.sh
      - name: Build dmg
        working-directory: apps/desktop
        run: cargo tauri build --config tauri.models.conf.json --target ${{ matrix.target }} --bundles dmg
        # Signing and notarization are left out on purpose (the dmg is unsigned). To enable them,
        # add these repository secrets and pass them as `env`, as described in the Tauri macOS guide:
        #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
        #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
