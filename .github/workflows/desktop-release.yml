# Desktop release build: builds the Linux, macOS and Windows packages and keeps them as workflow
# artifacts. It publishes nothing itself (no Flathub, no notarization upload). release.yml calls it for
# a tag `v*` and attaches the packages to the draft GitHub release; run it by hand (Actions > Desktop
# release > Run workflow) to get the packages of a branch without a release.
#
# Update artifacts (the AppImages, the Windows installers and the macOS .app.tar.gz) are signed for
# the in-app updater when the secret TAURI_SIGNING_PRIVATE_KEY exists (docs/updates.md §3.3); the
# `.sig` files travel with the packages and release.yml turns them into latest.json.
#
# With `warm-cache`, desktop-cache.yml runs the same compile on `main` without packaging and saves the
# Rust build cache. A tag run can only restore caches of its own ref or
# the default branch, so the release jobs restore what `main` saved and never save themselves (each
# tag's cache would be unreadable for the next release and only evict the useful ones).
name: Desktop release

on:
  workflow_dispatch:
    inputs:
      warm-cache:
        description: Compile only and save the Rust build cache (no packages)
        type: boolean
        default: false
  workflow_call:
    inputs:
      warm-cache:
        description: Compile only and save the Rust build cache (no packages)
        type: boolean
        default: false

permissions:
  contents: read
  # The Linux jobs run in the CI image on GHCR.
  packages: read
  # The macOS and Windows jobs wait for the UI bundle (.github/actions/await-ui-bundle).
  actions: read

env:
  CARGO_TERM_COLOR: always
  # Release builds include WebRTC echo cancellation, built from source (crates/teamcraft-media/README.md).
  RUSTFLAGS: "--cfg teamcraft_audio_processing --cfg teamcraft_audio_processing_bundled"
  # Shipped binaries carry no symbol table and no debug info (106 MB -> 78 MB for the Linux
  # executable). Release builds have line tables, which each job splits off into debug files that are
  # kept privately by build ID (scripts/debug-files.sh, docs/release.md "Debug symbols"): never as a
  # workflow artifact, this repository's artifacts are public. The Linux, macOS and Windows jobs
  # build unstripped and strip themselves once the debug file is split off (see there).
  CARGO_PROFILE_RELEASE_STRIP: symbols
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
  # Builds follow this repository's releases for updates (a fork's builds follow the fork's).
  TEAMCRAFT_RELEASE_REPOSITORY: ${{ github.repository }}
  # Prebuilt Tauri CLI for the macOS and Windows jobs, the same version as in the CI image
  # (containers/ci.Containerfile) that the Linux jobs use. Not TAURI_*: the CLI reads its own
  # TAURI_CLI_* variables.
  TEAMCRAFT_TAURI_CLI_VERSION: "2.12.4"

jobs:
  ui:
    name: Web UI bundle
    # The wasm UI (size-optimized with fat LTO: a long serial build) is the same for every package,
    # so it is built once here; the desktop jobs embed it and release.yml ships it as
    # the web client.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:24fe71e069885c93b38cc6997f8005fb06b94e501dde7a07ce39c04c46d03e40
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-ui
          cache-bin: "false"
          save-if: ${{ inputs.warm-cache }}
      - name: Build the UI bundle
        working-directory: crates/teamcraft-ui
        run: trunk build --release
      # The packages embed this bundle and the web client is made from it: no demo data.
      - name: The UI bundle has no demo data
        run: scripts/check-no-demo-data.py crates/teamcraft-ui/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: crates/teamcraft-ui/dist
          if-no-files-found: error
      # The jobs that compile meanwhile stop waiting (.github/actions/await-ui-bundle).
      - if: ${{ failure() }}
        run: echo failed > ui-failed.txt
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-failed
          path: ui-failed.txt

  linux:
    name: Linux ${{ matrix.arch }} (deb, rpm, AppImage)
    # x86_64 and aarch64, each on a native runner (no emulation), in the multi-arch Debian Trixie
    # image that CI and local container builds use.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # Not warmed (no Rust cache): compiling from scratch takes less than the ui job, so the cache
    # would only use up the repository's 10 GB budget (docs/release.md, "Critical path").
    if: ${{ !inputs.warm-cache }}
    runs-on: ${{ matrix.runner }}
    env:
      # Linked with debug info and symbols; "Split off the debug file" strips the executable before
      # it is packaged.
      CARGO_PROFILE_RELEASE_STRIP: none
    # Rust, the system packages and the Tauri CLI are in the CI image (containers/ci.Containerfile).
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:24fe71e069885c93b38cc6997f8005fb06b94e501dde7a07ce39c04c46d03e40
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag's version for a release run (v1.0.0-rc.2 -> 1.0.0-rc.2), else the tree's: the app
      # reports it and the update signatures bind it (docs/updates.md §3.1). The debug files' index
      # names a build without a tag by its commit too (1.0.0+abc1234), so it doesn't replace the
      # release's.
      - name: Release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; debug_version="$version"
          else version="$(scripts/check-versions.sh)"; debug_version="$version+${GITHUB_SHA::7}"; fi
          echo "TEAMCRAFT_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "TEAMCRAFT_DEBUG_FILES_VERSION=$debug_version" >> "$GITHUB_ENV"
      # Tauri names the deb and rpm after the tree's version, so a candidate would be 1.0.0 like the
      # release. The rpm gets Release 0.rc.N (via --config below); the deb is repacked as 1.0.0~rc.N.
      # Both sort before the final version, so dnf/apt upgrade candidate to candidate to release.
      - name: Package versions (rpm release)
        shell: bash
        run: |
          echo "TEAMCRAFT_RPM_RELEASE=$(scripts/linux-package-version.sh rpm-release "$TEAMCRAFT_RELEASE_VERSION")" >> "$GITHUB_ENV"
      - name: Segmentation model (background effects; not in git)
        run: crates/teamcraft-media/models/fetch.sh
      # Compile everything while the ui job still builds the wasm bundle (it takes as long as this
      # build): a placeholder stands in for the bundle, so only the desktop crate itself is compiled
      # again once the real one has arrived. Same command, config and flags as the build below, or
      # the dependencies would be compiled twice (docs/release.md, "Critical path").
      - name: Compile the dependencies (placeholder UI)
        shell: bash
        working-directory: apps/desktop
        run: |
          mkdir -p ../../crates/teamcraft-ui/dist
          echo '<!doctype html><title>teamcraft-ui-build-pending</title>' > ../../crates/teamcraft-ui/dist/index.html
          cargo tauri build --config tauri.models.conf.json --config tauri.prebuilt-ui.conf.json --no-bundle
      # The UI bundle from the ui job (this job doesn't `needs: ui`, see above); tauri.prebuilt-ui.conf.json
      # drops the trunk build from beforeBuildCommand.
      - uses: ./.github/actions/await-ui-bundle
        with:
          github-token: ${{ github.token }}
      - name: Build the executable
        working-directory: apps/desktop
        run: >
          cargo tauri build --config tauri.models.conf.json --config tauri.prebuilt-ui.conf.json
          --no-bundle
      # The compile against the placeholder must not be what ships.
      - name: The build embeds the real UI
        shell: bash
        run: scripts/check-embedded-ui.sh
      # The packages get the stripped executable (as with `strip = "symbols"`), linked to its debug
      # file by build ID and .gnu_debuglink.
      - name: Split off the debug file
        if: ${{ !inputs.warm-cache }}
        run: scripts/debug-files.sh split target/release/teamcraft-desktop target/debug-files
      - name: Build packages
        if: ${{ !inputs.warm-cache }}
        working-directory: apps/desktop
        run: >
          cargo tauri bundle --config tauri.models.conf.json --config tauri.prebuilt-ui.conf.json
          --config "{\"bundle\":{\"linux\":{\"rpm\":{\"release\":\"$TEAMCRAFT_RPM_RELEASE\"}}}}"
          --bundles deb,rpm,appimage
        env:
          # AppImage tooling runs without FUSE on hosted runners.
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Package versions (deb)
        if: ${{ !inputs.warm-cache }}
        run: |
          for deb in target/release/bundle/deb/*.deb; do
            scripts/linux-package-version.sh repack-deb "$TEAMCRAFT_RELEASE_VERSION" "$deb"
          done
          ls target/release/bundle/deb target/release/bundle/rpm
      # deb and rpm are updated by the package manager from the signed repositories instead.
      - name: Sign the AppImage for the updater (optional)
        if: ${{ !inputs.warm-cache }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: apps/desktop/packaging/sign-update.sh "$TEAMCRAFT_RELEASE_VERSION" target/release/bundle/appimage/*.AppImage
      - name: Keep the debug file privately (optional)
        if: ${{ !inputs.warm-cache }}
        env:
          SENTRY_URL: ${{ secrets.CRASH_REPORTS_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.CRASH_REPORTS_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.CRASH_REPORTS_ORG }}
          SENTRY_PROJECT: ${{ secrets.CRASH_REPORTS_PROJECT }}
          DEBUG_FILES_S3_ENDPOINT: ${{ secrets.DEBUG_FILES_S3_ENDPOINT }}
          DEBUG_FILES_S3_REGION: ${{ secrets.DEBUG_FILES_S3_REGION }}
          DEBUG_FILES_S3_BUCKET: ${{ secrets.DEBUG_FILES_S3_BUCKET }}
          DEBUG_FILES_S3_ACCESS_KEY_ID: ${{ secrets.DEBUG_FILES_S3_ACCESS_KEY_ID }}
          DEBUG_FILES_S3_SECRET_ACCESS_KEY: ${{ secrets.DEBUG_FILES_S3_SECRET_ACCESS_KEY }}
        run: >
          scripts/debug-files.sh store "desktop/$TEAMCRAFT_DEBUG_FILES_VERSION/${{ matrix.arch }}-unknown-linux-gnu"
          target/debug-files/teamcraft-desktop.debug
      - if: ${{ !inputs.warm-cache }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.title }} (dmg)
    # One dmg and one update archive per architecture (no universal build: it carried the native code
    # twice in every download and update). Both run on the current Apple silicon image; Rust
    # cross-compiles the Intel build.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            title: Apple silicon
            # Asset name suffix, as the Tauri bundler names macOS packages: TeamCraft_<version>_<arch>.dmg.
            arch: aarch64
          # WebRTC audio processing (echo cancellation) is built with Meson; for the cross-compiled
          # Intel build, scripts/meson-cross gives Meson an x86_64 cross file (#197).
          - target: x86_64-apple-darwin
            title: Intel
            arch: x64
    # Xcode 27 (macOS 27 SDK), the same image as the iOS jobs; the deployment target below keeps
    # macOS 14+ running.
    runs-on: xcode-27
    env:
      # Current macOS and the two releases before it (26 Tahoe, 15 Sequoia, 14 Sonoma).
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # rustc skips dsymutil when it strips: it writes the dSYM unstripped, and "Split off the dSYM"
      # strips the executable.
      CARGO_PROFILE_RELEASE_STRIP: none
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ inputs.warm-cache }}
      # The tag's version for a release run (v1.0.0-rc.2 -> 1.0.0-rc.2), else the tree's: the app
      # reports it and the update signatures bind it (docs/updates.md §3.1). The debug files' index
      # names a build without a tag by its commit too (1.0.0+abc1234), so it doesn't replace the
      # release's.
      - name: Release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; debug_version="$version"
          else version="$(scripts/check-versions.sh)"; debug_version="$version+${GITHUB_SHA::7}"; fi
          echo "TEAMCRAFT_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "TEAMCRAFT_DEBUG_FILES_VERSION=$debug_version" >> "$GITHUB_ENV"
      # The wrapper in scripts/meson-cross goes in front of Homebrew's meson: it adds the x86_64 cross
      # file when the Intel build's audio processing runs `meson setup` (and nothing for Apple silicon).
      - name: Meson and ninja (build WebRTC audio processing)
        run: |
          brew install meson ninja pkg-config
          echo "$GITHUB_WORKSPACE/scripts/meson-cross" >> "$GITHUB_PATH"
      # The official universal GStreamer: development files to link against, and the runtime that is
      # bundled into the app for VideoToolbox hardware encoding (thinned to the build's architecture).
      # (The Homebrew casks are disabled, so the packages come from gstreamer.freedesktop.org, pinned by hash.)
      - name: GStreamer framework
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/fetch-gstreamer.sh macos "$HOME/gstreamer-pkgs"
          source scripts/gstreamer-pins.env
          cd "$HOME/gstreamer-pkgs"
          sudo installer -pkg "gstreamer-1.0-$GSTREAMER_VERSION-universal.pkg" -target /
          sudo installer -pkg "gstreamer-1.0-devel-$GSTREAMER_VERSION-universal.pkg" -target /
      # Prebuilt release binary, pinned by hash (building it from source took 5-10 minutes per job).
      - name: Tauri CLI
        run: |
          set -euo pipefail
          file="cargo-tauri-aarch64-apple-darwin.zip"
          curl --fail --silent --show-error --location --http1.1 --retry 5 --retry-all-errors --continue-at - --output "$RUNNER_TEMP/$file" \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$TEAMCRAFT_TAURI_CLI_VERSION/$file"
          echo "f71a34ada728ca2d1a51c28d6d21639e1e080898ec69ec8d49c5da3b7e8bc1be  $RUNNER_TEMP/$file" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$file" cargo-tauri -d "$RUNNER_TEMP/tauri-cli"
          echo "$RUNNER_TEMP/tauri-cli" >> "$GITHUB_PATH"
      - name: Segmentation model (background effects; not in git)
        run: crates/teamcraft-media/models/fetch.sh
      # Compile everything while the ui job still builds the wasm bundle (it takes as long as this
      # build): a placeholder stands in for the bundle, so only the desktop crate itself is compiled
      # again once the real one has arrived. Same command, config, target and flags as the build
      # below, or the dependencies would be compiled twice.
      - name: Compile the dependencies (placeholder UI)
        if: ${{ !inputs.warm-cache || steps.rust-cache.outputs.cache-hit != 'true' }}
        shell: bash
        working-directory: apps/desktop
        run: |
          mkdir -p ../../crates/teamcraft-ui/dist
          echo '<!doctype html><title>teamcraft-ui-build-pending</title>' > ../../crates/teamcraft-ui/dist/index.html
          cargo tauri build --config tauri.models.conf.json --config tauri.prebuilt-ui.conf.json --target ${{ matrix.target }} --no-bundle
        env:
          PKG_CONFIG_PATH: /Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
      # The UI bundle from the ui job (this job doesn't `needs: ui`, see above); tauri.prebuilt-ui.conf.json
      # drops the trunk build from beforeBuildCommand.
      - uses: ./.github/actions/await-ui-bundle
        with:
          github-token: ${{ github.token }}
      # Skipped by a warm-up run whose cache key already exists (see the Linux job).
      - name: Build the executable
        if: ${{ !inputs.warm-cache || steps.rust-cache.outputs.cache-hit != 'true' }}
        working-directory: apps/desktop
        run: >
          cargo tauri build --config tauri.models.conf.json --config tauri.prebuilt-ui.conf.json
          --target ${{ matrix.target }} --no-bundle
        env:
          PKG_CONFIG_PATH: /Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
      # The compile against the placeholder must not be what ships.
      - name: The build embeds the real UI
        shell: bash
        if: ${{ !inputs.warm-cache }}
        run: scripts/check-embedded-ui.sh
      # Echo cancellation is in the executable, built for its architecture (#197).
      - name: The build has echo cancellation
        if: ${{ !inputs.warm-cache }}
        run: >
          scripts/meson-cross/check-audio-processing.sh
          target/${{ matrix.target }}/release/teamcraft-desktop ${{ matrix.target }}
      # The dSYM and the executable carry the same UUID, which stripping, install_name_tool and
      # codesign leave alone. `strip -S -x` drops the debug map and the local symbols, as Cargo's
      # `strip = "symbols"` did.
      - name: Split off the dSYM
        if: ${{ !inputs.warm-cache }}
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/teamcraft-desktop
          dwarfdump --uuid "$bin" "$bin.dSYM"
          [ "$(dwarfdump --uuid "$bin" | cut -d ' ' -f 2)" = "$(dwarfdump --uuid "$bin.dSYM" | cut -d ' ' -f 2)" ]
          ls -l "$bin"
          strip -S -x "$bin"
          ls -l "$bin"
          du -sh "$bin.dSYM"
      - name: Bundle GStreamer into the app
        if: ${{ !inputs.warm-cache }}
        run: apps/desktop/packaging/macos/bundle-gstreamer.sh patch target/${{ matrix.target }}/release/teamcraft-desktop
      # The app only: the dmg is made from the signed app below, so nothing touches the app after
      # it is signed.
      - name: Build the app
        if: ${{ !inputs.warm-cache }}
        working-directory: apps/desktop
        run: >
          cargo tauri bundle --config tauri.models.conf.json --config tauri.gstreamer.conf.json
          --target ${{ matrix.target }} --bundles app
      # The bundler copies the framework without its symlinks; a framework with duplicated version
      # directories can't be sealed. ditto copies it as built.
      - name: Put the slim GStreamer framework into the app
        if: ${{ !inputs.warm-cache }}
        run: |
          app="$(find target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)"
          rm -rf "$app/Contents/Frameworks/GStreamer.framework"
          ditto target/gstreamer-framework/GStreamer.framework "$app/Contents/Frameworks/GStreamer.framework"
          echo "APP=$app" >> "$GITHUB_ENV"
      # Developer ID signing and notarization, only when the repository has the certificate; otherwise
      # the app is signed ad hoc (docs/release.md, "Opening the unsigned macOS app"), and then every
      # update is a stranger to the keychain item of the build before it (#1223). The identity is
      # read from the certificate; APPLE_SIGNING_IDENTITY only picks one where the .p12 holds several.
      - name: Signing identity (optional)
        if: ${{ !inputs.warm-cache }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning title=macOS app signed ad hoc::No Developer ID certificate (secret APPLE_CERTIFICATE): macOS asks for the login keychain password after every update of this build (#1223)."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$APPLE_SIGNING_IDENTITY"
          if [ -z "$identity" ]; then
            identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)"
          fi
          # Any other kind (Apple Distribution, Apple Development) signs an app Gatekeeper rejects
          # and the notary service refuses.
          case "$identity" in
            "Developer ID Application: "*) ;;
            *) echo "error: APPLE_CERTIFICATE holds no Developer ID Application certificate" >&2; exit 1 ;;
          esac
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MACOS_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Sign the app (inside out) and verify the signature
        if: ${{ !inputs.warm-cache }}
        run: apps/desktop/packaging/macos/sign-app.sh "$APP"
      - name: Notarize the app (optional)
        if: ${{ !inputs.warm-cache && env.MACOS_SIGNING_IDENTITY != '' }}
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          apps/desktop/packaging/macos/notarize.sh "$APP"
          MACOS_REQUIRE_NOTARIZED=1 apps/desktop/packaging/macos/verify-app.sh "$APP"
      - name: Build the dmg and verify the app inside it
        if: ${{ !inputs.warm-cache }}
        run: |
          version="$(scripts/check-versions.sh)"
          mkdir -p target/dmg
          apps/desktop/packaging/macos/make-dmg.sh "$APP" "target/dmg/TeamCraft_${version}_${{ matrix.arch }}.dmg"
      # The updater replaces the whole app with this archive of the signed (and, with the secrets,
      # notarized and stapled) app. No AppleDouble files: they would break the seal.
      - name: Update archive of the app, signed for the updater (optional)
        if: ${{ !inputs.warm-cache }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="$(scripts/check-versions.sh)"
          archive="target/dmg/TeamCraft_${version}_${{ matrix.arch }}.app.tar.gz"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -C "$(dirname "$APP")" -czf "$archive" "$(basename "$APP")"
          apps/desktop/packaging/sign-update.sh "$TEAMCRAFT_RELEASE_VERSION" "$archive"
      - name: Notarize the dmg (optional)
        if: ${{ !inputs.warm-cache && env.MACOS_SIGNING_IDENTITY != '' }}
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          dmg="$(ls target/dmg/*.dmg)"
          apps/desktop/packaging/macos/notarize.sh "$dmg"
          spctl --assess -vvv --type open --context context:primary-signature "$dmg"
      - name: Keep the dSYM privately (optional)
        if: ${{ !inputs.warm-cache }}
        env:
          SENTRY_URL: ${{ secrets.CRASH_REPORTS_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.CRASH_REPORTS_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.CRASH_REPORTS_ORG }}
          SENTRY_PROJECT: ${{ secrets.CRASH_REPORTS_PROJECT }}
          DEBUG_FILES_S3_ENDPOINT: ${{ secrets.DEBUG_FILES_S3_ENDPOINT }}
          DEBUG_FILES_S3_REGION: ${{ secrets.DEBUG_FILES_S3_REGION }}
          DEBUG_FILES_S3_BUCKET: ${{ secrets.DEBUG_FILES_S3_BUCKET }}
          DEBUG_FILES_S3_ACCESS_KEY_ID: ${{ secrets.DEBUG_FILES_S3_ACCESS_KEY_ID }}
          DEBUG_FILES_S3_SECRET_ACCESS_KEY: ${{ secrets.DEBUG_FILES_S3_SECRET_ACCESS_KEY }}
        run: >
          scripts/debug-files.sh store "desktop/$TEAMCRAFT_DEBUG_FILES_VERSION/${{ matrix.target }}"
          target/${{ matrix.target }}/release/teamcraft-desktop.dSYM
      - if: ${{ !inputs.warm-cache }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.target }}
          path: |
            target/dmg/*.dmg
            target/dmg/*.app.tar.gz
            target/dmg/*.app.tar.gz.sig
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.target }}, msi, nsis)
    # Each architecture on a native runner (windows-11-arm is free for public repositories), so the
    # ARM64 build compiles its C code (OpenSSL, Opus, OpenH264) natively instead of cross.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            # Release asset hash of the prebuilt Tauri CLI for this host.
            tauri-cli-sha256: 3e8687fb184bd7f10ebd8642f7715f79f4a605c0694c142a21507e8a24dc0f8b
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            tauri-cli-sha256: 92aa6a90be3126ed7b6ede964ca12124535359b47d8363dc29189b4f776303e7
    runs-on: ${{ matrix.runner }}
    # Overrides the workflow-wide flags: WebRTC echo cancellation is not part of the Windows build
    # yet (the experimental CI job tries it), so calls run without it. The executable never holds
    # the symbols on Windows, they go to the PDB; `strip = "symbols"` would only drop the PDB.
    env:
      RUSTFLAGS: ""
      CARGO_PROFILE_RELEASE_STRIP: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ inputs.warm-cache }}
      # The tag's version for a release run (v1.0.0-rc.2 -> 1.0.0-rc.2), else the tree's: the app
      # reports it and the update signatures bind it (docs/updates.md §3.1). The debug files' index
      # names a build without a tag by its commit too (1.0.0+abc1234), so it doesn't replace the
      # release's.
      - name: Release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; debug_version="$version"
          else version="$(scripts/check-versions.sh)"; debug_version="$version+${GITHUB_SHA::7}"; fi
          echo "TEAMCRAFT_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "TEAMCRAFT_DEBUG_FILES_VERSION=$debug_version" >> "$GITHUB_ENV"
      # OpenSSL for SQLCipher is built from source and needs NASM on x64 (ARM64 has no NASM
      # assembly); Perl comes with both images.
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      # Prebuilt release binary for the runner's architecture, pinned by hash (building it from
      # source took 10 minutes).
      - name: Tauri CLI
        shell: pwsh
        env:
          TAURI_CLI_SHA256: ${{ matrix.tauri-cli-sha256 }}
        run: |
          $file = "cargo-tauri-${{ matrix.target }}.zip"
          $zip = "$env:RUNNER_TEMP\$file"
          Invoke-WebRequest "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$env:TEAMCRAFT_TAURI_CLI_VERSION/$file" -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne $env:TAURI_CLI_SHA256) { throw "Checksum mismatch: $file" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\tauri-cli"
          "$env:RUNNER_TEMP\tauri-cli" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Segmentation model (background effects; not in git)
        shell: bash
        run: crates/teamcraft-media/models/fetch.sh
      # Compile everything while the ui job still builds the wasm bundle (it takes as long as this
      # build): a placeholder stands in for the bundle, so only the desktop crate itself is compiled
      # again once the real one has arrived. Same command, config, target and flags as the build
      # below, or the dependencies would be compiled twice.
      # PowerShell, like the build below: under bash the OpenSSL build finds Git's Perl, which lacks
      # modules its Configure needs.
      - name: Compile the dependencies (placeholder UI)
        if: ${{ !inputs.warm-cache || steps.rust-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        working-directory: apps/desktop
        run: |
          New-Item -ItemType Directory -Force ../../crates/teamcraft-ui/dist | Out-Null
          Set-Content -NoNewline -Path ../../crates/teamcraft-ui/dist/index.html -Value '<!doctype html><title>teamcraft-ui-build-pending</title>'
          cargo tauri build --config tauri.models.conf.json --config tauri.prebuilt-ui.conf.json --target ${{ matrix.target }} --no-bundle
      # The UI bundle from the ui job (this job doesn't `needs: ui`, see above); tauri.prebuilt-ui.conf.json
      # drops the trunk build from beforeBuildCommand.
      - uses: ./.github/actions/await-ui-bundle
        with:
          github-token: ${{ github.token }}
      # Skipped by a warm-up run whose cache key already exists (see the Linux job).
      - name: Build installers
        if: ${{ !inputs.warm-cache || steps.rust-cache.outputs.cache-hit != 'true' }}
        working-directory: apps/desktop
        run: >
          cargo tauri build --config tauri.models.conf.json --config tauri.prebuilt-ui.conf.json
          --target ${{ matrix.target }} ${{ inputs.warm-cache && '--no-bundle' || '--bundles nsis,msi' }}
        # Signing is left out on purpose (the installers are unsigned). To enable it, see
        # apps/desktop/packaging/windows/README.md (Authenticode certificate or Azure Trusted Signing).
      # The compile against the placeholder must not be what ships.
      - name: The build embeds the real UI
        shell: bash
        if: ${{ !inputs.warm-cache }}
        run: scripts/check-embedded-ui.sh
      # The updater runs the new installer of the same kind (NSIS or MSI) the app came from.
      - name: Sign the installers for the updater (optional)
        if: ${{ !inputs.warm-cache }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          apps/desktop/packaging/sign-update.sh "$TEAMCRAFT_RELEASE_VERSION" \
            target/${{ matrix.target }}/release/bundle/nsis/*.exe target/${{ matrix.target }}/release/bundle/msi/*.msi
      - name: Keep the PDB privately (optional)
        if: ${{ !inputs.warm-cache }}
        shell: bash
        env:
          SENTRY_URL: ${{ secrets.CRASH_REPORTS_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.CRASH_REPORTS_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.CRASH_REPORTS_ORG }}
          SENTRY_PROJECT: ${{ secrets.CRASH_REPORTS_PROJECT }}
          DEBUG_FILES_S3_ENDPOINT: ${{ secrets.DEBUG_FILES_S3_ENDPOINT }}
          DEBUG_FILES_S3_REGION: ${{ secrets.DEBUG_FILES_S3_REGION }}
          DEBUG_FILES_S3_BUCKET: ${{ secrets.DEBUG_FILES_S3_BUCKET }}
          DEBUG_FILES_S3_ACCESS_KEY_ID: ${{ secrets.DEBUG_FILES_S3_ACCESS_KEY_ID }}
          DEBUG_FILES_S3_SECRET_ACCESS_KEY: ${{ secrets.DEBUG_FILES_S3_SECRET_ACCESS_KEY }}
        run: >
          scripts/debug-files.sh store "desktop/$TEAMCRAFT_DEBUG_FILES_VERSION/${{ matrix.target }}"
          target/${{ matrix.target }}/release/teamcraft_desktop.pdb
      - if: ${{ !inputs.warm-cache }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
          if-no-files-found: error
