# Desktop release build: builds the Linux, macOS and Windows packages and keeps them as workflow
# artifacts. It publishes nothing itself (no Flathub, no notarization upload). release.yml calls it for
# a tag `v*` and attaches the packages to the draft GitHub release; run it by hand (Actions > Desktop
# release > Run workflow) to get the packages of a branch without a release.
#
# Update artifacts (the AppImages, the Windows installers and the macOS .app.tar.gz) are signed for
# the in-app updater when the secret TAURI_SIGNING_PRIVATE_KEY exists (docs/updates.md §3.3); the
# `.sig` files travel with the packages and release.yml turns them into latest.json.
name: Desktop release

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  # The Linux jobs run in the CI image on GHCR.
  packages: read

env:
  CARGO_TERM_COLOR: always
  # Release builds include WebRTC echo cancellation, built from source (crates/teamcraft-media/README.md).
  RUSTFLAGS: "--cfg teamcraft_audio_processing --cfg teamcraft_audio_processing_bundled"
  # Shipped binaries carry no symbol table (106 MB -> 78 MB for the Linux executable); release builds
  # have no debug info to keep separately.
  CARGO_PROFILE_RELEASE_STRIP: symbols
  # Builds follow this repository's releases for updates (a fork's builds follow the fork's).
  TEAMCRAFT_RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (deb, rpm, AppImage)
    # x86_64 and aarch64, each on a native runner (no emulation), in the multi-arch Debian Trixie
    # image that CI and local container builds use.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Rust, the system packages, trunk and the Tauri CLI are in the CI image (containers/ci.Containerfile).
    container:
      image: ghcr.io/zeitgleich/teamcraft-ci@sha256:24fe71e069885c93b38cc6997f8005fb06b94e501dde7a07ce39c04c46d03e40
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux-${{ matrix.arch }}
          cache-bin: "false"
      # The tag's version for a release run (v1.0.0-rc.2 -> 1.0.0-rc.2), else the tree's: the app
      # reports it and the update signatures bind it (docs/updates.md §3.1).
      - name: Release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="$(scripts/check-versions.sh)"; fi
          echo "TEAMCRAFT_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Segmentation model (background effects; not in git)
        run: crates/teamcraft-media/models/fetch.sh
      - name: Build packages
        working-directory: apps/desktop
        run: cargo tauri build --config tauri.models.conf.json --bundles deb,rpm,appimage
        env:
          # AppImage tooling runs without FUSE on hosted runners.
          APPIMAGE_EXTRACT_AND_RUN: "1"
      # deb and rpm are updated by the package manager from the signed repositories instead.
      - name: Sign the AppImage for the updater (optional)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: apps/desktop/packaging/sign-update.sh "$TEAMCRAFT_RELEASE_VERSION" target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
      # The UI bundle is wasm32, the same for both architectures: keep one.
      - name: Keep the web UI bundle for the Flatpak job
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: crates/teamcraft-ui/dist
          if-no-files-found: error

  flatpak:
    name: Flatpak ${{ matrix.arch }} (build only)
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The app is built from source inside the GNOME SDK; only the web UI (wasm32, which the
      # SDK's Rust lacks) comes from the Linux job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: crates/teamcraft-ui/dist
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: teamcraft-desktop-${{ matrix.arch }}.flatpak
          manifest-path: apps/desktop/packaging/linux/de.zeitgleich.teamcraft.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}

  macos:
    name: macOS (universal dmg)
    # One dmg with both slices (arm64 + x86_64), built on an Apple silicon runner; Rust cross-compiles
    # the x86_64 slice and `cargo tauri build --target universal-apple-darwin` joins them with lipo.
    # Each slice is compiled for its own architecture, so the OpenH264 download picks the matching
    # Cisco library at runtime (openh264_library.rs).
    runs-on: macos-26
    env:
      # Current macOS and the two releases before it (26 Tahoe, 15 Sequoia, 14 Sonoma).
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: universal-apple-darwin
      # The tag's version for a release run (v1.0.0-rc.2 -> 1.0.0-rc.2), else the tree's: the app
      # reports it and the update signatures bind it (docs/updates.md §3.1).
      - name: Release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="$(scripts/check-versions.sh)"; fi
          echo "TEAMCRAFT_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Meson and ninja (build WebRTC audio processing)
        run: brew install meson ninja pkg-config
      # The official universal GStreamer (both slices): development files to link against, and the
      # runtime that is bundled into the app for VideoToolbox hardware encoding.
      # (The Homebrew casks are disabled, so the packages come from gstreamer.freedesktop.org, pinned by hash.)
      - name: GStreamer framework
        env:
          GSTREAMER_VERSION: "1.28.8"
        run: |
          set -euo pipefail
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$GSTREAMER_VERSION"
          for package in gstreamer-1.0 gstreamer-1.0-devel; do
            file="$package-$GSTREAMER_VERSION-universal.pkg"
            curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$file" "$base/$file"
          done
          cd "$RUNNER_TEMP"
          echo "d371ab04a7632713626836c2fc234e863cc98484c74c473eba99b0fbd9b3a3fe  gstreamer-1.0-$GSTREAMER_VERSION-universal.pkg" | shasum -a 256 -c -
          echo "e6d380bc17be7eccf13e0154567d4718fc9321da822408c7ca0cd808b3d4a3f7  gstreamer-1.0-devel-$GSTREAMER_VERSION-universal.pkg" | shasum -a 256 -c -
          sudo installer -pkg "gstreamer-1.0-$GSTREAMER_VERSION-universal.pkg" -target /
          sudo installer -pkg "gstreamer-1.0-devel-$GSTREAMER_VERSION-universal.pkg" -target /
      - name: Trunk (builds the UI bundle)
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: trunk
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Segmentation model (background effects; not in git)
        run: crates/teamcraft-media/models/fetch.sh
      # WebRTC audio processing is built with Meson for the host architecture only, so only the arm64
      # slice gets echo cancellation; the x86_64 slice is built without it (a per-target flag, which
      # the workflow-wide RUSTFLAGS would override, hence the unset).
      - name: Build the universal executable
        working-directory: apps/desktop
        run: |
          unset RUSTFLAGS
          export CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS="--cfg teamcraft_audio_processing --cfg teamcraft_audio_processing_bundled"
          cargo tauri build --config tauri.models.conf.json --target universal-apple-darwin --no-bundle
        env:
          PKG_CONFIG_PATH: /Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
      - name: Bundle GStreamer into the app
        run: apps/desktop/packaging/macos/bundle-gstreamer.sh patch target/universal-apple-darwin/release/teamcraft-desktop
      # The app only: the dmg is made from the signed app below, so nothing touches the app after
      # it is signed.
      - name: Build the app
        working-directory: apps/desktop
        run: >
          cargo tauri bundle --config tauri.models.conf.json --config tauri.gstreamer.conf.json
          --target universal-apple-darwin --bundles app
      # The bundler copies the framework without its symlinks; a framework with duplicated version
      # directories can't be sealed. ditto copies it as built.
      - name: Put the slim GStreamer framework into the app
        run: |
          app="$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)"
          rm -rf "$app/Contents/Frameworks/GStreamer.framework"
          ditto target/gstreamer-framework/GStreamer.framework "$app/Contents/Frameworks/GStreamer.framework"
          echo "APP=$app" >> "$GITHUB_ENV"
      # Developer ID signing and notarization, only when the repository has the secrets; otherwise
      # the app is signed ad hoc (docs/release.md, "Opening the unsigned macOS app").
      - name: Signing identity (optional)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No Developer ID certificate: signing ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "MACOS_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Sign the app (inside out) and verify the signature
        run: apps/desktop/packaging/macos/sign-app.sh "$APP"
      - name: Notarize the app (optional)
        if: env.MACOS_SIGNING_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          MACOS_REQUIRE_NOTARIZED=1 apps/desktop/packaging/macos/verify-app.sh "$APP"
      - name: Build the dmg and verify the app inside it
        run: |
          version="$(scripts/check-versions.sh)"
          mkdir -p target/dmg
          apps/desktop/packaging/macos/make-dmg.sh "$APP" "target/dmg/TeamCraft_${version}_universal.dmg"
      # The updater replaces the whole app with this archive of the signed (and, with the secrets,
      # notarized and stapled) app. No AppleDouble files: they would break the seal.
      - name: Update archive of the app, signed for the updater (optional)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="$(scripts/check-versions.sh)"
          archive="target/dmg/TeamCraft_${version}_universal.app.tar.gz"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -C "$(dirname "$APP")" -czf "$archive" "$(basename "$APP")"
          apps/desktop/packaging/sign-update.sh "$TEAMCRAFT_RELEASE_VERSION" "$archive"
      - name: Notarize the dmg (optional)
        if: env.MACOS_SIGNING_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg="$(ls target/dmg/*.dmg)"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          spctl --assess -vvv --type open --context context:primary-signature "$dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-universal
          path: |
            target/dmg/*.dmg
            target/dmg/*.app.tar.gz
            target/dmg/*.app.tar.gz.sig
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.target }}, msi, nsis)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
          # Cross-built on the x64 runner: hosted arm64 runners are not free for private repositories.
          # Required, like x64 (the build fails the workflow); the OpenSSL, Opus and OpenH264 C code
          # builds for ARM64 with the MSVC cross tools that windows-latest ships.
          - target: aarch64-pc-windows-msvc
    # Overrides the workflow-wide flags: WebRTC echo cancellation is not part of the Windows build
    # yet (the experimental CI job tries it), so calls run without it.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # The tag's version for a release run (v1.0.0-rc.2 -> 1.0.0-rc.2), else the tree's: the app
      # reports it and the update signatures bind it (docs/updates.md §3.1).
      - name: Release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="$(scripts/check-versions.sh)"; fi
          echo "TEAMCRAFT_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      # OpenSSL for SQLCipher is built from source and needs NASM; Perl comes with the image.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      # Direct download: install-action's bash startup fails on the Windows image.
      - name: Trunk (builds the UI bundle)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-pc-windows-msvc.zip -OutFile "$env:RUNNER_TEMP\trunk.zip"
          Expand-Archive "$env:RUNNER_TEMP\trunk.zip" -DestinationPath "$env:RUNNER_TEMP\trunk"
          "$env:RUNNER_TEMP\trunk" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Segmentation model (background effects; not in git)
        shell: bash
        run: crates/teamcraft-media/models/fetch.sh
      - name: Build installers
        working-directory: apps/desktop
        run: cargo tauri build --config tauri.models.conf.json --target ${{ matrix.target }} --bundles nsis,msi
        # Signing is left out on purpose (the installers are unsigned). To enable it, see
        # apps/desktop/packaging/windows/README.md (Authenticode certificate or Azure Trusted Signing).
      # The updater runs the new installer of the same kind (NSIS or MSI) the app came from.
      - name: Sign the installers for the updater (optional)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          apps/desktop/packaging/sign-update.sh "$TEAMCRAFT_RELEASE_VERSION" \
            target/${{ matrix.target }}/release/bundle/nsis/*.exe target/${{ matrix.target }}/release/bundle/msi/*.msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
          if-no-files-found: error
