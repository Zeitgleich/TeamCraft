[package]
publish = false
name = "teamcraft-desktop"
description = "Tauri 2 shell for the TeamCraft desktop client (Linux, macOS and Windows)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Leptos 0.8.2x and Tauri 2 need a newer compiler than the workspace baseline.
rust-version.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: the tray icon with its menu and closing the window to the tray.
tauri = { version = "2", features = ["tray-icon"] }
# The client core runs on the Rust side of the shell: encrypted store, sync engine, MLS.
teamcraft-core = { path = "../../crates/teamcraft-core", features = ["ui"] }
teamcraft-client-api = { path = "../../crates/teamcraft-client-api" }
teamcraft-crypto = { path = "../../crates/teamcraft-crypto" }
# Call media: WebTransport to the SFU, microphone and speakers, Opus, DAVE.
teamcraft-media = { path = "../../crates/teamcraft-media", features = ["native", "call-view", "segmentation", "photo-backgrounds"] }
# Blocks on the effects pipeline's GPU setup on a blocking thread.
pollster = "1.0.1"
teamcraft-proto.workspace = true
# The few native OS calls that need unsafe code, behind a safe API (macOS and Windows resume hooks).
teamcraft-desktop-native = { path = "../../crates/teamcraft-desktop-native" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
anyhow = "1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "time", "sync", "macros"] }
# System browser for the OIDC login (RFC 8252): the webview never shows the identity provider.
tauri-plugin-opener = "2"
# Push-to-talk while another app has focus (Windows, macOS, X11).
tauri-plugin-global-shortcut = "2"
# System notifications for mentions and direct messages (the UI decides what to show).
tauri-plugin-notification = "2"
# Opens the window with the size, position and maximized state it had when the app was closed.
tauri-plugin-window-state = "2"
# Self-update of the Windows, macOS and AppImage builds from a signed manifest (docs/updates.md).
tauri-plugin-updater = "2"
# One running instance on every OS: a second process would fork the encrypted store (e2ee.md §9.4).
# Same Tauri plugin family; on Linux it adds zbus, already in the tree through the keyring.
tauri-plugin-single-instance = "2"
# Refresh token in the OS keyring (Secret Service on Linux, Keychain on macOS).
keyring = "4"
reqwest = { workspace = true, features = ["form"] }
# PKCE, state and token requests; HTTP goes through our own reqwest client.
oauth2 = { version = "5", default-features = false }
url = "2"
# Binary API bodies (brand images in the admin console) cross the webview bridge as base64.
base64.workspace = true

# Linux capture: the desktop portal (cameras, screens) and V4L2 cameras; hardware encoding through
# GStreamer's VA-API encoder.
[target.'cfg(target_os = "linux")'.dependencies]
teamcraft-media = { path = "../../crates/teamcraft-media", features = ["pipewire", "v4l2", "gstreamer"] }
# Push-to-talk on Wayland through the GlobalShortcuts portal (MIT; already in the tree for capture).
ashpd = { version = "0.13.13", features = ["global_shortcuts"] }
futures-util = "0.3"
# Idle time, screen lock and replaceable, withdrawable notifications over D-Bus (MIT; already in the
# tree through ashpd, same version and runtime).
zbus = { version = "5.13", default-features = false, features = ["tokio"] }
# The desktop's window button layout (gtk-decoration-layout) for the custom title bar (MIT; the
# same version Tauri uses on Linux, so already in the tree).
gtk = "0.18"
# The webview's cache model and page cache (webview_memory.rs; MIT, the version wry uses, so already in
# the tree).
webkit2gtk = "2.0.2"

# macOS cameras (AVFoundation) and hardware H.264 through GStreamer's VideoToolbox encoder
# (`vtenc_h264`); untested. The dmg bundles GStreamer.framework (packaging/macos/bundle-gstreamer.sh);
# building needs the framework's development files installed. If an encoder or GStreamer itself is
# missing at runtime, video falls back to OpenH264.
[target.'cfg(target_os = "macos")'.dependencies]
teamcraft-media = { path = "../../crates/teamcraft-media", features = ["avfoundation", "gstreamer", "screencapturekit"] }
# Opens the system's video effects panel (Portrait, background, Studio Light): a safe AVFoundation
# API (MIT/Apache-2.0), same author and Core Foundation layer as screencapturekit.
avcapture = "0.7.0"
# OS idle time for the attention report through a safe Core Graphics binding (Zlib/Apache-2.0/MIT;
# already in the tree through the media stack).
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEventSource", "CGEventTypes"] }
# Notifications that can be replaced and withdrawn (UNUserNotificationCenter), through the same
# safe objc2 bindings (Zlib/Apache-2.0/MIT; already in the tree through Tauri's macOS stack).
objc2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSSet", "NSString"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "0.6.2"

# Windows: Media Foundation cameras and Windows Graphics Capture for screens and windows.
# teamcraft-media's `gstreamer` feature would build the Media Foundation encoder element
# (`mfh264enc`), but needs the GStreamer MSVC runtime installed, so it stays off like on macOS.
[target.'cfg(target_os = "windows")'.dependencies]
teamcraft-media = { path = "../../crates/teamcraft-media", features = ["mediafoundation", "graphics-capture", "wasapi-loopback"] }

# Windows shell integration: the `teamcraft://` links (registered by the installer), handed to the
# running instance, and the "start at login" option (a registry Run entry).
[target.'cfg(windows)'.dependencies]
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
# OS idle time for the attention report: a safe wrapper of GetLastInputInfo (MIT/Apache-2.0; only
# windows-sys and anyhow, both already in the tree).
user-idle-time = { version = "0.7", default-features = false }
# Toasts with buttons and a reply field that can be replaced and withdrawn (WinRT; MIT/Apache-2.0,
# the version the notification plugin already pulls in).
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "Foundation_Collections", "UI_Notifications"] }

[features]
# Serve the embedded `dist` instead of the dev server URL. `cargo tauri build` enables it.
custom-protocol = ["tauri/custom-protocol"]
# Tests that need the dev stack (Keycloak on 8080).
integration = []

[dev-dependencies]
reqwest = { workspace = true, features = ["cookies"] }
# Tests encode and decode without downloading Cisco's OpenH264 (release builds load that instead).
teamcraft-media = { path = "../../crates/teamcraft-media", features = ["openh264-source"] }
