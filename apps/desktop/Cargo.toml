[package]
publish = false
name = "teamcraft-desktop"
description = "Tauri 2 shell for the TeamCraft desktop client (macOS and Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Leptos 0.8.2x and Tauri 2 need a newer compiler than the workspace baseline.
rust-version = "1.88"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The client core runs on the Rust side of the shell: encrypted store, sync engine, MLS.
teamcraft-core = { path = "../../crates/teamcraft-core", features = ["ui"] }
teamcraft-client-api = { path = "../../crates/teamcraft-client-api" }
teamcraft-crypto = { path = "../../crates/teamcraft-crypto" }
# Call media: WebTransport to the SFU, microphone and speakers, Opus, DAVE.
teamcraft-media = { path = "../../crates/teamcraft-media", features = ["native", "segmentation"] }
# Blocks on the effects pipeline's GPU setup on a blocking thread.
pollster = "1.0.1"
teamcraft-proto.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
anyhow = "1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "time", "sync", "macros"] }
# System browser for the OIDC login (RFC 8252): the webview never shows the identity provider.
tauri-plugin-opener = "2"
# Push-to-talk while another app has focus (Windows, macOS, X11).
tauri-plugin-global-shortcut = "2"
# System notifications for mentions and direct messages (the UI decides what to show).
tauri-plugin-notification = "2"
# Refresh token in the OS keyring (Secret Service on Linux, Keychain on macOS).
keyring = "4"
reqwest = { workspace = true, features = ["form"] }
# PKCE, state and token requests; HTTP goes through our own reqwest client.
oauth2 = { version = "5", default-features = false }
url = "2"

# Linux capture: the desktop portal (cameras, screens) and V4L2 cameras; hardware encoding through
# GStreamer's VA-API encoder.
[target.'cfg(target_os = "linux")'.dependencies]
teamcraft-media = { path = "../../crates/teamcraft-media", features = ["pipewire", "v4l2", "gstreamer"] }

# macOS cameras (AVFoundation); untested. teamcraft-media's `gstreamer` feature also builds the
# VideoToolbox encoder (`vtenc_h264`), but the dmg would then need GStreamer.framework bundled
# (macOS has no system GStreamer), so it stays off here until that packaging exists.
[target.'cfg(target_os = "macos")'.dependencies]
teamcraft-media = { path = "../../crates/teamcraft-media", features = ["avfoundation"] }

[features]
# Serve the embedded `dist` instead of the dev server URL. `cargo tauri build` enables it.
custom-protocol = ["tauri/custom-protocol"]
# Tests that need the dev stack (Keycloak on 8080).
integration = []

[dev-dependencies]
reqwest = { workspace = true, features = ["cookies"] }
# Tests encode and decode without downloading Cisco's OpenH264 (release builds load that instead).
teamcraft-media = { path = "../../crates/teamcraft-media", features = ["openh264-source"] }
