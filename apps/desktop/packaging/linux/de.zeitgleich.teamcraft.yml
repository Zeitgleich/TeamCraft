# Flatpak manifest: the primary Linux package. Builds from source inside the GNOME SDK, so the
# binary links against exactly the WebKitGTK, GStreamer and PipeWire the runtime ships.
#
#   apps/desktop/packaging/linux/build-flatpak.sh            # build (and optionally bundle/run)
#
# The web UI (crates/teamcraft-ui/dist, wasm32) is an input, built beforehand by build-ui.sh: the
# SDK's Rust extension has no wasm32 target, and the bundle is the same on every platform.
# Local builds fetch crates from the network (`--share=network` below); Flathub builds are
# offline, see README.md ("Flathub submission") for the vendored variant.
app-id: de.zeitgleich.teamcraft
runtime: org.gnome.Platform
# GNOME 51 = freedesktop-sdk 26.08: WebKitGTK 4.1, GStreamer 1.28 with the VA-API plugin,
# PipeWire; the GPU drivers (Mesa, incl. VA-API) come from the GL extension.
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # libclang for bindgen (the PipeWire bindings).
  - org.freedesktop.Sdk.Extension.llvm22
command: teamcraft-desktop

finish-args:
  # Server connection, and the loopback listener the OIDC login redirects to.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU: WebKit rendering, the effects shaders (wgpu) and VA-API video encoding.
  - --device=dri
  # Microphone and speakers: through PipeWire's own socket (below) where it runs, through the
  # PulseAudio protocol on systems without PipeWire (#1072).
  - --socket=pulseaudio
  # PipeWire itself: the call's microphone and speakers (devices, defaults and hotplug from its
  # registry), and screen shares with sound, where other applications' playback is linked into
  # our capture stream (the ScreenCast portal has no audio). Without it calls use the PulseAudio
  # socket and the "share sound" option is unavailable.
  - --filesystem=xdg-run/pipewire-0
  # Keys in the desktop's keyring (GNOME Keyring, KWallet/ksecretd), read once per start.
  - --talk-name=org.freedesktop.secrets
  # Mention and direct-message notifications.
  - --talk-name=org.freedesktop.Notifications
  # "Send to TeamCraft" in the file managers' menus (file_manager_entries.rs, a setting that is on by
  # default): the app writes its own entry files into these folders of the host, nothing else. The
  # menus run `flatpak run --file-forwarding`, which hands the files over through the document portal.
  # `:create` makes the folder where the file manager has none yet; Thunar keeps all its custom
  # actions in one file, which the app only merges its own action into.
  - --filesystem=xdg-data/kio/servicemenus:create
  - --filesystem=xdg-data/nautilus/scripts:create
  - --filesystem=xdg-data/nemo/actions:create
  - --filesystem=xdg-config/caja/scripts:create
  - --filesystem=xdg-config/Thunar:create
  # The tray icon (StatusNotifierItem, libayatana-appindicator built below): registering it with
  # the desktop's tray host. KDE Plasma, GNOME with the AppIndicator extension, and most other
  # panels implement this watcher.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Nothing else besides these folders: no home directory, no devices besides the GPU. Screen sharing (ScreenCast),
  # the camera (Camera), push-to-talk on Wayland (GlobalShortcuts), opening the login page
  # (OpenURI) and file dialogs (FileChooser) all go through portals, which need no permission
  # here; the desktop asks the user.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/teamcraft-desktop/cargo
    CARGO_TARGET_DIR: /run/build/teamcraft-desktop/target
    LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib
    # libclang outside its install prefix doesn't find its own headers (stdbool.h).
    BINDGEN_EXTRA_CLANG_ARGS: -I/usr/lib/sdk/llvm22/lib/clang/22/include
    # Echo cancellation: WebRTC's audio processing, built from source (meson and ninja are in
    # the SDK); see crates/teamcraft-media/README.md.
    # `-L /app/lib` first: the C++17 Abseil below must win over the SDK's when linking.
    RUSTFLAGS: --cfg teamcraft_audio_processing --cfg teamcraft_audio_processing_bundled -L native=/app/lib

modules:
  # The tray icon: the GNOME runtime has no libayatana-appindicator, which the tray crate loads
  # with dlopen (the app looks for it in /app/lib, apps/desktop/src/appindicator.rs). Built from
  # the upstream releases with its dependencies; headers and pkg-config files are only needed
  # while building and are cleaned up. Without the library the app runs without a tray icon.
  # intltool: only for libdbusmenu's configure, not shipped.
  - name: intltool
    cleanup:
      - "*"
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd
      # Perl ≥ 5.26 rejects intltool-update's unescaped braces (Debian's fix).
      - type: patch
        path: tray-patches/intltool-perl5.26-regex-fixes.patch

  # The menu over D-Bus (the latest release; the project has had none since).
  - name: libdbusmenu
    build-options:
      # Its sources use GLib API that is deprecated by now.
      cflags: -Wno-error
    config-opts:
      - --with-gtk=3
      - --disable-dumper
      - --disable-static
      - --disable-tests
      - --disable-gtk-doc
      - --enable-introspection=no
      - --disable-vala
    cleanup:
      - "*.la"
      - /include
      - /lib/pkgconfig
      - /libexec
      - /share/doc
      - /share/gtk-doc
    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
      # configure fails with --disable-tests: HAVE_VALGRIND is only defined when tests are on.
      - type: patch
        path: tray-patches/libdbusmenu-fix-have-valgrind.patch

  - name: ayatana-ido
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/girepository-1.0
      - /share/gir-1.0
      - /share/vala
    sources:
      - type: archive
        url: https://releases.ayatana-indicators.org/source/ayatana-ido/ayatana-ido-0.10.4.tar.gz
        sha256: df64cb09005d2f273d37c57438216e9239d91ae26c9cd1a4341e8eb8b6c7d88e

  # 0.9.5 and 0.6.1 below are tagged upstream but not yet on releases.ayatana-indicators.org, so
  # they come from the project's own tag archives.
  - name: libayatana-indicator
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    cleanup:
      - /include
      - /lib/pkgconfig
      - /libexec
      - /share
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-indicator/archive/refs/tags/0.9.5.tar.gz
        sha256: 73d71c908b803f12e4a5ecd8392511b58afbdd0c82ad7909611a17bb7847c5c8

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_BINDINGS_MONO=NO
      - -DENABLE_BINDINGS_VALA=NO
      - -DENABLE_GTKDOC=NO
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/girepository-1.0
      - /share/gir-1.0
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-appindicator/archive/refs/tags/0.6.1.tar.gz
        sha256: 56c0b938ffaa3e17b10c38d3e54c16d316f41f0da61949eda028adbf19ee767f

  # WebRTC's audio processing (echo cancellation) is C++17, and its Rust bindings are generated
  # with -std=c++17; the SDK's Abseil headers require C++20. A C++17 build of the Abseil release
  # it expects (the one in its meson wrap file) goes first in /app.
  - name: abseil-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_CXX_STANDARD=17
      - -DABSL_PROPAGATE_CXX_STD=ON
      - -DBUILD_SHARED_LIBS=ON
      - -DABSL_BUILD_TESTING=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/abseil/abseil-cpp/releases/download/20240722.0/abseil-cpp-20240722.0.tar.gz
        sha256: f50e5ac311a81382da7fa75b97310e4b9006474f9560ac46f54a9967f07d4ae3

  - name: teamcraft-desktop
    buildsystem: simple
    build-options:
      # Local builds only: crates.io. Flathub forbids this.
      build-args:
        - --share=network
    build-commands:
      # The shell, with the prebuilt UI embedded (the custom-protocol feature, as `cargo tauri
      # build` sets it).
      - test -f crates/teamcraft-ui/dist/index.html
      # With `--ccache` (the release workflow's cached builds) the cargo target and home live in
      # the ccache directory, which survives the build directory and is cached between runs. One
      # target per Rust version: a new compiler starts afresh and the old target is dropped.
      - >-
        if [ -n "${CCACHE_DIR:-}" ]; then
        rust="$(rustc -V | cksum | cut -d ' ' -f 1)";
        find "$CCACHE_DIR" -maxdepth 1 -name 'cargo-target-*' ! -name "cargo-target-$rust" -exec rm -rf {} +;
        mkdir -p "$CCACHE_DIR/cargo-target-$rust" "$CCACHE_DIR/cargo-home";
        ln -sfn "$CCACHE_DIR/cargo-target-$rust" "$CARGO_TARGET_DIR";
        ln -sfn "$CCACHE_DIR/cargo-home" "$CARGO_HOME";
        fi
      - cargo build --release --locked -p teamcraft-desktop --features custom-protocol
      - install -Dm755 "$CARGO_TARGET_DIR/release/teamcraft-desktop" /app/bin/teamcraft-desktop
      # Tauri's resource directory for an executable in /app/bin is /app/lib/<productName>.
      - install -Dm644 selfie_segmentation_landscape.onnx /app/lib/TeamCraft/models/selfie_segmentation_landscape.onnx
      - install -Dm644 apps/desktop/packaging/linux/de.zeitgleich.teamcraft.desktop /app/share/applications/de.zeitgleich.teamcraft.desktop
      - install -Dm644 apps/desktop/packaging/linux/de.zeitgleich.teamcraft.metainfo.xml /app/share/metainfo/de.zeitgleich.teamcraft.metainfo.xml
      # Small sizes are the glyph (scripts/brand/icons.py); the scalable icon is the full mark.
      - install -Dm644 apps/desktop/icons/32x32.png /app/share/icons/hicolor/32x32/apps/de.zeitgleich.teamcraft.png
      - install -Dm644 apps/desktop/icons/64x64.png /app/share/icons/hicolor/64x64/apps/de.zeitgleich.teamcraft.png
      - install -Dm644 apps/desktop/icons/128x128.png /app/share/icons/hicolor/128x128/apps/de.zeitgleich.teamcraft.png
      - install -Dm644 apps/desktop/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/de.zeitgleich.teamcraft.png
      - install -Dm644 apps/desktop/icons/icon.png /app/share/icons/hicolor/512x512/apps/de.zeitgleich.teamcraft.png
      - install -Dm644 assets/brand/icon.svg /app/share/icons/hicolor/scalable/apps/de.zeitgleich.teamcraft.svg
    sources:
      - type: dir
        path: ../../../..
        skip:
          - target
          - .git
          - .claude
          - apps/android
          - crates/teamcraft-media/models/selfie_segmentation_landscape.onnx
      # The background-effects model (crates/teamcraft-media/models/NOTICE.md), pinned like
      # models/fetch.sh does.
      - type: file
        url: https://huggingface.co/onnx-community/mediapipe_selfie_segmentation_landscape/resolve/2497d5bec26c626c7b3c4edc6e1fefc21b64f6c3/onnx/model.onnx
        sha256: 7a0adcfdb1715d3b0ff0f61486d8a181c33f4a208343a5abfccbc6540e872d24
        dest-filename: selfie_segmentation_landscape.onnx
