org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Development defaults: the dev stack on the host, reached through `adb reverse tcp:8080 tcp:8080`
# and `adb reverse tcp:8081 tcp:8081` (README.md). 127.0.0.1 rather than the emulator's 10.0.2.2,
# because Keycloak writes the host the device used into the token's issuer, and the server only
# accepts its configured issuer.
# Override per build: ./gradlew -Pteamcraft.serverUrl=https://chat.example.com ...
teamcraft.serverUrl=http://127.0.0.1:8081
teamcraft.oidcIssuer=http://127.0.0.1:8080/realms/teamcraft-dev
teamcraft.oidcClientId=teamcraft
# Redirect URI <scheme>:/oauth/callback; the dev realm's "teamcraft" client allows this one.
teamcraft.oidcRedirectScheme=com.example.teamcraft
# Firebase (FCM) of the "full" flavor; empty disables FCM, UnifiedPush still works.
teamcraft.fcmProjectId=
teamcraft.fcmApplicationId=
teamcraft.fcmApiKey=
teamcraft.fcmSenderId=
