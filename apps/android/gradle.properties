org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Public builds ship without a server: the app asks for the server address on first start (or takes
# it from the managed configuration, README.md "Server address"). A self-built app can name a default
# server; it is pre-selected like a managed one, but users can still change it.
# Override per build: ./gradlew -Pteamcraft.defaultServer=https://team.example.com ...
teamcraft.defaultServer=
# The push gateway store builds seal their FCM token for (the publisher's, e.g. https://push-gw.zeitgleich.de);
# empty: the gateway the server names (self-built apps).
teamcraft.pushGatewayUrl=
# Redirect URI <scheme>:/oauth/callback; the server's sign-in client must allow it (the dev realm's
# "teamcraft" client allows this one).
teamcraft.oidcRedirectScheme=de.zeitgleich.teamcraft
# Firebase (FCM) of the "full" flavor; empty disables FCM, UnifiedPush still works.
teamcraft.fcmProjectId=
teamcraft.fcmApplicationId=
teamcraft.fcmApiKey=
teamcraft.fcmSenderId=
