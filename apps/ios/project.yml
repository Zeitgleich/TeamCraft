name: TeamCraft
options:
  bundleIdPrefix: de.zeitgleich.teamcraft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    # Swift 5 language mode: the UniFFI-generated bindings and the Rust callbacks are not yet
    # strict-concurrency clean; revisit when the generator emits Sendable everywhere.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.15"
    CURRENT_PROJECT_VERSION: "1001599"
    # Strings come from the String Catalogs in Resources.
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # The Rust core (scripts/build-xcframework.sh) is a static library; it needs these system pieces.
    OTHER_LDFLAGS: "$(inherited) -lresolv -lc++"
    ENABLE_BITCODE: "NO"

targets:
  TeamCraft:
    type: application
    platform: iOS
    sources:
      - path: TeamCraft
        excludes:
          - "**/.DS_Store"
          - "Resources/TeamCraft.entitlements"
      - path: Shared
      # UniFFI Swift bindings, generated by scripts/build-xcframework.sh (not in git).
      - path: Generated/Swift
        optional: true
    dependencies:
      - target: NotificationService
        embed: true
      - framework: Generated/TeamCraftFFI.xcframework
        embed: false
        link: true
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFAudio.framework
      - sdk: AVFoundation.framework
      - sdk: VisionKit.framework
      - sdk: CoreFoundation.framework
      - sdk: CallKit.framework
      - sdk: Intents.framework
      - sdk: AuthenticationServices.framework
      - sdk: PushKit.framework
      - sdk: UserNotifications.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: BackgroundTasks.framework
      - sdk: Network.framework
      - sdk: PhotosUI.framework
      - sdk: QuickLook.framework
    entitlements:
      path: TeamCraft/Resources/TeamCraft.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        keychain-access-groups:
          - $(KEYCHAIN_ACCESS_GROUP)
        # Communication notifications (sender avatar and name in the notification).
        com.apple.developer.usernotifications.communication: true
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: TeamCraft/Resources/Info.plist
      properties:
        CFBundleDisplayName: TeamCraft
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # The brand colour with the white T of the app icon (Assets.xcassets).
        # Background only: the app's loading screen assembles the mark from there (issue #463).
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # audio: the call keeps running in the background; voip: lets the extension report incoming
        # calls to CallKit (CXProvider.reportNewIncomingVoIPPushPayload, docs/e2ee.md §7).
        # processing: the search index prefetch (BGProcessingTask while charging and online).
        UIBackgroundModes: [audio, voip, remote-notification, processing]
        BGTaskSchedulerPermittedIdentifiers: [de.zeitgleich.teamcraft.segment-prefetch]
        ITSAppUsesNonExemptEncryption: true
        NSMicrophoneUsageDescription: "TeamCraft uses the microphone for calls."
        NSCameraUsageDescription: "TeamCraft uses the camera for video calls, for photos you send and to scan the code of a new device you link."
        NSFaceIDUsageDescription: "TeamCraft uses Face ID to unlock the app when the app lock is on."
        NSUserActivityTypes: [INSendMessageIntent, INStartCallIntent]
        # CFBundleURLTypes: the OIDC redirect (ASWebAuthenticationSession handles it itself, but a
        # registered scheme keeps the dev realm's redirect URI valid on every iOS version).
        CFBundleURLTypes:
          - CFBundleURLName: oidc
            CFBundleURLSchemes: [$(TEAMCRAFT_OIDC_REDIRECT_SCHEME)]
        # Read by Shared/AppEnvironment.swift. No server: the user enters it (or MDM sets it).
        TCDefaultServerURL: $(TEAMCRAFT_DEFAULT_SERVER_URL)
        TCPushGatewayURL: $(TEAMCRAFT_PUSH_GATEWAY_URL)
        TCOidcRedirectScheme: $(TEAMCRAFT_OIDC_REDIRECT_SCHEME)
        TCAppGroupId: $(APP_GROUP_ID)
        TCKeychainAccessGroup: $(KEYCHAIN_ACCESS_GROUP)
        NSAppTransportSecurity:
          # The dev stack runs on plain HTTP on loopback; production uses HTTPS only (debug builds
          # also accept http to other devices, which ATS still refuses outside the local network).
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.zeitgleich.teamcraft
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - "*.entitlements"
      - path: Shared
      - path: Generated/Swift
        optional: true
    dependencies:
      - framework: Generated/TeamCraftFFI.xcframework
        embed: false
        link: true
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFAudio.framework
      - sdk: AVFoundation.framework
      - sdk: CoreFoundation.framework
      - sdk: CallKit.framework
      - sdk: Intents.framework
      - sdk: UserNotifications.framework
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: TeamCraft Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        NSUserActivityTypes: [INSendMessageIntent]
        # Read by NotificationService.swift: whether an empty content drops a notification.
        TCNotificationFiltering: $(NSE_NOTIFICATION_FILTERING)
        TCAppGroupId: $(APP_GROUP_ID)
        TCKeychainAccessGroup: $(KEYCHAIN_ACCESS_GROUP)
        TCOidcRedirectScheme: $(TEAMCRAFT_OIDC_REDIRECT_SCHEME)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.zeitgleich.teamcraft.notifications
        CODE_SIGN_ENTITLEMENTS: $(NSE_ENTITLEMENTS)
        SKIP_INSTALL: YES

  TeamCraftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TeamCraftTests
    dependencies:
      - target: TeamCraft
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.zeitgleich.teamcraft.Tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TeamCraft:
    build:
      targets:
        TeamCraft: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TeamCraftTests
    archive:
      config: Release
