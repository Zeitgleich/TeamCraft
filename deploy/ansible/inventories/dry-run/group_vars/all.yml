# test/dry-run.sh: everything local. sslip.io names resolve to the target's address, so clients on
# the control machine use the real host names without editing /etc/hosts.
teamcraft_domain: chat.172-31-250-10.sslip.io
teamcraft_sfu_domain: sfu.172-31-250-10.sslip.io
teamcraft_acme_email: admin@example.com
teamcraft_tls: internal

# Images built from the teamcraft repository and pushed to a registry on the test network; the
# script passes the digests (-e teamcraft_server_digest=... -e teamcraft_sfu_digest=...).
teamcraft_image_registry: 172.31.250.5:5000/zeitgleich
postgres_version: "18.6-alpine3.23"
caddy_version: "2.11.7"

# The dev stack of the teamcraft repository (Keycloak, Garage) runs on the control machine's
# loopback; the script forwards the same ports into the target, so URLs are equal on both sides.
teamcraft_oidc_issuer: http://127.0.0.1:8080/realms/teamcraft-dev
teamcraft_s3_endpoint: http://127.0.0.1:3900
teamcraft_s3_region: garage
teamcraft_s3_bucket: teamcraft-dev
teamcraft_s3_path_style: true

# 8080 is the forwarded Keycloak inside the target.
teamcraft_ports:
  postgres: 5432
  server: 8090
  sfu: 4433
  sfu_control: 8081

teamcraft_log_filter: info,teamcraft_server=debug

# Generated by the script outside the repository.
teamcraft_secrets_source: file
