- name: Load secrets (sops, decrypted on the control machine)
  ansible.builtin.set_fact:
    teamcraft_secrets_loaded: "{{ lookup('community.sops.sops', teamcraft_secrets_file) | from_yaml }}"
  no_log: true
  when: teamcraft_secrets_source == 'sops'

# Only for throwaway test targets (secrets/README.md): a plain file that never enters the repository.
- name: Load secrets (plain file)
  ansible.builtin.set_fact:
    teamcraft_secrets_loaded: "{{ lookup('ansible.builtin.file', teamcraft_secrets_file) | from_yaml }}"
  no_log: true
  when: teamcraft_secrets_source == 'file'

# The server gets the database password inside its connection URL; derive it here so the
# password is kept in one place.
- name: Derived secrets
  ansible.builtin.set_fact:
    teamcraft_secrets: >-
      {{ teamcraft_secrets_loaded | combine({'database_url': 'postgres://teamcraft:'
         ~ (teamcraft_secrets_loaded.postgres_password | urlencode | replace('/', '%2F'))
         ~ '@127.0.0.1:' ~ teamcraft_ports.postgres ~ '/teamcraft'}) }}
  no_log: true

- name: Required secrets are present
  ansible.builtin.assert:
    that: "item in teamcraft_secrets"
    fail_msg: "secret {{ item }} is missing (secrets/README.md)"
    quiet: true
  loop: "{{ teamcraft_services | map(attribute='secrets') | flatten | unique }}"

- name: Install Podman (quadlet needs >= 4.4) and rootless prerequisites
  ansible.builtin.package:
    name: [podman, catatonit, uidmap, passt, dbus-user-session, systemd-container]
    state: present

# Rootless containers can't bind < 1024; Caddy needs 80/443 (the setting covers IPv6 too).
- name: Allow unprivileged ports from 80
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "80"
    sysctl_file: /etc/sysctl.d/60-teamcraft.conf

- name: Group that may read the SFU certificate
  ansible.builtin.group:
    name: tc-certs

- name: Base directory
  ansible.builtin.file:
    path: "{{ teamcraft_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy each service under its own user
  ansible.builtin.include_tasks: service.yml
  loop: "{{ teamcraft_services }}"
  loop_control:
    loop_var: svc

- name: Restart services whose units, configs or secrets changed
  ansible.builtin.meta: flush_handlers
