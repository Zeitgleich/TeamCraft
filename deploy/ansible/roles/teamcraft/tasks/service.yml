- name: "Service user: {{ svc.name }}"
  ansible.builtin.user:
    name: "{{ svc.user }}"
    shell: /usr/sbin/nologin
    create_home: true
    groups: "{{ ['tc-certs'] if svc.name in ['caddy', 'teamcraft-sfu'] else [] }}"
    append: true
  register: teamcraft_svc_user

- name: "Remember uid: {{ svc.name }}"
  ansible.builtin.set_fact:
    teamcraft_uids: "{{ teamcraft_uids | default({}) | combine({svc.user: teamcraft_svc_user.uid}) }}"
    teamcraft_svc_env:
      XDG_RUNTIME_DIR: "/run/user/{{ teamcraft_svc_user.uid }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ teamcraft_svc_user.uid }}/bus"

- name: "Keep user systemd running without login: {{ svc.name }}"
  ansible.builtin.command: "loginctl enable-linger {{ svc.user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ svc.user }}"

- name: "Wait for the user's systemd instance: {{ svc.name }}"
  ansible.builtin.wait_for:
    path: "/run/user/{{ teamcraft_svc_user.uid }}/bus"
    timeout: 60

- name: "Directories: {{ svc.name }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ svc.user }}"
    group: "{{ svc.user }}"
    mode: "0750"
  loop:
    - "/home/{{ svc.user }}/.config"
    - "/home/{{ svc.user }}/.config/containers"
    - "/home/{{ svc.user }}/.config/containers/systemd"
    - "/home/{{ svc.user }}/.config/teamcraft-secrets"
    - "/home/{{ svc.user }}/config"

- name: "Podman secrets: {{ svc.name }}"
  ansible.builtin.shell: |
    set -o pipefail
    printf '%s' "$VALUE" | podman secret create --replace {{ item }} -
  args:
    executable: /bin/bash
  environment: "{{ teamcraft_svc_env | combine({'VALUE': teamcraft_secrets[item]}) }}"
  loop: "{{ svc.secrets }}"
  become: true
  become_user: "{{ svc.user }}"
  no_log: true
  changed_when: false

# podman can't tell whether a secret changed; a hash per secret can (and triggers the restart).
- name: "Secret fingerprints: {{ svc.name }}"
  ansible.builtin.copy:
    content: "{{ teamcraft_secrets[item] | hash('sha256') }}\n"
    dest: "/home/{{ svc.user }}/.config/teamcraft-secrets/{{ item }}.sha256"
    owner: "{{ svc.user }}"
    group: "{{ svc.user }}"
    mode: "0600"
  loop: "{{ svc.secrets }}"
  no_log: true
  register: teamcraft_svc_secrets

- name: "Configuration: {{ svc.name }}"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/home/{{ svc.user }}/config/{{ item }}"
    owner: "{{ svc.user }}"
    group: "{{ svc.user }}"
    # World-readable: the containers run as a subordinate uid, not as the service user, and only
    # see this file through its bind mount. No secrets in here (they are podman secrets).
    mode: "0644"
  loop: "{{ svc.configs }}"
  register: teamcraft_svc_configs

- name: "Web client: {{ svc.name }}"
  when: svc.name == 'teamcraft-server' and teamcraft_web_archive | length > 0
  block:
    - name: Web client directory
      ansible.builtin.file:
        path: /home/tc-server/web
        state: directory
        owner: tc-server
        group: tc-server
        mode: "0755"
    - name: Web client files
      ansible.builtin.unarchive:
        src: "{{ teamcraft_web_archive }}"
        dest: /home/tc-server/web
        owner: tc-server
        group: tc-server
      register: teamcraft_svc_web

- name: "Caddy data and SFU certificate export: {{ svc.name }}"
  when: svc.name == 'caddy'
  block:
    - name: Certificate directory (written by caddy, read by the SFU)
      ansible.builtin.file:
        path: "{{ teamcraft_cert_dir }}"
        state: directory
        owner: tc-proxy
        group: tc-certs
        mode: "0750"

    # Must exist before the container starts: it is a bind mount.
    - name: Caddy data and script directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: tc-proxy
        group: tc-proxy
        mode: "0750"
      loop:
        - /home/tc-proxy/caddy-data
        - /home/tc-proxy/bin
        - /home/tc-proxy/.config/systemd
        - /home/tc-proxy/.config/systemd/user

    - name: Export script
      ansible.builtin.template:
        src: sfu-cert-export.sh.j2
        dest: /home/tc-proxy/bin/sfu-cert-export.sh
        owner: tc-proxy
        group: tc-proxy
        mode: "0750"

    - name: Export service and timer
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/home/tc-proxy/.config/systemd/user/{{ item }}"
        owner: tc-proxy
        group: tc-proxy
        mode: "0644"
      loop: [sfu-cert-export.service, sfu-cert-export.timer]

- name: "Quadlet unit: {{ svc.name }}"
  ansible.builtin.template:
    src: "{{ svc.name }}.container.j2"
    dest: "/home/{{ svc.user }}/.config/containers/systemd/{{ svc.name }}.container"
    owner: "{{ svc.user }}"
    group: "{{ svc.user }}"
    mode: "0644"
  register: teamcraft_svc_unit

- name: "Mark for restart: {{ svc.name }}"
  ansible.builtin.set_fact:
    teamcraft_changed_services: "{{ teamcraft_changed_services | default([]) + [svc.name] }}"
  when: >-
    teamcraft_svc_unit.changed or teamcraft_svc_configs.changed or teamcraft_svc_secrets.changed
    or (teamcraft_svc_web.changed | default(false))
  changed_when: true
  notify: Restart changed services

# Pulling the image happens on the first start; give it time on a slow line.
- name: "Start: {{ svc.name }}"
  ansible.builtin.systemd_service:
    name: "{{ svc.name }}.service"
    state: started
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ svc.user }}"
  environment: "{{ teamcraft_svc_env }}"

- name: "SFU certificate: {{ svc.name }}"
  when: svc.name == 'caddy'
  block:
    - name: Enable the export timer
      ansible.builtin.systemd_service:
        name: sfu-cert-export.timer
        state: started
        enabled: true
        daemon_reload: true
        scope: user
      become: true
      become_user: tc-proxy
      environment: "{{ teamcraft_svc_env }}"

    # The SFU starts next and needs the certificate; Caddy obtains it within seconds (internal) or
    # a minute (ACME), then the export copies it over.
    - name: Wait for Caddy's SFU certificate
      ansible.builtin.wait_for:
        path: "{{ teamcraft_caddy_cert_dir }}/{{ teamcraft_sfu_domain }}/{{ teamcraft_sfu_domain }}.crt"
        timeout: 300

    - name: Export it now
      ansible.builtin.systemd_service:
        name: sfu-cert-export.service
        state: started
        scope: user
      become: true
      become_user: tc-proxy
      environment: "{{ teamcraft_svc_env }}"
      changed_when: false

- name: "Restart on a renewed certificate (SFU only): {{ svc.name }}"
  when: svc.name == 'teamcraft-sfu'
  block:
    - name: Systemd user directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: tc-sfu
        group: tc-sfu
        mode: "0750"
      loop: [/home/tc-sfu/.config/systemd, /home/tc-sfu/.config/systemd/user]

    - name: Watch path and service
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/home/tc-sfu/.config/systemd/user/{{ item }}"
        owner: tc-sfu
        group: tc-sfu
        mode: "0644"
      loop: [sfu-cert-watch.path, sfu-cert-watch.service]

    - name: Enable the watch
      ansible.builtin.systemd_service:
        name: sfu-cert-watch.path
        state: started
        enabled: true
        daemon_reload: true
        scope: user
      become: true
      become_user: tc-sfu
      environment: "{{ teamcraft_svc_env }}"
