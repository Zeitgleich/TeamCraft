# TeamCraft server configuration. Every option is listed with its default; options without a
# default are required. Copy to teamcraft.toml and run:  teamcraft-server --config teamcraft.toml
#
# Any value can be overridden by an environment variable: prefix TEAMCRAFT_, nesting separated by
# a double underscore, e.g. TEAMCRAFT_DATABASE__URL or TEAMCRAFT_OIDC__ROLES__GUEST.
# The config file path can also be given as TEAMCRAFT_CONFIG.

[server]
# Address of the HTTP listener. TLS is terminated by the reverse proxy. "[::]" is a dual-stack
# socket (IPv4 and IPv6); use e.g. "127.0.0.1:8080" or "[::1]:8080" to bind a single address.
listen_addr = "[::]:8080"
# Number (0-1023) of this instance in generated IDs. Must be unique per running server instance.
worker_id = 0
# How many months of message partitions are created ahead of time (in addition to the current one).
partitions_ahead_months = 3

[database]
# Required. Prefer the environment variable TEAMCRAFT_DATABASE__URL for the password.
url = "postgres://teamcraft:teamcraft-dev-only@127.0.0.1:5432/teamcraft"
max_connections = 10
acquire_timeout_secs = 5

[oidc]
# Required. Issuer of the OIDC provider (reference setup: a Keycloak realm). Must equal the `iss`
# claim of the tokens; the server fetches <issuer>/.well-known/openid-configuration for the keys.
issuer = "http://127.0.0.1:8080/realms/teamcraft-dev"
# Public client the apps log in with; tokens must be issued to it (`azp` or `aud`). Its client
# roles are read from `resource_access.<client_id>.roles`.
client_id = "teamcraft"
# Confidential client with a service account (reserved for the admin API and back-channel logout).
server_client = "teamcraft-server"
# Optional: use this key set URL instead of the one in the discovery document, e.g. when the
# server reaches the provider through an internal address.
# jwks_uri = "http://keycloak.internal:8080/realms/teamcraft-dev/protocol/openid-connect/certs"
# Accepted signature algorithms.
algorithms = ["RS256", "ES256", "EdDSA"]
# Tolerated clock difference when checking token expiry.
leeway_secs = 30
# How long signing keys are used before they are fetched again.
jwks_cache_ttl_secs = 3600
# Minimum time between two key fetches (also protects against floods of unknown key IDs).
jwks_min_refresh_interval_secs = 30
# Timeout of requests to the provider.
http_timeout_secs = 10

# TeamCraft role = client role of `client_id` in the provider. Users with several roles get the
# highest (owner > admin > member > guest); users with none of them are rejected.
# Example for an existing setup: guest = "external"
[oidc.roles]
owner = "owner"
admin = "admin"
member = "member"
guest = "guest"

# Deprovisioning (docs/admin.md §3.2): poll the provider's admin API with the service account of
# `server_client` and deactivate users that were disabled, deleted or lost all TeamCraft roles.
# Back-channel logout (POST /api/v1/auth/backchannel-logout) ends sessions immediately; register that
# URL at the `client_id` client in the provider.
[oidc.sync]
is_enabled = false
interval_secs = 300
initial_delay_secs = 30
# Secret of `server_client`. Prefer TEAMCRAFT_OIDC__SYNC__CLIENT_SECRET. The dev realm uses:
# client_secret = "teamcraft-server-dev-secret"
# Admin API of the realm; derived from the issuer when it looks like <base>/realms/<realm>.
# admin_url = "http://127.0.0.1:8080/admin/realms/teamcraft-dev"
page_size = 100

[logging]
# `tracing` filter, e.g. "info" or "teamcraft_server=debug,info". The RUST_LOG variable wins.
filter = "info"
# "pretty" for humans, "json" for log collectors.
format = "pretty"

# Instance policies (PLAN.md §12, §13). Later these become signed, runtime-editable policy.
[policy]
# Guests can only open DMs with people they share a conversation with (and vice versa).
guests_dm_only_with_shared_conversations = true
# Pending invites only apply to accounts whose provider verified the email address.
invites_require_verified_email = true

[limits]
max_ciphertext_bytes = 1048576
max_mentions_per_message = 200
max_group_dm_participants = 8
max_name_length = 100
max_text_length = 1000
default_page_size = 50
max_page_size = 200
max_directory_results = 50
# Unused MLS key packages per device, their size and the count per upload.
max_key_packages_per_device = 200
max_key_package_bytes = 16384
max_key_packages_per_upload = 100
# One MLS commit/welcome/proposal/application message, and welcomes per commit.
max_mls_payload_bytes = 1048576
max_welcomes_per_commit = 500
# Encrypted key bag and wrapped backup keys of one user.
max_key_bag_bytes = 1048576

# WebSocket gateway at /api/v1/gateway.
[gateway]
heartbeat_interval_secs = 30
# A connection without any frame for this long is closed.
heartbeat_timeout_secs = 90
# How long a disconnected session can still be resumed, and how many events are kept for it.
resume_window_secs = 120
resume_buffer_events = 1000
identify_timeout_secs = 10
# Connections are closed after this long so a fresh token is checked; clients resume.
connection_max_age_secs = 3600
# A device that disconnected only counts as offline after this grace period.
presence_offline_grace_secs = 5
max_frame_bytes = 65536

# Relay that connects two devices of one user while linking a new device (/api/v1/rendezvous).
[rendezvous]
ttl_secs = 300
max_frame_bytes = 16384
# Total bytes relayed per rendezvous (both directions) and frames held until the peer joins.
max_total_bytes = 262144
max_pending_frames = 8
# Open relays per user.
max_per_user = 5
join_timeout_secs = 10

# S3-compatible storage for encrypted attachments. Without this section the attachment endpoints
# answer 503. The values below match the dev stack (Garage); change the keys in any real deployment.
[storage]
# Endpoint that clients can reach: they upload and download through presigned URLs.
endpoint = "http://127.0.0.1:3900"
region = "garage"
bucket = "teamcraft-dev"
access_key = "GKdeadbeef0000000000000000"
secret_key = "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
# Garage and MinIO need path-style addressing (endpoint/bucket/key).
path_style = true
presign_expiry_secs = 900
# Largest attachment (as stored, i.e. ciphertext) a client may announce.
max_attachment_bytes = 104857600

# Background job that enforces retention: deletes ciphertext, attachments and index segments older
# than a channel's retention and drops emptied month partitions. The policy (signed by owners) holds
# the defaults and limits; channel and space settings are made through the API.
[retention]
is_enabled = true
interval_secs = 3600
initial_delay_secs = 60
# Months of message partitions kept ready ahead of time; the job tops them up.
partitions_ahead_months = 3

# Push notifications: encrypted wake-ups (the payload is sealed with the device's push key, e2ee.md §7).
# Web Push works with a VAPID key pair; APNs, FCM and UnifiedPush are stubs for now.
[push]
# 32 random bytes as base64url, e.g. from `openssl rand -base64 32 | tr '+/' '-_' | tr -d '='`. Keep it
# secret (prefer TEAMCRAFT_PUSH__VAPID_PRIVATE_KEY). Browsers subscribe with its public key, which the
# server logs at startup.
# vapid_private_key = "..."
vapid_subject = "mailto:admin@example.com"
ttl_secs = 3600
request_timeout_secs = 10
max_concurrent_sends = 32
# Development only: allow http and private addresses as Web Push endpoints.
allow_private_endpoints = false

# Calls through the SFU (ARCHITECTURE.md §6). Without this section the join-token endpoint answers
# 503. The server signs short-lived join tokens; the SFU verifies them with the public key:
#   openssl genpkey -algorithm ed25519 -out call-signing.pem
#   openssl pkey -in call-signing.pem -pubout -out call-signing.pub.pem   # for the SFU
# [calls]
# WebTransport URL of the SFU that clients connect to.
# sfu_url = "https://sfu.example.com:4433/call"
# `iss` of join tokens; the SFU is configured with the same value.
# issuer = "https://chat.example.com"
# signing_key_path = "/etc/teamcraft/call-signing.pem"
# Join tokens are only checked when joining, so keep them short-lived.
# join_token_ttl_secs = 60
# A conversation's call gets a new id once no join token was issued for this long.
# call_idle_secs = 43200
# The SFU reports who joins and leaves calls to /api/internal/v1/calls/participants/{joined,left}
# with this bearer token; the server turns that into the call roster and call_* gateway events.
# Prefer the environment variable TEAMCRAFT_CALLS__SFU_REGISTRATION_TOKEN.
# sfu_registration_token = "..."
# DMs and group DMs ring until somebody else joins or this many seconds pass.
# ring_timeout_secs = 30
