# TeamCraft server configuration. Every option is listed with its default; options without a
# default are required. Copy to teamcraft.toml and run:  teamcraft-server --config teamcraft.toml
#
# Any value can be overridden by an environment variable: prefix TEAMCRAFT_, nesting separated by
# a double underscore, e.g. TEAMCRAFT_DATABASE__URL or TEAMCRAFT_OIDC__ROLES__GUEST.
# The config file path can also be given as TEAMCRAFT_CONFIG.

[server]
# Address of the HTTP listener. TLS is terminated by the reverse proxy. "[::]" is a dual-stack
# socket (IPv4 and IPv6); use e.g. "127.0.0.1:8080" or "[::1]:8080" to bind a single address.
listen_addr = "[::]:8080"
# Number (0-1023) of this instance in generated IDs. Must be unique per running server instance.
worker_id = 0
# How many months of message partitions are created ahead of time (in addition to the current one).
partitions_ahead_months = 3

[database]
# Required. Prefer the environment variable TEAMCRAFT_DATABASE__URL for the password.
url = "postgres://teamcraft:teamcraft-dev-only@127.0.0.1:5432/teamcraft"
max_connections = 10
acquire_timeout_secs = 5

[oidc]
# Required. Issuer of the OIDC provider (reference setup: a Keycloak realm). Must equal the `iss`
# claim of the tokens; the server fetches <issuer>/.well-known/openid-configuration for the keys.
issuer = "http://127.0.0.1:8080/realms/teamcraft-dev"
# Public client the apps log in with; tokens must be issued to it (`azp` or `aud`). Its client
# roles are read from `resource_access.<client_id>.roles`.
client_id = "teamcraft"
# Confidential client with a service account (reserved for the admin API and back-channel logout).
server_client = "teamcraft-server"
# Optional: use this key set URL instead of the one in the discovery document, e.g. when the
# server reaches the provider through an internal address.
# jwks_uri = "http://keycloak.internal:8080/realms/teamcraft-dev/protocol/openid-connect/certs"
# Accepted signature algorithms.
algorithms = ["RS256", "ES256", "EdDSA"]
# Tolerated clock difference when checking token expiry.
leeway_secs = 30
# How long signing keys are used before they are fetched again.
jwks_cache_ttl_secs = 3600
# Minimum time between two key fetches (also protects against floods of unknown key IDs).
jwks_min_refresh_interval_secs = 30
# Timeout of requests to the provider.
http_timeout_secs = 10

# TeamCraft role = client role of `client_id` in the provider. Users with several roles get the
# highest (owner > admin > member > guest); users with none of them are rejected.
# Example for an existing setup: guest = "external"
[oidc.roles]
owner = "owner"
admin = "admin"
member = "member"
guest = "guest"

# Deprovisioning (docs/admin.md §3.2): poll the provider's admin API with the service account of
# `server_client` and deactivate users that were disabled, deleted or lost all TeamCraft roles.
# Back-channel logout (POST /api/v1/auth/backchannel-logout) ends sessions immediately; register that
# URL at the `client_id` client in the provider.
[oidc.sync]
is_enabled = false
interval_secs = 300
initial_delay_secs = 30
# Secret of `server_client`. Prefer TEAMCRAFT_OIDC__SYNC__CLIENT_SECRET. The dev realm uses:
# client_secret = "teamcraft-server-dev-secret"
# Admin API of the realm; derived from the issuer when it looks like <base>/realms/<realm>.
# admin_url = "http://127.0.0.1:8080/admin/realms/teamcraft-dev"
page_size = 100
# Mirror the provider's top-level groups as user groups (@handle) with their members.
sync_groups = false

[logging]
# `tracing` filter, e.g. "info" or "teamcraft_server=debug,info". The RUST_LOG variable wins.
filter = "info"
# "pretty" for humans, "json" for log collectors.
format = "pretty"

# Instance policies (PLAN.md §12, §13). Later these become signed, runtime-editable policy.
[policy]
# Guests can only open DMs with people they share a conversation with (and vice versa).
guests_dm_only_with_shared_conversations = true
# Pending invites only apply to accounts whose provider verified the email address.
invites_require_verified_email = true
# IDs of spaces every new member joins on their first sign-in, and of public channels of those
# spaces they join with them (IDs as shown in the admin console). Applied once per account;
# guests and bots get none.
default_spaces = []
default_channels = []

[limits]
max_ciphertext_bytes = 1048576
max_mentions_per_message = 200
max_group_dm_participants = 8
max_name_length = 100
max_text_length = 1000
default_page_size = 50
max_page_size = 200
max_directory_results = 50
# Largest avatar image in bytes (PNG, JPEG or WebP).
max_avatar_bytes = 1048576
# How long a request for organization recovery waits for admin approvals.
org_recovery_request_ttl_secs = 86400
# Largest sealed share or sealed backup key the server stores for a recovery.
max_recovery_blob_bytes = 8192
# Longest title, department and similar profile text, in characters.
max_profile_text_chars = 100
# Most members of one user group.
max_user_group_members = 5000
# Unread counts look at this many of the newest unread messages per conversation; a count equal to it
# means "that many or more" (clients show "1000+"). Keeps the cost independent of huge unread backlogs.
max_unread_counted = 1000
# Unused MLS key packages per device, their size and the count per upload.
max_key_packages_per_device = 200
max_key_package_bytes = 16384
max_key_packages_per_upload = 100
# One MLS commit/welcome/proposal/application message, and welcomes per commit.
max_mls_payload_bytes = 1048576
max_welcomes_per_commit = 500
# Encrypted key bag and wrapped backup keys of one user.
max_key_bag_bytes = 1048576
# One signed device list.
max_device_list_bytes = 65536
# Active devices per user.
max_devices_per_user = 20
# Attachments per user that are announced but not uploaded yet, and the bytes of all of a user's attachments.
max_pending_attachments_per_user = 20
max_attachment_bytes_per_user = 21474836480
# Meeting e-mails per organizer and hour (the rest of the invitees are told in the app only).
max_meeting_mails_per_user_per_hour = 200

# WebSocket gateway at /api/v1/gateway.
[gateway]
heartbeat_interval_secs = 30
# A connection without any frame for this long is closed.
heartbeat_timeout_secs = 90
# How long a disconnected session can still be resumed, and how many events are kept for it.
resume_window_secs = 120
resume_buffer_events = 1000
identify_timeout_secs = 10
# Connections are closed after this long so a fresh token is checked; clients resume.
connection_max_age_secs = 3600
# A device that disconnected only counts as offline after this grace period.
presence_offline_grace_secs = 5
max_frame_bytes = 65536

# Relay that connects two devices of one user while linking a new device (/api/v1/rendezvous).
[rendezvous]
ttl_secs = 300
max_frame_bytes = 16384
# Total bytes relayed per rendezvous (both directions) and frames held until the peer joins.
max_total_bytes = 262144
max_pending_frames = 8
# Open relays per user.
max_per_user = 5
join_timeout_secs = 10

# S3-compatible storage for encrypted attachments. Without this section the attachment endpoints
# answer 503. The values below match the dev stack (Garage); change the keys in any real deployment.
[storage]
# Endpoint that clients can reach: they upload and download through presigned URLs.
endpoint = "http://127.0.0.1:3900"
region = "garage"
bucket = "teamcraft-dev"
access_key = "GKdeadbeef0000000000000000"
secret_key = "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
# Garage and MinIO need path-style addressing (endpoint/bucket/key).
path_style = true
presign_expiry_secs = 900
# Largest attachment (as stored, i.e. ciphertext) a client may announce.
max_attachment_bytes = 104857600

# Background job that enforces retention: deletes ciphertext, attachments and index segments older
# than a channel's retention and drops emptied month partitions. The policy (signed by owners) holds
# the defaults and limits; channel and space settings are made through the API.
[retention]
is_enabled = true
interval_secs = 3600
initial_delay_secs = 60
# Months of message partitions kept ready ahead of time; the job tops them up.
partitions_ahead_months = 3

# Notification defaults and the repeat scheduler for urgent direct messages: an urgent DM or group DM
# is pushed again every `urgent_repeat_interval_secs` until the recipient acknowledges it or it was
# pushed `urgent_max_pushes` times in total.
[notifications]
# Users who never chose send read receipts in DMs and group DMs (receipts are reciprocal).
read_receipts_default = true
urgent_repeat_interval_secs = 120
urgent_max_pushes = 5
urgent_scheduler_interval_secs = 15
# While a desktop device of a user is active, pushes to their phones wait this long and are sent only
# if the message is still unread; 0 pushes at once.
mobile_push_delay_secs = 120

# Integration channels (ARCHITECTURE.md §4.5): channels flagged `is_integration` receive machine output
# (logs, monitoring, CI) from a bridge. They push only for @mentions and get this retention.
[integration]
# Days; 0 sets no retention. A channel's own retention setting wins.
default_retention_days = 30

# Guests: external people with a sponsor and an expiry (PLAN.md §12).
[guests]
# Guests added or invited without an explicit expiry expire this many days later; 0 = never.
default_expiry_days = 90
# If not empty, guests can only be invited with e-mail addresses of these domains and their subdomains.
allowed_email_domains = []
# How often expired guests are removed from their spaces and channels (their sponsor is told).
expiry_check_interval_secs = 3600

# Request limits and response hardening of the API.
[security]
# Largest request body; bigger ones get 413 (ciphertext and MLS payloads have smaller limits in [limits]).
max_request_body_bytes = 4194304
# Send Strict-Transport-Security; enable when a TLS-terminating proxy serves the API.
hsts = false
# Behind a reverse proxy that sets X-Forwarded-For: count clients by its last entry. Leave off when
# clients connect directly, since anybody could forge the header. IMPORTANT behind a proxy: with this
# off every client has the proxy's address, shares one rate limit, and bad tokens from anybody block
# everybody (the server warns once when it sees X-Forwarded-For from a private address).
trust_forwarded_for = false

# Per-minute token buckets (burst = the same number), in memory per instance. A first line against
# abuse; the reverse proxy's limits come on top.
[security.rate_limits]
is_enabled = true
# All requests of one client address (IPv6 clients count per /64).
ip_requests_per_minute = 1200
# Writes (POST/PUT/PATCH/DELETE) of one authenticated user.
user_writes_per_minute = 600
# Requests without credentials: guest join, back-channel logout, internal endpoints.
public_requests_per_minute = 30
# Failed authentications (401) per address; when used up, that address gets 429 until it refills.
auth_failures_per_minute = 30

# The web client: the `trunk build` output of crates/teamcraft-ui, served at `/` (unknown paths get
# index.html, `/api/...` stays the API, `/f/<id>` is the share-link download page). Assets with a
# content hash in their name are cached forever; everything gets the CSP below plus nosniff and
# no-referrer. Without static_dir only the API is served.
[web]
# static_dir = "/srv/teamcraft/web"
# content_security_policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; ...; connect-src {connect_src}; ..."
# {connect_src} becomes 'self' plus the origins of the identity provider, the SFU and the storage (taken
# from their sections) and connect_origins; the web client cannot send data anywhere else. For a
# stricter policy add e.g. "require-trusted-types-for 'script'" after testing the web client with it.
# connect_origins = ["https://other.example.com"]
# The small static download page of share links (/f/<id>): download.html plus the files it uses, served
# under /f-assets/. {{sri:<file>}} in download.html becomes that file's Subresource Integrity value.
# Without it /f/<id> serves the app shell.
# share_page_dir = "/srv/teamcraft/share-page"
# share_page_content_security_policy = "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; ..."

# Meetings (PLAN.md §9): scheduled and instant meetings with their own chat. Without this section the
# /meetings endpoints answer 503.
# [meetings]
# Public base URL of this server; join links are <base>/meeting/<id> and the host names iCalendar UIDs.
# public_base_url = "https://chat.example.com"
# Organizer of calendar events when the organizer has no e-mail address.
# organizer_fallback_address = "meetings@example.com"
# max_invitees = 200
# Required. Signs the personal join links and guest sessions; at least 32 random bytes. Prefer
# TEAMCRAFT_MEETINGS__GUEST_TOKEN_SECRET (e.g. `openssl rand -base64 48`).
# guest_token_secret = "..."
# Guests may use their link until this long after the meeting's end.
# guest_grace_secs = 7200
# Shared secret of the inbox handler that forwards RSVP e-mail (iMIP REPLY) to
# POST /api/internal/v1/meetings/replies with `Authorization: Bearer <token>`. The handler vouches for
# the sender (DKIM/SPF). Without it that endpoint answers 503. Prefer TEAMCRAFT_MEETINGS__INBOX_TOKEN.
# inbox_token = "..."
#
# Events are written to this CalDAV calendar (CalCraft in the reference setup). All meetings go to
# this one collection, written by one account. Without this section nothing is stored in a calendar.
# [meetings.caldav]
# calendar_url = "https://cal.example.com/dav/calendars/teamcraft/meetings/"
# username = "teamcraft"
# Prefer TEAMCRAFT_MEETINGS__CALDAV__PASSWORD; an app password works.
# password = "..."
# request_timeout_secs = 10
# Where one user's calendar lives ({email} is their address). With it the server asks for the busy
# periods of people who are online and shows them as "in a meeting" (CalDAV free-busy report).
# free_busy_url_template = "https://cal.example.com/dav/calendars/{email}/personal/"
#
# Invitations go out as iMIP e-mail (text/calendar + invite.ics). Without this section no mail is sent.
# [meetings.smtp]
# host = "smtp.example.com"
# port = 587
# "start_tls" (default; the upgrade is required), "tls" (port 465) or "none" (local mail catcher only).
# security = "start_tls"
# username = "teamcraft"
# Prefer TEAMCRAFT_MEETINGS__SMTP__PASSWORD.
# password = "..."
# from_address = "meetings@example.com"
# from_name = "TeamCraft"
# timeout_secs = 20
#
# Texts of the invitation e-mails (translate them here). Placeholders: {title} {organizer} {start}
# {end} (UTC) {description} {join_url}.
# [meetings.mail_texts]
# invitation_subject = "Invitation: {title}"
# invitation_body = "{organizer} invites you to \"{title}\".\n\nStart: {start}\nEnd: {end}\n\n{description}\nJoin: {join_url}\n"
# update_subject = "Updated: {title}"
# update_body = "{organizer} changed \"{title}\".\n\nStart: {start}\nEnd: {end}\n\n{description}\nJoin: {join_url}\n"
# cancellation_subject = "Cancelled: {title}"
# cancellation_body = "{organizer} cancelled \"{title}\" ({start}).\n"

# Push notifications: encrypted wake-ups (the payload is sealed with the device's push key, e2ee.md §7).
# Web Push works with a VAPID key pair; APNs, FCM and UnifiedPush are stubs for now.
[push]
# 32 random bytes as base64url, e.g. from `openssl rand -base64 32 | tr '+/' '-_' | tr -d '='`. Keep it
# secret (prefer TEAMCRAFT_PUSH__VAPID_PRIVATE_KEY). Browsers subscribe with its public key, which the
# server logs at startup.
# vapid_private_key = "..."
vapid_subject = "mailto:admin@example.com"
ttl_secs = 3600
request_timeout_secs = 10
max_concurrent_sends = 32
# Development only: allow http and private addresses as Web Push endpoints.
allow_private_endpoints = false

# Calls through the SFU (ARCHITECTURE.md §6). Without this section the join-token endpoint answers
# 503. The server signs short-lived join tokens; the SFU verifies them with the public key:
#   openssl genpkey -algorithm ed25519 -out call-signing.pem
#   openssl pkey -in call-signing.pem -pubout -out call-signing.pub.pem   # for the SFU
# [calls]
# WebTransport URL of the SFU that clients connect to.
# sfu_url = "https://sfu.example.com:4433/call"
# `iss` of join tokens; the SFU is configured with the same value.
# issuer = "https://chat.example.com"
# signing_key_path = "/etc/teamcraft/call-signing.pem"
# Join tokens are only checked when joining, so keep them short-lived.
# join_token_ttl_secs = 60
# A conversation's call gets a new id once no join token was issued for this long.
# call_idle_secs = 43200
# The SFU reports who joins and leaves calls to /api/internal/v1/calls/participants/{joined,left}
# with this bearer token; the server turns that into the call roster and call_* gateway events.
# Prefer the environment variable TEAMCRAFT_CALLS__SFU_REGISTRATION_TOKEN.
# sfu_registration_token = "..."
# DMs and group DMs ring until somebody else joins or this many seconds pass.
# ring_timeout_secs = 30
# Where the SFU takes host controls (mute all, remove, lock, end for everyone) on its internal listener;
# the registration token above authenticates this server. Without it those controls answer 503.
# sfu_control_url = "http://sfu.internal:8081"

# E-mail the server sends on its own: invitations to spaces and channels (meeting invitations use [meetings]).
[mail]
# public_base_url = "https://chat.example.com"
# invite_subject = "{inviter} invited you to {space}"
# invite_body = "{inviter} invited you to \"{space}\" as {role}.\n\nSign in with this e-mail address to join: {url}\n"
# [mail.smtp]
# host = "smtp.example.com"
# port = 587
# security = "start_tls"
# username = "teamcraft"
# password = "set via TEAMCRAFT_MAIL__SMTP__PASSWORD"
# from_address = "no-reply@example.com"
# from_name = "TeamCraft"

# Derived presence: "in a meeting" and "in a call" statuses, and the away timeout (PLAN.md §4).
[presence]
# How often derived statuses and the away timeout are re-evaluated for online users.
auto_status_interval_secs = 30
# How often the calendar server is asked who is busy (needs meetings.caldav.free_busy_url_template).
calendar_poll_interval_secs = 300
# Busy periods starting within this time are fetched, so the status switches on at their start.
calendar_lookahead_secs = 900

# Share links for external download (e2ee.md §4.5.1): anyone with <base>/f/<id>#<file-key> downloads one
# file's ciphertext; the key stays in the fragment. Who may create links is the create_share_link
# permission (members yes, guests no by default).
[shares]
is_enabled = true
default_expiry_days = 7
max_expiry_days = 30
# Most downloads a link may allow; 0 = no cap. Links made without a limit get the cap.
max_downloads_cap = 0
# Public URL of this server without trailing slash; shown as <base>/f/<id> in the API.
public_base_url = ""
max_links_per_user = 500
